<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light">
<title>GOLF SC. 開始画面 15案</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
:root{color-scheme:light;--jp:"Zen Kaku Gothic New",system-ui,"Hiragino Sans",sans-serif;--num:"Barlow Condensed","Zen Kaku Gothic New",sans-serif;--bg:#F1F4F3;--fg:#0B1310;--mut:#66746D;--line:#E0E6E3;--turf:#0E9F62;--deep:#0B6B44;--gold:#E3A81A}
*{box-sizing:border-box}body{margin:0;background:#D9DEDB;color:var(--fg);font-family:var(--jp);line-height:1.5}
main{max-width:1420px;margin:0 auto;padding:24px 16px 60px}h1{font-size:22px;margin:0 0 4px}.lead{font-size:15px;color:#48564F;margin:0 0 20px}
.grid{display:flex;flex-wrap:wrap;gap:34px 26px}.item{width:320px}.item h3{font-size:16px;margin:0 0 2px}.item>p{font-size:13.5px;color:#48564F;margin:0 0 8px;min-height:62px}
.ph{width:320px;height:569px;border-radius:26px;overflow:hidden;box-shadow:0 14px 34px -14px rgba(0,0,0,.5);border:1px solid #BCC4C0;position:relative;background:var(--bg)}
.sc{width:375px;height:667px;transform:scale(.8533);transform-origin:0 0;position:relative;display:flex;flex-direction:column;background:var(--bg)}
.hd{display:flex;align-items:center;gap:9px;padding:14px 18px 6px}.hd img{width:40px;height:40px}.hd b{font:700 25px/1 var(--num);letter-spacing:.03em;display:block}.hd small{font:600 8.5px var(--num);letter-spacing:.2em;color:var(--mut)}
.bd{flex:1;padding:6px 16px 0;display:flex;flex-direction:column;min-height:0}
.tt{font-size:23px;font-weight:900;margin:6px 2px 10px}
.tabs{height:60px;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);text-align:center;font-size:12px;font-weight:700;color:var(--mut);padding-top:8px}.tabs i{display:block;width:22px;height:22px;margin:0 auto 2px;border:2px solid currentColor;border-radius:6px;opacity:.8}.tabs .on{color:var(--turf)}
.seg{display:grid;grid-template-columns:1fr 1fr;background:#DDE2DF;border-radius:13px;padding:3px;margin-bottom:10px}.seg span{height:38px;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;color:var(--mut);border-radius:10px}.seg .on{background:#fff;color:var(--fg);box-shadow:0 1px 4px rgba(0,0,0,.14)}
.gp{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-bottom:10px}
.rw{display:flex;align-items:center;gap:10px;min-height:48px;padding:0 14px;border-top:1px solid var(--line)}.rw:first-child{border-top:0}.rw .l{font-size:15px;font-weight:700;color:var(--mut);white-space:nowrap}.rw .v{flex:1;text-align:right;font-size:16px;font-weight:700}.rw .v small{display:block;font-size:13px;font-weight:500;color:var(--mut)}.rw .c{color:#9AA5A0;font-size:18px}
.go{height:56px;border-radius:18px;background:var(--fg);color:#fff;font-size:17px;font-weight:900;display:flex;align-items:center;justify-content:center;gap:8px;margin-top:4px}.go.g{background:linear-gradient(110deg,#0E9F62,#12A5B8)}.go.gd{background:linear-gradient(110deg,#B57E00,#F2C14E 50%,#B57E00);color:#2A1B00}
.ic{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:#fff;font:700 15px var(--num);flex:none}
.mu{color:var(--mut)}.n{font-family:var(--num)}
.av{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:900;color:#fff;flex:none}
.chip{display:inline-flex;align-items:center;height:34px;padding:0 13px;border-radius:99px;background:#fff;border:1px solid var(--line);font-size:14px;font-weight:700;margin:0 6px 6px 0}
.u{border-bottom:2px solid var(--turf);font-weight:900;padding:0 2px}
</style></head><body><main>
<h1>ラウンドを始める画面　15案</h1>
<p class="lead">入れる中身（入力のしかた・名前・日付・コース・グリーン・一緒に回る・ゲーム・始める）は同じで、見せ方だけを変えた絵です。まだアプリには入っていません。</p>
<div class="grid" id="g"></div>
</main><script>
var HD='<div class="hd"><img src="../mark.png" alt=""><div><b>GOLF SC.</b><small>SHORT COURSE SCORECARD</small></div></div>';
var TABS='<div class="tabs"><span class="on"><i></i>記録</span><span><i></i>分析</span><span><i></i>履歴</span><span><i></i>コース</span></div>';
var SEG='<div class="seg"><span class="on">くわしく記録</span><span>スコアカード</span></div>';
var C='日向シーサイドGC', CS='宮崎県・9H パー27', D='11月20日(金)', M='体操きんたろう', G='ニアピン', P='かまきり';
function rw(l,v,c,ic){return '<div class="rw">'+(ic||'')+'<span class="l">'+l+'</span><span class="v">'+v+'</span>'+(c===0?'':'<span class="c">›</span>')+'</div>';}
function icn(t,col){return '<span class="ic" style="background:'+col+'">'+t+'</span>';}
var FLAG='<svg viewBox="0 0 120 90" preserveAspectRatio="xMidYMid slice" style="width:100%;height:100%;display:block"><rect width="120" height="90" fill="#BFE8D2"/><ellipse cx="60" cy="78" rx="70" ry="26" fill="#2FB67A"/><ellipse cx="66" cy="70" rx="38" ry="12" fill="#57CF95"/><rect x="74" y="28" width="2" height="42" fill="#0B1310"/><path d="M76 28 L96 35 L76 42Z" fill="#E5484D"/><circle cx="52" cy="70" r="3" fill="#fff"/><circle cx="24" cy="18" r="9" fill="#FFE9A6"/></svg>';
var V=[
["1 今の形（リスト）","設定アプリのような、白いリスト。今アプリに入っている形。",function(){return '<div class="tt">ラウンドを始める</div>'+SEG+'<div class="gp">'+rw('名前',P,0)+rw('日付',D)+rw('コース',C+'<small>'+CS+'</small>')+rw('グリーン','MG',0)+'</div><div class="gp">'+rw('一緒に回る',M)+rw('ゲーム',G)+'</div><div class="go">始める →</div>';}],
["2 コースが主役","今日のコースを、緑の大きなカードで見せる。ほかは下に小さく。",function(){return SEG+'<div style="border-radius:20px;background:linear-gradient(135deg,#0E9F62,#12A5B8);color:#fff;padding:18px;margin-bottom:10px"><div class="n" style="font-size:12px;letter-spacing:.2em;opacity:.85">TODAY\'S COURSE</div><div style="font-size:24px;font-weight:900;margin-top:4px">'+C+'</div><div style="font-size:14px;opacity:.9">'+CS+'</div><div style="display:flex;gap:8px;margin-top:14px"><span style="background:rgba(255,255,255,.22);border-radius:99px;padding:5px 12px;font-size:14px;font-weight:700">'+D+'</span><span style="background:#fff;color:#0B6B44;border-radius:99px;padding:5px 12px;font-size:14px;font-weight:900">MG</span><span style="margin-left:auto;font-size:14px;font-weight:700;align-self:center">変える ›</span></div></div><div class="gp">'+rw('名前',P,0)+rw('一緒に回る',M)+rw('ゲーム',G)+'</div><div class="go">始める →</div>';}],
["3 アイコンつきのリスト","今の形に、色つきの小さな絵を足す。ぱっと見で場所が分かる。",function(){return '<div class="tt">ラウンドを始める</div>'+SEG+'<div class="gp">'+rw('名前',P,0,icn('人','#2F7DE1'))+rw('日付',D,1,icn('日','#E07B12'))+rw('コース',C,1,icn('旗','#0E9F62'))+rw('グリーン','MG',0,icn('G','#22A06B'))+'</div><div class="gp">'+rw('一緒に回る',M,1,icn('友','#8B5CF6'))+rw('ゲーム',G,1,icn('★','#E3A81A'))+'</div><div class="go">始める →</div>';}],
["4 タイル（2列）","6つの項目を、同じ大きさの四角に並べる。押しやすい。",function(){function t(l,v,s){return '<div style="background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px 14px;min-height:82px"><div style="font-size:13px;font-weight:700;color:var(--mut)">'+l+'</div><div style="font-size:17px;font-weight:900;margin-top:6px;line-height:1.25">'+v+'</div>'+(s?'<div style="font-size:13px;color:var(--mut)">'+s+'</div>':'')+'</div>';}
 return '<div class="tt">ラウンドを始める</div>'+SEG+'<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px">'+t('名前',P)+t('日付',D)+t('コース',C)+t('グリーン','MG')+t('一緒に回る',M)+t('ゲーム',G)+'</div><div class="go">始める →</div>';}],
["5 スコアカード風","結果のカードと同じ、緑の帯の紙のカード。アプリ全体の見た目がそろう。",function(){return SEG+'<div style="background:#FBFAF4;border-radius:16px;overflow:hidden;box-shadow:0 8px 20px -12px rgba(0,0,0,.4);margin-bottom:12px"><div style="background:#0B6B44;color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:flex-end"><b style="font-size:17px;font-weight:900">'+C+'</b><span class="n" style="font-size:15px;font-weight:600">2026.11.20</span></div><div style="padding:14px 16px"><div class="n mu" style="font-size:11px;letter-spacing:.2em">PLAYER</div><div style="font-size:19px;font-weight:900">'+P+'</div><table style="width:100%;border-collapse:collapse;margin-top:12px;font-size:15px"><tr><td style="border:1px solid #CFCBBB;background:#EFECE0;padding:9px;width:104px;color:#5B665F;font-weight:700">グリーン</td><td style="border:1px solid #CFCBBB;padding:9px;font-weight:900;text-align:right">MG</td></tr><tr><td style="border:1px solid #CFCBBB;background:#EFECE0;padding:9px;color:#5B665F;font-weight:700">一緒に回る</td><td style="border:1px solid #CFCBBB;padding:9px;font-weight:900;text-align:right">'+M+' ›</td></tr><tr><td style="border:1px solid #CFCBBB;background:#EFECE0;padding:9px;color:#5B665F;font-weight:700">ゲーム</td><td style="border:1px solid #CFCBBB;padding:9px;font-weight:900;text-align:right">'+G+' ›</td></tr></table></div></div><div class="go" style="background:#0B6B44">始める →</div>';}],
["6 チケット（半券）","日付を大きく左に。切り取り線のある、入場券のようなカード。",function(){return SEG+'<div style="display:flex;background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 8px 20px -12px rgba(0,0,0,.4);margin-bottom:12px"><div style="width:92px;background:#0B1310;color:#fff;text-align:center;padding:18px 0;border-right:2px dashed #F1F4F3"><div class="n" style="font-size:14px;letter-spacing:.14em;opacity:.8">NOV</div><div class="n" style="font-size:52px;font-weight:700;line-height:1">20</div><div style="font-size:14px;font-weight:700">金曜日</div></div><div style="flex:1;padding:14px 14px 12px"><div style="font-size:18px;font-weight:900;line-height:1.3">'+C+'</div><div style="font-size:13px;color:var(--mut)">'+CS+'・MG</div><div style="margin-top:10px;font-size:14px;font-weight:700">'+P+'<span class="mu"> ＋ </span>'+M+'</div><div style="font-size:14px;font-weight:700;color:#B07D00">ゲーム：'+G+'</div></div></div><div class="gp">'+rw('変える','コース・人・ゲーム')+'</div><div class="go">始める →</div>';}],
["7 大きな文字","コース名と日付を大きな文字で。雑誌の表紙のように、すっきり。",function(){return SEG+'<div style="padding:8px 4px 0"><div class="n mu" style="font-size:13px;letter-spacing:.2em">2026.11.20 FRI</div><div style="font-size:33px;font-weight:900;line-height:1.2;margin:4px 0 2px">日向シーサイド<br>ゴルフクラブ</div><div style="font-size:14px;color:var(--mut)">'+CS+'・<b style="color:var(--fg)">MG</b></div><div style="height:2px;background:var(--fg);margin:14px 0 10px"></div><div style="display:flex;justify-content:space-between;font-size:16px;font-weight:700;padding:7px 0;border-bottom:1px solid var(--line)"><span class="mu">名前</span><span>'+P+'</span></div><div style="display:flex;justify-content:space-between;font-size:16px;font-weight:700;padding:7px 0;border-bottom:1px solid var(--line)"><span class="mu">一緒に回る</span><span>'+M+' ›</span></div><div style="display:flex;justify-content:space-between;font-size:16px;font-weight:700;padding:7px 0 14px"><span class="mu">ゲーム</span><span>'+G+' ›</span></div></div><div class="go">始める →</div>';}],
["8 黒い画面","黒い地に、緑の「始める」。記録の前の気分が引きしまる。",function(){return '<div style="margin:-6px -16px 0;padding:6px 16px 14px;background:#0B1310;color:#fff;flex:1;display:flex;flex-direction:column"><div class="tt" style="color:#fff">ラウンドを始める</div><div class="seg" style="background:#1F2A26"><span class="on" style="background:#33423C;color:#fff;box-shadow:none">くわしく記録</span><span style="color:#8FA39A">スコアカード</span></div>'+[['名前',P],['日付',D],['コース',C],['グリーン','MG'],['一緒に回る',M],['ゲーム',G]].map(function(x){return '<div style="display:flex;justify-content:space-between;padding:11px 2px;border-bottom:1px solid #26332E;font-size:16px;font-weight:700"><span style="color:#8FA39A;font-size:15px">'+x[0]+'</span><span>'+x[1]+'</span></div>';}).join('')+'<div class="go g" style="margin-top:14px">始める →</div></div>';}],
["9 絵のある画面","上にグリーンと旗の絵。下の白いシートに項目。明るく楽しい。",function(){return '<div style="margin:-6px -16px 0;height:128px">'+FLAG+'</div><div style="margin:-18px -16px 0;background:#fff;border-radius:22px 22px 0 0;padding:14px 16px 0;flex:1;position:relative"><div style="font-size:20px;font-weight:900;margin-bottom:8px">ラウンドを始める</div>'+SEG+[['名前',P],['日付',D],['コース',C+'（MG）'],['一緒に回る',M],['ゲーム',G]].map(function(x){return '<div style="display:flex;justify-content:space-between;padding:8px 2px;border-bottom:1px solid var(--line);font-size:16px;font-weight:700"><span class="mu" style="font-size:15px">'+x[0]+'</span><span>'+x[1]+'</span></div>';}).join('')+'<div class="go g" style="margin-top:12px">始める →</div></div>';}],
["10 丸い札（チップ）","決まっていることを、丸い札で並べる。押すと変えられる。場所をとらない。",function(){return '<div class="tt">ラウンドを始める</div>'+SEG+'<div class="mu" style="font-size:13px;font-weight:700;margin:4px 2px 6px">いつ・どこで</div><div><span class="chip">'+D+'</span><span class="chip">'+C+'</span><span class="chip" style="background:#0B6B44;color:#fff;border-color:#0B6B44">MG</span></div><div class="mu" style="font-size:13px;font-weight:700;margin:8px 2px 6px">だれと</div><div><span class="chip" style="background:var(--fg);color:#fff;border-color:var(--fg)">'+P+'</span><span class="chip">'+M+'</span><span class="chip" style="border-style:dashed;color:var(--mut)">＋ 追加</span></div><div class="mu" style="font-size:13px;font-weight:700;margin:8px 2px 6px">ゲーム</div><div><span class="chip" style="background:#FFF1BF;border-color:#E3A81A;color:#3A2600">'+G+'</span></div><div style="flex:1"></div><div class="go" style="margin-bottom:14px">始める →</div>';}],
["11 文章で見せる","今日のラウンドを、1つの文にする。下線のところを押すと変えられる。",function(){return '<div class="tt">ラウンドを始める</div>'+SEG+'<div style="background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px 16px;font-size:19px;font-weight:500;line-height:2.05;margin-bottom:12px"><span class="u">'+D+'</span>、<br><span class="u">'+C+'</span> の <span class="u">MG</span> を、<br><span class="u">'+P+'</span> と <span class="u">'+M+'</span> で回る。<br>ゲームは <span class="u">'+G+'</span>。</div><div class="go">始める →</div>';}],
["12 3つの手順","①コース ②メンバー ③ゲーム を順に見せる。はじめての人にも分かりやすい。",function(){function st(n,l,v,s){return '<div style="display:flex;gap:12px;align-items:flex-start;background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:8px"><span class="n" style="width:30px;height:30px;border-radius:50%;background:var(--turf);color:#fff;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:700;flex:none">'+n+'</span><div style="flex:1"><div class="mu" style="font-size:13px;font-weight:700">'+l+'</div><div style="font-size:17px;font-weight:900">'+v+'</div>'+(s?'<div class="mu" style="font-size:13px">'+s+'</div>':'')+'</div><span style="color:#9AA5A0;font-size:18px;align-self:center">›</span></div>';}
 return '<div class="tt">ラウンドを始める</div>'+SEG+st(1,'コースと日付',C,D+'・MG')+st(2,'メンバー',P+'・'+M,'2人')+st(3,'ゲーム',G,'')+'<div class="go">始める →</div>';}],
["13 前回と同じで始める","いつものメンバー・コースなら、大きなボタン1つで始められる。変えるときだけ下を開く。",function(){return '<div class="tt">ラウンドを始める</div><div style="background:#fff;border:2px solid var(--turf);border-radius:20px;padding:16px;margin-bottom:10px"><div style="font-size:13px;font-weight:700;color:var(--turf)">前回と同じ　・　'+D+'</div><div style="font-size:20px;font-weight:900;margin-top:2px">'+C+'<span style="font-size:14px;color:var(--mut)">　MG</span></div><div style="font-size:15px;font-weight:700;margin-top:2px">'+P+'・'+M+'<span class="mu">　／　'+G+'</span></div><div class="go g" style="margin-top:12px">このまま始める →</div></div><div class="gp">'+rw('入力のしかた','くわしく記録')+rw('コースを変える','')+rw('メンバーを変える','')+rw('ゲームを変える','')+'</div>';}],
["14 メンバーが主役","回る人を、丸い頭文字で大きく並べる。4人のときに楽しい。",function(){function a(t,n,c){return '<div style="text-align:center;width:72px"><div class="av" style="background:'+c+';margin:0 auto;width:54px;height:54px;font-size:21px">'+t+'</div><div style="font-size:13px;font-weight:700;margin-top:4px;line-height:1.2">'+n+'</div></div>';}
 return '<div class="tt">ラウンドを始める</div>'+SEG+'<div style="background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px 8px 12px;margin-bottom:10px"><div style="display:flex;justify-content:center;gap:6px">'+a('か',P,'#0B1310')+a('体','体操<br>きんたろう','#2F7DE1')+'<div style="text-align:center;width:72px"><div class="av" style="margin:0 auto;width:54px;height:54px;background:#fff;border:2px dashed #B9C2BB;color:#9AA5A0;font-size:26px">＋</div><div class="mu" style="font-size:13px;font-weight:700;margin-top:4px">追加</div></div></div></div><div class="gp">'+rw('日付',D)+rw('コース',C)+rw('グリーン','MG',0)+rw('ゲーム',G)+'</div><div class="go">始める →</div>';}],
["15 金の「始める」","今の形のまま、「始める」だけを金色に。ベストのカードの金とそろう。",function(){return '<div class="tt">ラウンドを始める</div>'+SEG+'<div class="gp">'+rw('名前',P,0)+rw('日付',D)+rw('コース',C+'<small>'+CS+'</small>')+rw('グリーン','MG',0)+'</div><div class="gp">'+rw('一緒に回る',M)+rw('ゲーム',G)+'</div><div class="go gd">始める →</div>';}]
];
var h='';for(var i=0;i<V.length;i++)h+='<div class="item"><h3>'+V[i][0]+'</h3><p>'+V[i][1]+'</p><div class="ph"><div class="sc">'+HD+'<div class="bd">'+V[i][2]()+'</div>'+TABS+'</div></div></div>';
document.getElementById('g').innerHTML=h;
</script></body></html>
