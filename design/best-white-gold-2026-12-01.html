<h1>ベストのカード「白い紙 × 金の帯」のパターン 14案</h1>
<p class="lead">前の20案の12番をもとに、帯・数字・枠・星・光の筋を変えました。動く見本です（まだアプリには入っていません）。保存した画像では、星も光も止まった絵になります。</p>

function sum(a,f,t){var x=0;for(var i=f;i<t;i++)x+=a[i];return x;}
function tp(d){return d===0?"±0":(d>0?"+":"−")+Math.abs(d);}
function tbl(p,par,lab,o){o=o||{};var N=par.length,h='';
 for(var f=0;f<N;f+=9){var t=Math.min(f+9,N),sm=N>9;
  var cols=[];for(var i=f;i<t;i++)cols.push(i);
