<style>
/* Layout: a paper scorecard — sticky tab strip, one column of ruled panels, numbers set in condensed figures */
:root{
  --bg:#F1F4F3; --paper:#FFFFFF; --fg:#0B1310; --muted:#66746D; --line:#E0E6E3; --soft:#EEF2F0;
  --turf:#0E9F62; --turf-ink:#FFFFFF; --flag:#F2B01E; --accent2:#13A9C2;
  --under:#E5484D; --over:#3E63DD; --warn:#F08C1A;
  --c1:#0E9F62; --c2:#F2B01E; --c3:#3E63DD; --c4:#E5484D; --c5:#8B5CF6; --c6:#13A9C2;
  --q-hio:#D9A514; --q-eagle:#0A6B4B; --q-birdie:#10A56B; --q-par:#62D3A2; --q-bogey:#C3CDD5; --q-double:#F4A091; --q-triple:#E5484D; --q-neutral:#C3CDD5;
  --rec-bg:#EEF2F0; --rec-surface:#FFFFFF; --rec-raise:#EEF3F0; --rec-line:#DDE5E1; --rec-fg:#0B1310; --rec-muted:#6E7C75;
  --rec-sel:#0B1310; --rec-sel-ink:#FFFFFF; --rec-turf:#0E9F62; --rec-turf-hi:#2FD58C; --rec-under:#E5484D; --rec-over:#3E63DD; --rec-warn:#F08C1A; --rec-fade:rgba(238,242,240,0);
  --glow:rgba(14,159,98,.18); --shadow:0 1px 2px rgba(11,19,16,.04),0 8px 24px rgba(11,19,16,.06);
  --f-body:"Zen Kaku Gothic New",system-ui,"Hiragino Sans","Yu Gothic",sans-serif;
  --f-num:"Barlow Condensed","Zen Kaku Gothic New",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#070C0A; --paper:#0F1714; --fg:#ECF4EF; --muted:#8B9A92; --line:#1F2C26; --soft:#16211C;
  --turf:#2EE59D; --turf-ink:#03130B; --flag:#FFC53D; --accent2:#3BD3EA; --under:#FF6B6B; --over:#7AA2FF; --warn:#FFA94D;
  --c1:#2EE59D; --c2:#FFC53D; --c3:#7AA2FF; --c4:#FF6B6B; --c5:#B59CFF; --c6:#3BD3EA;
  --q-hio:#FFC53D; --q-eagle:#139E6C; --q-birdie:#2EE59D; --q-par:#94F0C8; --q-bogey:#4A5965; --q-double:#FF9E8A; --q-triple:#FF5A5F; --q-neutral:#4A5965;
  --rec-bg:#070C0A; --rec-surface:#0F1714; --rec-raise:#17221D; --rec-line:#22312A; --rec-fg:#ECF4EF; --rec-muted:#8B9A92;
  --rec-sel:#ECF4EF; --rec-sel-ink:#070C0A; --rec-turf:#17B877; --rec-turf-hi:#2EE59D; --rec-under:#FF6B6B; --rec-over:#7AA2FF; --rec-warn:#FFA94D; --rec-fade:rgba(7,12,10,0);
  --glow:rgba(46,229,157,.22); --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#070C0A; --paper:#0F1714; --fg:#ECF4EF; --muted:#8B9A92; --line:#1F2C26; --soft:#16211C;
  --turf:#2EE59D; --turf-ink:#03130B; --flag:#FFC53D; --accent2:#3BD3EA; --under:#FF6B6B; --over:#7AA2FF; --warn:#FFA94D;
  --c1:#2EE59D; --c2:#FFC53D; --c3:#7AA2FF; --c4:#FF6B6B; --c5:#B59CFF; --c6:#3BD3EA;
  --q-hio:#FFC53D; --q-eagle:#139E6C; --q-birdie:#2EE59D; --q-par:#94F0C8; --q-bogey:#4A5965; --q-double:#FF9E8A; --q-triple:#FF5A5F; --q-neutral:#4A5965;
  --rec-bg:#070C0A; --rec-surface:#0F1714; --rec-raise:#17221D; --rec-line:#22312A; --rec-fg:#ECF4EF; --rec-muted:#8B9A92;
  --rec-sel:#ECF4EF; --rec-sel-ink:#070C0A; --rec-turf:#17B877; --rec-turf-hi:#2EE59D; --rec-under:#FF6B6B; --rec-over:#7AA2FF; --rec-warn:#FFA94D; --rec-fade:rgba(7,12,10,0);
  --glow:rgba(46,229,157,.22); --shadow:none; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.6}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(96px + env(safe-area-inset-bottom,0px))}
header.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:14px 2px;flex-wrap:wrap}
.brand{font-weight:900;font-size:17px;letter-spacing:.02em;display:flex;align-items:center;gap:10px}
.brand svg{width:22px;height:26px}
.sync{font-size:12px;color:var(--muted)}
.sync b{color:var(--turf);font-weight:700}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--paper);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding:4px max(8px,env(safe-area-inset-right,0px)) calc(4px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
nav.tabs button{font:inherit;font-weight:700;font-size:11px;background:none;border:0;color:var(--muted);padding:6px 0 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;letter-spacing:.04em}
nav.tabs svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-selected="true"]{color:var(--turf)}
nav.tabs button[aria-selected="true"] svg{stroke-width:2.3}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--flag);outline-offset:2px}
body.recording{background:var(--rec-bg);color:var(--rec-fg)}
body.recording nav.tabs,body.recording header.top{display:none}
section.view{display:flex;flex-direction:column;gap:14px;padding-top:12px}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:var(--shadow)}
h2{font-size:17px;margin:0;font-weight:900;text-wrap:balance}
h3{font-size:13px;margin:0 0 10px;font-weight:700;color:var(--muted);letter-spacing:.06em}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
.field{display:flex;flex-direction:column;gap:4px;flex:1 1 160px;min-width:0}
.field label{font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.04em}
input,select{font:inherit;font-size:16px;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%;min-width:0}
.btn{font:inherit;font-weight:700;font-size:15px;border-radius:10px;padding:11px 16px;cursor:pointer;border:1px solid var(--line);background:var(--paper);color:var(--fg)}
.btn.primary{background:linear-gradient(120deg,var(--turf),var(--accent2));color:var(--turf-ink);border-color:transparent}
.btn.danger{color:var(--under);border-color:var(--under);background:transparent}
.btn.small{font-size:13px;padding:6px 10px;border-radius:8px}
.btn:disabled{opacity:.45;cursor:default}
.muted{color:var(--muted)}
.empty{text-align:center;padding:28px 12px;color:var(--muted)}
.empty strong{display:block;color:var(--fg);font-size:16px;margin-bottom:4px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}

/* record screen: a launch-monitor style input — gradient hole card, colour-coded score cells */
.rec{display:flex;flex-direction:column;gap:12px;padding-top:10px;padding-bottom:calc(92px + env(safe-area-inset-bottom,0px));color:var(--rec-fg)}
.rec-top{display:flex;align-items:center;gap:10px}
.icon-btn{width:38px;height:38px;flex:0 0 38px;border-radius:50%;border:1px solid var(--rec-line);background:var(--rec-surface);color:var(--rec-fg);display:flex;align-items:center;justify-content:center;cursor:pointer}
.icon-btn svg{width:18px;height:18px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round}
.rec-who{flex:1;min-width:0;line-height:1.25}
.rec-who b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rec-who span{font-size:11px;color:var(--rec-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.rec-total{text-align:right;line-height:1}
.rec-total .num{font-size:30px;font-weight:700}
.rec-total small{display:block;font-size:11px;color:var(--rec-muted);margin-top:3px}
.dots{display:flex;gap:4px}
.dots button{flex:1 1 0;min-width:0;height:34px;border:1px solid var(--rec-line);border-radius:8px;background:var(--rec-surface);color:var(--rec-muted);font-family:var(--f-num);font-size:14px;font-weight:700;cursor:pointer;padding:0;line-height:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.dots button small{font-size:8px;font-weight:600;opacity:.75;letter-spacing:.04em}
.dots button.r-under{background:color-mix(in srgb,var(--rec-under) 14%,var(--rec-surface));color:var(--rec-under);border-color:transparent}
.dots button.r-par{background:color-mix(in srgb,var(--rec-turf) 14%,var(--rec-surface));color:var(--rec-turf);border-color:transparent}
.dots button.r-bogey{background:color-mix(in srgb,var(--rec-over) 14%,var(--rec-surface));color:var(--rec-over);border-color:transparent}
.dots button.r-worse{background:var(--rec-fg);color:var(--rec-bg);border-color:transparent}
.dots button.cur{outline:2px solid var(--rec-fg);outline-offset:1px}
.dots.two{flex-wrap:wrap}.dots.two button{flex:0 0 calc((100% - 32px)/9)}
.hole-card{position:relative;overflow:hidden;border-radius:24px;padding:16px 18px 14px;color:#fff;background:linear-gradient(135deg,#08261C 0%,#0B6B44 55%,#0E8FA0 100%);box-shadow:0 12px 28px -14px rgba(8,38,28,.7)}
.hole-card::before{content:"";position:absolute;right:-70px;top:-60px;width:260px;height:220px;border-radius:50%;background:repeating-radial-gradient(ellipse at center,rgba(255,255,255,.13) 0 1px,transparent 1px 14px);pointer-events:none}
.hole-card .row1{display:flex;justify-content:space-between;align-items:flex-end;position:relative}
.hole-card .lbl{font-size:10px;font-weight:700;letter-spacing:.22em;opacity:.7}
.hole-card .hno{font-family:var(--f-num);font-size:84px;font-weight:700;line-height:.82;letter-spacing:-.02em}
.hole-card .hno small{font-size:20px;opacity:.6;font-weight:600;margin-left:4px;letter-spacing:0}
.hole-card .meta{text-align:right;display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.hole-card .par{font-family:var(--f-num);font-size:34px;font-weight:700;line-height:1}
.hole-card .par span{font-size:13px;opacity:.7;margin-right:4px;letter-spacing:.12em}
.hole-card .yd{font-family:var(--f-num);font-size:14px;opacity:.75}
.badge{display:inline-flex;align-items:center;gap:6px;margin-top:12px;position:relative;font-size:12px;font-weight:900;letter-spacing:.14em;padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.14);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.badge i{width:8px;height:8px;border-radius:50%;background:currentColor}
.badge.b-under{color:#FFB3AD}.badge.b-par{color:#9DF5C9}.badge.b-bogey{color:#B9CCFF}.badge.b-worse{color:#fff}
.badge.hio{background:linear-gradient(120deg,#F2B01E,#FFD76A);color:#3A2600}
.rec-card{background:var(--rec-surface);border:1px solid var(--rec-line);border-radius:24px;padding:14px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow);touch-action:pan-y}
.slide-l{animation:slideL .22s ease-out}.slide-r{animation:slideR .22s ease-out}
@keyframes slideL{from{opacity:.2;transform:translateX(28px)}to{opacity:1;transform:none}}
@keyframes slideR{from{opacity:.2;transform:translateX(-28px)}to{opacity:1;transform:none}}
.eyebrow{display:block;font-size:10px;font-weight:700;letter-spacing:.2em;color:var(--rec-muted)}
.seg-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:7px}
.seg-head .eyebrow{font-size:11px}
.seg-head .eyebrow b{font-family:var(--f-body);letter-spacing:.04em;margin-left:6px;color:var(--rec-fg);font-size:11px}
.seg-head .hint{font-size:11px;color:var(--rec-turf);font-weight:700}
.seg{display:grid;gap:5px}
.seg.s8{grid-template-columns:repeat(8,1fr)}
.seg.s6{grid-template-columns:repeat(6,1fr)}
.seg button{height:54px;border-radius:12px;border:1px solid var(--rec-line);background:var(--rec-bg);color:var(--rec-fg);font-family:var(--f-num);font-size:23px;font-weight:700;cursor:pointer;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;line-height:1;transition:transform .08s}
.seg button small{font-family:var(--f-body);font-size:7.5px;letter-spacing:.06em;color:var(--rec-muted);font-weight:700}
.seg.s6 button{height:46px}
.seg button:active{transform:scale(.93)}
.seg button[aria-pressed="true"]{color:#fff;border-color:transparent;box-shadow:0 8px 16px -8px var(--sel)}
.seg button[aria-pressed="true"] small{color:rgba(255,255,255,.85)}
.seg button.t-under{--sel:var(--rec-under)}.seg button.t-par{--sel:var(--rec-turf)}.seg button.t-bogey{--sel:var(--rec-over)}.seg button.t-worse{--sel:#2B3530}
.seg button[aria-pressed="true"]{background:var(--sel)}
.greenpad{position:relative;height:172px}
.greenpad .rough{position:absolute;inset:0;border-radius:18px;background:var(--rec-raise);background-image:radial-gradient(circle,var(--rec-line) 1px,transparent 1.2px);background-size:12px 12px}
.greenpad button{position:absolute;font:inherit;font-weight:700;font-size:13px;border:1px solid var(--rec-line);background:var(--rec-surface);color:var(--rec-fg);border-radius:999px;cursor:pointer;padding:0;transition:transform .08s;display:flex;align-items:center;justify-content:center;gap:4px}
.greenpad button svg{width:12px;height:12px;stroke:currentColor;stroke-width:2.4;fill:none;stroke-linecap:round;stroke-linejoin:round}
.greenpad button:active{transform:scale(.95)}
.gp-on{left:26%;right:26%;top:24%;bottom:24%;border-radius:50%!important;border:0!important;color:#fff!important;flex-direction:column;gap:2px!important;background:repeating-radial-gradient(ellipse at 52% 46%,rgba(255,255,255,.10) 0 1px,transparent 1px 9px),radial-gradient(ellipse at 45% 40%,#4BE3A3,#0E9F62 75%)!important;box-shadow:0 0 0 7px color-mix(in srgb,var(--rec-turf) 22%,transparent),0 0 0 14px color-mix(in srgb,var(--rec-turf) 8%,transparent)}
.gp-on svg{width:14px!important;height:18px!important;stroke:none!important}
.gp-long{left:33%;right:33%;top:4px;height:34px}
.gp-short{left:33%;right:33%;bottom:4px;height:34px}
.gp-left{left:4px;width:19%;top:calc(50% - 17px);height:34px}
.gp-right{right:4px;width:19%;top:calc(50% - 17px);height:34px}
.greenpad button[aria-pressed="true"]{background:var(--rec-fg);border-color:var(--rec-fg);color:var(--rec-bg)}
.greenpad .gp-on[aria-pressed="true"]{box-shadow:0 0 0 4px var(--rec-fg),0 0 0 12px color-mix(in srgb,var(--rec-turf) 18%,transparent)}
.ball{position:absolute;width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#d9dedb);box-shadow:0 2px 4px rgba(0,0,0,.35);pointer-events:none;z-index:2;transition:all .2s}
.trouble{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.trouble button{height:44px;border-radius:12px;border:1px dashed var(--rec-line);background:transparent;color:var(--rec-muted);font:inherit;font-weight:700;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
.trouble button svg{width:18px;height:18px}
.trouble button[aria-pressed="true"].bk{background:var(--rec-warn);border:1px solid var(--rec-warn);color:#fff}
.trouble button[aria-pressed="true"].ob{background:var(--rec-under);border:1px solid var(--rec-under);color:#fff}
.rec-bar{position:fixed;left:0;right:0;bottom:0;z-index:11;padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:linear-gradient(to top,var(--rec-bg) 70%,var(--rec-fade));display:flex;gap:10px;max-width:760px;margin:0 auto}
.rec-bar button{height:54px;border-radius:16px;font:inherit;font-weight:900;font-size:16px;cursor:pointer;border:1px solid var(--rec-line);background:var(--rec-surface);color:var(--rec-fg)}
.rec-bar .back{flex:0 0 64px;display:flex;align-items:center;justify-content:center}
.rec-bar .back svg{width:22px;height:22px;stroke:currentColor;stroke-width:2.2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.rec-bar .go{flex:1;background:var(--rec-fg);color:var(--rec-bg);border-color:var(--rec-fg);letter-spacing:.04em;display:flex;align-items:center;justify-content:center;gap:8px}
.rec-bar .go svg{width:18px;height:18px;stroke:currentColor;stroke-width:2.4;fill:none;stroke-linecap:round;stroke-linejoin:round}
.rec-bar .go.save{background:linear-gradient(120deg,var(--turf),var(--accent2));border-color:transparent;color:#fff}
.rec-bar button:disabled{opacity:.3}
.sheet-back{position:fixed;inset:0;background:rgba(0,0,0,.4);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);z-index:30;display:flex;align-items:flex-end}
.sheet{width:100%;max-width:760px;margin:0 auto;background:var(--rec-surface);border-top:1px solid var(--rec-line);border-radius:20px 20px 0 0;padding:20px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:10px;color:var(--rec-fg)}
.sheet p{margin:0 0 6px;font-weight:700}
.sheet button{height:50px;border-radius:14px;font:inherit;font-weight:700;font-size:15px;border:1px solid var(--rec-line);background:var(--rec-bg);color:var(--rec-fg);cursor:pointer}
.sheet button.danger{background:var(--rec-under);border-color:var(--rec-under);color:#fff}
@media (max-height:700px){.rec{gap:9px;padding-top:6px}.hole-card{padding:12px 16px 12px}.hole-card .hno{font-size:66px}.hole-card .par{font-size:28px}.badge{margin-top:8px}.rec-card{gap:11px;padding:12px}.seg button{height:48px}.seg.s6 button{height:42px}.greenpad{height:140px}.gp-long,.gp-short,.gp-left,.gp-right{height:30px!important}.gp-left,.gp-right{top:calc(50% - 15px)!important}.trouble button{height:40px}.rec-bar button{height:50px}}
@media (max-width:360px){.seg button{font-size:20px}.hole-card .hno{font-size:60px}}
@media (prefers-reduced-motion:reduce){.slide-l,.slide-r{animation:none}}


/* v3 polish */
.ring{position:relative;width:46px;height:46px;flex:0 0 46px}
.ring svg{width:46px;height:46px;transform:rotate(-90deg)}
.ring .trk{fill:none;stroke:var(--rec-raise);stroke-width:4}
.ring .val{fill:none;stroke:url(#ringGrad);stroke-width:4;stroke-linecap:round;transition:stroke-dasharray .4s}
.ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--f-num);font-size:14px;font-weight:700}
.ring b small{font-size:9px;color:var(--rec-muted);margin-left:1px}
.hole-card::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.10) 45%,transparent 55%);background-size:250% 100%;animation:sheen 5s ease-in-out infinite;pointer-events:none}
@keyframes sheen{0%{background-position:120% 0}60%,100%{background-position:-60% 0}}
.hole-card .row2{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;margin-top:12px;position:relative}
.hole-card .row2 .badge{margin-top:0}
.hole-card .live{display:flex;gap:14px}
.hole-card .live div{text-align:right;line-height:1}
.hole-card .live span{display:block;font-size:9px;letter-spacing:.18em;opacity:.65;font-weight:700;margin-bottom:4px}

.mk.e{border:1.5px solid var(--under);border-radius:50%;box-shadow:0 0 0 2px var(--paper),0 0 0 3.5px var(--under);color:var(--under)}
.mk.bo{border:1.5px solid var(--over)}
.mk.db{border:1.5px solid var(--over);box-shadow:0 0 0 2px var(--paper),0 0 0 3.5px var(--over)}
.flags{font-size:10px;line-height:1;color:var(--warn);font-family:var(--f-body);font-weight:700}

/* course editor */

<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><svg viewBox="0 0 22 26" aria-hidden="true"><line x1="4" y1="2" x2="4" y2="24" stroke="currentColor" stroke-width="2"/><path d="M5 3 L19 7.5 L5 12 Z" fill="var(--flag)"/><ellipse cx="9" cy="24" rx="8" ry="1.8" fill="var(--turf)"/></svg>ショートコース スコアカード</div>
    <div class="sync" id="sync">接続中…</div>
  </header>
  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="record" aria-selected="true"><svg viewBox="0 0 24 24"><path d="M6 21V3"/><path d="M6 4l11 3.5L6 11"/><path d="M3 21h10"/></svg>記録</button>
    <button role="tab" data-tab="stats" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>分析</button>
    <button role="tab" data-tab="history" aria-selected="false"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M9 4v16M15 4v16"/></svg>履歴</button>
    <button role="tab" data-tab="courses" aria-selected="false"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="15" rx="9" ry="5"/><path d="M12 15V3l6 2.5L12 8"/></svg>コース</button>
  </nav>
  <main id="main"></main>
</div>
<div class="toast" id="toast" hidden></div>

<script>
(() => {
"use strict";
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const LS = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,8);
const today = () => { const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };
const DIRS = { on:"オン", left:"左", right:"右", long:"奥", short:"ショート" };

const state = {
  tab: LS.get("sc.tab","record"),
  mode: "connecting", // connecting | cloud | local
  courses: [], rounds: [],
  draft: LS.get("sc.draft", null),
  hole: 0,
  fPlayer: LS.get("sc.fPlayer", LS.get("sc.player","") || "all"), fCourse:"all", fRange:"all",
  courseEdit: null,
  confirm: null,
  demo: false
};

/* ---------- 自動アップデート: 新しい版が公開されていたら読み直す ---------- */
const BUILD = "2026-10-16-0215";
async function checkUpdate(){
  try{
    const res = await fetch(location.pathname + "?check=" + Date.now(), { cache:"no-store" });
    const txt = await res.text();
    const m = txt.match(/const BUILD = "([^"]+)"/);
    if(m && m[1] !== BUILD) location.replace(location.pathname + "?v=" + m[1]);
  }catch(e){}
}
document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState==="visible") checkUpdate(); });
setTimeout(checkUpdate, 1500);

/* ---------- storage: Google スプレッドシート (Apps Script) ---------- */
// ↓ Apps Script を「ウェブアプリ」として公開したときの URL を貼り付けてください
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw0sl0SbAukE3UDirc5iYePK-XaY9pD5gZvwg5g-IJMdAuiRRqwilifThZvbinzDTuO/exec";
const hasBackend = /^https:\/\/script\.google\.com\//.test(SCRIPT_URL);
let pending = LS.get("sc.pending", []); // 電波が悪くて送れなかった保存

async function api(action, payload){
  const res = await fetch(SCRIPT_URL, { method:"POST", headers:{ "Content-Type":"text/plain;charset=utf-8" }, body: JSON.stringify({ action, ...payload }) });
  const j = await res.json();
  if(!j.ok) throw new Error(j.error || "failed");
  return j;
}
function cache(){ LS.set("sc.courses", state.courses); LS.set("sc.rounds", state.rounds); }
const store = {
  async saveCourse(c){ if(hasBackend) await api("saveCourse",{course:c}); upsert(state.courses,c); cache(); render(); },
  async delCourse(id){ if(hasBackend) await api("deleteCourse",{id}); state.courses=state.courses.filter(c=>c.id!==id); cache(); render(); },
  async saveRound(r){
    upsert(state.rounds,r); cache();
    if(hasBackend){
      try{ await api("saveRound",{round:r}); }
      catch(e){ pending = pending.filter(p=>p.id!==r.id).concat([r]); LS.set("sc.pending",pending); toast("電波が弱いので端末に保存しました。あとで自動で送ります"); }
    }
    render();
  },
  async delRound(id){ if(hasBackend) await api("deleteRound",{id}); state.rounds=state.rounds.filter(r=>r.id!==id); pending=pending.filter(p=>p.id!==id); LS.set("sc.pending",pending); cache(); render(); }
};
function upsert(arr, item){ const i=arr.findIndex(x=>x.id===item.id); if(i>=0) arr[i]=item; else arr.push(item); }

async function flushPending(){
  if(!hasBackend || !pending.length) return;
  for(const r of pending.slice()){
    try{ await api("saveRound",{round:r}); pending=pending.filter(p=>p.id!==r.id); LS.set("sc.pending",pending); }
    catch(e){ return; }
  }
  toast("未送信だったラウンドを送りました");
}
let loading = false;
async function connect(){
  state.courses = LS.get("sc.courses", []); state.rounds = LS.get("sc.rounds", []);
  if(!hasBackend){ state.mode="local"; render(); return; }
  if(loading) return; loading = true;
  try{
    await flushPending();
    const res = await fetch(SCRIPT_URL + "?t=" + Date.now());
    const j = await res.json();
    if(!j.ok) throw new Error(j.error);
    state.courses = j.courses;
    state.rounds = j.rounds;
    pending.forEach(r=>upsert(state.rounds, r));
    cache(); state.mode = "cloud";
  }catch(e){ state.mode = "offline"; }
  loading = false;
  render();
}
document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState==="visible") connect(); });
window.addEventListener("online", connect);
function writeErr(e){ toast("保存できませんでした。電波の良い場所でもう一度お試しください"); }

/* ---------- helpers ---------- */
let toastT;
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>t.hidden=true,2600); }
const sum = (a,f=x=>x) => a.reduce((s,x)=>s+f(x),0);
const pct = (n,d) => d ? Math.round(n/d*1000)/10 : null;
const fmtPct = v => v==null ? "—" : (v%1===0? v.toFixed(0): v.toFixed(1));
const toPar = n => n===0 ? "±0" : (n>0? "+"+n : String(n));
function roundTotals(r){ const s=sum(r.holes,h=>h.strokes), p=sum(r.holes,h=>h.par), pt=sum(r.holes,h=>h.putts); return {score:s, par:p, putts:pt, diff:s-p}; }
function players(){ return [...new Set(rounds().map(r=>r.player))].filter(Boolean).sort((a,b)=>a.localeCompare(b,"ja")); }
function rounds(){ return state.demo ? DEMO.rounds : state.rounds; }
function courses(){ return state.demo ? DEMO.courses : state.courses; }
function byDate(a,b){ return (a.date||"").localeCompare(b.date||"") || (a.createdAt||0)-(b.createdAt||0); }

/* ---------- stats ---------- */
function computeStats(rs){
  const holes = rs.flatMap(r=>r.holes.filter(h=>h.strokes>0));
  const n = holes.length;
  const gir = holes.filter(h=>h.strokes-h.putts <= h.par-2);
  const bon = holes.filter(h=>h.strokes-h.putts <= h.par-1);
  const missGir = holes.filter(h=>h.strokes-h.putts > h.par-2);
  const scramble = missGir.filter(h=>h.strokes<=h.par);
  const bunker = holes.filter(h=>h.bunker);
  const sandSave = bunker.filter(h=>h.strokes<=h.par);
  const ob = holes.filter(h=>h.ob);
  const putt = {0:0,1:0,2:0,3:0};
  holes.forEach(h=>{ putt[Math.min(h.putts,3)]++; });
  const dirs = {on:0,left:0,right:0,long:0,short:0}; let dirN=0;
  holes.forEach(h=>{ if(h.dir && dirs[h.dir]!=null){ dirs[h.dir]++; dirN++; } });
  const dist = {hio:0,eagle:0,birdie:0,par:0,bogey:0,double:0,triple:0};
  holes.forEach(h=>{ const d=h.strokes-h.par; if(h.strokes===1)dist.hio++; else if(d<=-2)dist.eagle++; else if(d===-1)dist.birdie++; else if(d===0)dist.par++; else if(d===1)dist.bogey++; else if(d===2)dist.double++; else dist.triple++; });
  const tots = rs.map(roundTotals);
  const byPar = {};
  holes.forEach(h=>{ (byPar[h.par] ||= []).push(h.strokes); });
  return {
    rounds: rs.length, holes: n,
    avgScore: tots.length? sum(tots,t=>t.score)/tots.length : null,
    avgDiff: tots.length? sum(tots,t=>t.diff)/tots.length : null,
    best: tots.length? Math.min(...tots.map(t=>t.diff)) : null,
    avgPuttsRound: tots.length? sum(tots,t=>t.putts)/tots.length : null,
    puttsPerHole: n? sum(holes,h=>h.putts)/n : null,
    puttsPerGir: gir.length? sum(gir,h=>h.putts)/gir.length : null,
    puttsPerMiss: missGir.length? sum(missGir,h=>h.putts)/missGir.length : null,
    gir: pct(gir.length,n), bon: pct(bon.length,n),
    one: pct(putt[1],n), three: pct(putt[3],n),
    scramble: pct(scramble.length, missGir.length), scrambleN: missGir.length,
    bunkerRate: pct(bunker.length,n), sandSave: pct(sandSave.length,bunker.length), bunkerN: bunker.length,
    obRate: pct(ob.length,n), obN: ob.length,
    parOrBetter: pct(dist.eagle+dist.birdie+dist.par, n),
    putt, dirs, dirN, dist, byPar
  };
}

/* ---------- render ---------- */
const charts = [];
function killCharts(){ while(charts.length) charts.pop().destroy(); }

function render(){
  document.querySelectorAll("nav.tabs button").forEach(b=>b.setAttribute("aria-selected", String(b.dataset.tab===state.tab)));
  const s=$("#sync");
  if(state.mode==="cloud") s.innerHTML = pending.length ? `未送信 ${pending.length}件` : "<b>●</b> 同期済み";
  else if(state.mode==="offline") s.textContent = "オフライン（前回のデータを表示中）";
  else if(state.mode==="local") s.textContent="この端末だけに保存中";
  else s.textContent="接続中…";
  killCharts();
  document.body.classList.toggle("recording", state.tab==="record" && !!state.draft);
  const m=$("#main");
  const view = {record:viewRecord, stats:viewStats, history:viewHistory, courses:viewCourses}[state.tab] || viewRecord;
  m.innerHTML = `<section class="view">${view()}</section>`;
  after[state.tab] && after[state.tab]();
  if(state.result) m.insertAdjacentHTML("beforeend", resultOverlay(state.result));
}
function resultOverlay(r){
  const t=roundTotals(r); const s=computeStats([r]);
  const others = state.rounds.filter(x=>x.player===r.player && x.courseId===r.courseId && x.id!==r.id);
  const flag = !others.length ? "FIRST ROUND" : (t.diff < Math.min(...others.map(x=>roundTotals(x).diff)) ? "COURSE BEST!" : "");
  const n = k => s.dist[k];
  const [y,m,d] = r.date.split("-");
  return `<div class="result-back" role="dialog" aria-label="ラウンド結果"><div class="result-wrap">
    <div class="result-card"><div class="rc-in">
      <div class="rc-top"><div><div class="k">ROUND COMPLETE</div><div class="n">${esc(r.player)}</div><div class="c">${esc(r.courseName)}・${+m}/${+d}</div></div>${flag?`<span class="rc-flag">${flag}</span>`:""}</div>
      <div class="rc-score"><b>${t.score}</b><span>${toPar(t.diff)}</span></div>
      <div class="rc-sc">${(()=>{ const out=[]; for(let i=0;i<r.holes.length;i+=9){ const ch=r.holes.slice(i,i+9);
        out.push(`<table><tr class="h">${ch.map((h,j)=>`<td>${i+j+1}</td>`).join("")}</tr><tr class="p">${ch.map(h=>`<td>${h.par}</td>`).join("")}</tr><tr>${ch.map(h=>`<td>${mark(h)}</td>`).join("")}</tr></table>`); } return out.join(""); })()}</div>
      <div class="rc-grid">
        <div><span>BIRDIE+</span><b>${n("hio")+n("eagle")+n("birdie")}</b></div>
        <div><span>PAR</span><b>${n("par")}</b></div>
        <div><span>BOGEY</span><b>${n("bogey")}</b></div>
        <div><span>DOUBLE+</span><b>${n("double")+n("triple")}</b></div>
        <div><span>PUTTS</span><b>${t.putts}</b></div>
        <div><span>パーオン</span><b>${fmtPct(s.gir)}<small style="font-size:12px">%</small></b></div>
        <div><span>3パット</span><b>${s.putt[3]}</b></div>
        <div><span>OB</span><b>${s.obN}</b></div>
      </div>
      <div class="rc-brand">SHORT COURSE SCORECARD</div>
    </div></div>
    <p>スクショして友達に送れます</p>
    <button class="rc-close" data-act="close-result">閉じる</button>
  </div></div>`;
}
const after = {};

/* ----- 記録 ----- */
function viewRecord(){
  const cs = state.courses;
  const d = state.draft;
  if(!d){
    if(state.mode==="connecting") return `<div class="panel empty">読み込み中…</div>`;
    if(!cs.length) return `<div class="panel empty"><strong>まずコースを登録しましょう</strong>ホールごとのパーを登録すると、ラウンドの記録を始められます。<div style="margin-top:14px"><button class="btn primary" data-act="goto-courses">コースを登録する</button></div></div>`;
    const last = LS.get("sc.player","");
    const pl = players();
    return `<div class="panel">
      <h2>新しいラウンド</h2>
      <p class="muted" style="margin:4px 0 14px;font-size:13px">自分のスコアだけ入力すればOK。友達はそれぞれのスマホで記録すると、分析や履歴でみんなの分も見られます。</p>
      <div class="row">
        <div class="field"><label for="r-player">あなたの名前</label><input id="r-player" list="plist" value="${esc(last)}" placeholder="名前"><datalist id="plist">${pl.map(p=>`<option value="${esc(p)}">`).join("")}</datalist></div>
        <div class="field"><label for="r-course">コース</label><select id="r-course">${cs.slice().sort((a,b)=>a.name.localeCompare(b.name,"ja")).map(c=>`<option value="${c.id}">${esc(c.name)}（${c.holes.length}H / パー${sum(c.holes,h=>h.par)}）</option>`).join("")}</select></div>
        <div class="field" style="flex:0 1 160px"><label for="r-date">日付</label><input id="r-date" type="date" value="${today()}"></div>
      </div>
      <div class="err" id="r-err"></div>
      <button class="btn primary" style="width:100%;margin-top:6px" data-act="start">1番ホールから始める</button>
    </div>`;
  }
  return viewRecordDraft(d);
}


const ICON = {
  x:'<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  back:'<svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>',
  flag:'<svg viewBox="0 0 14 18" aria-hidden="true"><line x1="2" y1="1" x2="2" y2="17" stroke="#fff" stroke-width="1.6"/><path d="M3 1.5 L13 4.5 L3 7.5Z" fill="#F0BE3A"/></svg>'
};
const TERM = d => d<=-3?"ALBATROSS":d===-2?"EAGLE":d===-1?"BIRDIE":d===0?"PAR":d===1?"BOGEY":d===2?"DOUBLE":d===3?"TRIPLE":"+"+d;
const TONE = d => d<=-2?"eagle":d===-1?"birdie":d===0?"par":d===1?"bogey":d===2?"double":"triple";
const BALL_POS = { on:{left:"calc(50% + 16px)",top:"calc(50% + 4px)"}, left:{left:"calc(19% + 9px)",top:"calc(50% - 7px)"}, right:{left:"calc(81% - 23px)",top:"calc(50% - 7px)"}, long:{left:"calc(67% + 8px)",top:"14px"}, short:{left:"calc(67% + 8px)",top:"calc(100% - 28px)"} };
const AR = { long:'<svg viewBox="0 0 12 12"><path d="M6 10V2M2.5 5.5L6 2l3.5 3.5"/></svg>', short:'<svg viewBox="0 0 12 12"><path d="M6 2v8M2.5 6.5L6 10l3.5-3.5"/></svg>', left:'<svg viewBox="0 0 12 12"><path d="M10 6H2M5.5 2.5L2 6l3.5 3.5"/></svg>', right:'<svg viewBox="0 0 12 12"><path d="M2 6h8M6.5 2.5L10 6l-3.5 3.5"/></svg>' };

/* アプローチ: 上から見たグリーン。エリアをタップすると球が飛んでいく */
function approachSVG(dir, tap, stat){
  // stat が渡されたら分析用（読み取り専用・割合表示）
  const Z = { on:[218,106], long:[236,26], short:[238,178], left:[46,62], right:[294,62] };
  const sel = k => !stat && dir===k;
  const pctOf = k => stat ? pct(stat.dirs[k], stat.dirN) : null;
  const maxMiss = stat ? Math.max(1, ...["long","short","left","right"].map(k=>stat.dirs[k])) : 1;
  const worst = stat ? ["long","short","left","right"].reduce((a,k)=>stat.dirs[k]>stat.dirs[a]?k:a,"long") : null;
  const zone = (k, shape, lx, ly, label) => {
    if(stat){ const v=pctOf(k), heat=(stat.dirs[k]/maxMiss)*.55, w=k===worst&&stat.dirs[k]>0;
      return `<g class="az-s">${shape.replace('class="az-bg"', `class="az-bg" style="fill:color-mix(in srgb,#F2B01E ${Math.round(heat*100)}%,var(--paper))"`)}
        <text x="${lx}" y="${ly-9}" class="az-t">${label}</text><text x="${lx}" y="${ly+9}" class="az-p ${w?"worst":""}">${fmtPct(v)}%</text></g>`; }
    return `<g class="az ${sel(k)?"on-sel":""}" role="button" tabindex="0" data-act="dir" data-v="${k}" aria-pressed="${sel(k)}" aria-label="${label}">${shape}<text x="${lx}" y="${ly}" class="az-t">${label}</text></g>`; };
  const b = !stat && dir && Z[dir];
  const sx=170, sy=196;
  const tracer = b ? `<path class="tracer ${tap?"anim":""}" d="M${sx} ${sy} Q ${(sx+b[0])/2} ${Math.min(sy,b[1]) - (dir==="short"?70:dir==="long"?12:40)} ${b[0]} ${b[1]}" pathLength="1"/>` : "";
  // 光は左上から: 影はすべて同じ向き (28,10) に落ちる
  const SH = "rgba(0,0,0,.22)";
  const ball = b ? `<g class="ballg ${tap?"drop":""}"><ellipse cx="${b[0]+3.5}" cy="${b[1]+5}" rx="7.5" ry="4.8" fill="rgba(0,0,0,.26)" filter="url(#soft)" transform="rotate(15 ${b[0]+3.5} ${b[1]+5})"/><circle cx="${b[0]}" cy="${b[1]}" r="6.5" fill="#fff" stroke="rgba(0,0,0,.15)"/></g>` : "";
  const greenAttrs = stat ? `class="az-s"` : `class="az az-green ${sel("on")?"on-sel":""}" role="button" tabindex="0" data-act="dir" data-v="on" aria-pressed="${sel("on")}" aria-label="オン"`;
  const onLabel = stat ? `<text x="150" y="112" class="az-t on-t" style="font-size:12px">オン</text><text x="150" y="132" class="on-p">${fmtPct(pctOf("on"))}%</text>` : `<text x="148" y="122" class="az-t on-t">オン</text>`;
  return `<svg class="approach" viewBox="0 0 340 196" role="${stat?"img":"group"}" aria-label="グリーンを狙った1球目">
    <defs>

function viewRecordDraft(d){
  const h = d.holes[state.hole];
  const N = d.holes.length;
  const done = d.holes.filter(x=>x.entered);
  const tot = roundTotals({holes:done});
  const diff = h.strokes - h.par;
  const hio = h.strokes===1;
  const celebrate = state.tap && state.tap.startsWith("sv") && diff<0;
  const confetti = diff<0 ? `<div class="confetti ${hio?"big":""}">${Array.from({length: hio?46:22},(_,i)=>`<i style="left:${(Math.random()*100).toFixed(1)}%;background:${(hio?["#F2B01E","#FFD76A","#FFF3C4","#fff","#F59E0B"]:["#F2B01E","#FFD76A","#5BE6A8","#fff","#38BDF8"])[i%5]};animation-delay:${(-Math.random()*3).toFixed(2)}s;animation-duration:${(2.2+Math.random()*1.8).toFixed(2)}s;width:${5+Math.round(Math.random()*4)}px"></i>`).join("")}</div>` : "";
  const bestPace = (()=>{ const others = state.rounds.filter(r=>r.player===d.player && r.courseId===d.courseId && r.id!==d.id); if(!others.length || !done.length) return false;
    const best = others.reduce((a,r)=> roundTotals(r).diff < roundTotals(a).diff ? r : a);
    let mine=0, theirs=0; d.holes.forEach((x,i)=>{ if(x.entered && best.holes[i]){ mine += x.strokes-x.par; theirs += best.holes[i].strokes-best.holes[i].par; } });
    return mine < theirs; })();
  const onIn = h.strokes - h.putts;
  const hint = onIn<=h.par-2 ? "パーオン" : onIn<=h.par-1 ? "ボギーオン" : (h.putts===0 ? "チップイン" : "");
  const sBtn = v => { const isMax=v===8; const val = isMax && h.strokes>8 ? h.strokes : v; const pressed = isMax ? h.strokes>=8 : h.strokes===v; const dd=val-h.par;
    return `<button data-act="sv" data-v="${v}" class="t-${TONE(dd)} ${state.tap==="sv"+v?"pop":""}" aria-pressed="${pressed}" aria-label="${val}打">${isMax&&h.strokes<=8?"8+":val}<small>${val===1?"HIO":TERM(dd)}</small></button>`; };
  const pBtn = v => { const t = v<=1?"under":v===2?"worse":"bogey"; return `<button data-act="pv" data-v="${v}" class="t-${v<=1?"birdie":v===2?"bogey":v===3?"double":"triple"} ${state.tap==="pv"+v?"pop":""}" aria-pressed="${h.putts===v}" aria-label="${v}パット">${v===5?"5+":v}</button>`; };
  const gp = (k,cls,txt) => `<button class="${cls}" data-act="dir" data-v="${k}" aria-pressed="${h.dir===k}">${AR[k]||""}${txt}</button>`;
  const totLabel = done.length ? toPar(tot.diff) : "—";
  const dotCls = x => { if(!x.entered) return ""; return "r-"+TONE(x.strokes-x.par); };
  const ball = h.dir && BALL_POS[h.dir] ? `<span class="ball" style="left:${BALL_POS[h.dir].left};top:${BALL_POS[h.dir].top}"></span>` : "";
  const slide = state.slide ? (state.slide==="l"?"slide-l":"slide-r") : ""; state.slide = null;
  queueMicrotask(()=>{ state.tap = null; });
  return `<div class="rec">
    <div class="rec-top">
      <button class="icon-btn" data-act="ask-discard" aria-label="記録を閉じる">${ICON.x}</button>
      <div class="rec-who"><b>${esc(d.player)}</b><span>${esc(d.courseName)}・${esc(d.date.slice(5).replace("-","/"))}${d.editing?"・編集中":""}</span></div>
      <div class="ring" aria-label="${done.length}/${N}ホール入力済み"><svg viewBox="0 0 46 46"><defs><linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0E9F62"/><stop offset="1" stop-color="#13A9C2"/></linearGradient></defs><circle class="trk" cx="23" cy="23" r="19"/><circle class="val" cx="23" cy="23" r="19" stroke-dasharray="${(2*Math.PI*19*done.length/N).toFixed(1)} 200"/></svg><b>${done.length}<small>/${N}</small></b></div>
    </div>
    <div class="dots ${N>9?"two":""}">${d.holes.map((x,i)=>`<button data-act="hole" data-i="${i}" class="${dotCls(x)} ${i===state.hole?"cur":""}" aria-label="${i+1}番ホール">${x.entered?x.strokes:i+1}<small>${x.entered?(i+1)+"H":""}</small></button>`).join("")}</div>
    <div class="hole-card ${slide} ${celebrate?"flash":""}">${confetti}${bestPace?`<span class="pace">BEST PACE</span>`:""}

    </div>
    ${state.confirm==="discard"?`<div class="sheet-back" data-act="cancel-confirm"><div class="sheet" data-stop="1"><p>${d.editing?"編集をやめますか？変更は保存されません。":"このラウンドの記録をやめますか？入力した内容は消えます。"}</p><button class="danger" data-act="discard">${d.editing?"編集をやめる":"記録を破棄する"}</button><button data-act="cancel-confirm">続ける</button></div></div>`:""}
  </div>`;

after.record = () => {

function greenMap(s){
  if(!s.dirN) return `<p class="muted" style="font-size:13px">まだ記録がありません。記録画面でグリーンのどこに行ったかを選ぶとここに出ます。</p>`;
  const miss = s.dirN - s.dirs.on;
  const worst = miss ? ["left","right","long","short"].reduce((a,b)=>s.dirs[b]>s.dirs[a]?b:a) : null;
  return approachSVG(null,false,s) + `<p class="muted" style="font-size:12px;text-align:center;margin:8px 0 0">${s.dirN}球の記録${worst?`・一番多いミスは<b style="color:var(--q-triple)">${DIRS[worst]}</b>`:""}</p>`;
}
function cssv(n){ return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
after.stats = () => {
  ["f-course","f-range"].forEach(id=>{ const el=$("#"+id); if(el) el.onchange=()=>{ if(id==="f-player"){state.fPlayer=el.value; LS.set("sc.fPlayer",el.value);} if(id==="f-course") state.fCourse=el.value; if(id==="f-range") state.fRange=el.value; render(); }; });
  if(!window.Chart || !$("#ch-score")) return;
  const fg=cssv("--fg"), muted=cssv("--muted"), line=cssv("--line"), paper=cssv("--paper");
  const pal=["--c1","--c2","--c3","--c4","--c5","--c6"].map(cssv);
  Chart.defaults.color=muted; Chart.defaults.borderColor=line;
  Chart.defaults.font.family=cssv("--f-body"); Chart.defaults.font.size=12;
  const rs = filteredRounds();
  const s = computeStats(rs);
  const seen={}; const circ="①②③④⑤⑥⑦⑧⑨";
  const byDay={}; rs.forEach(r=>{ byDay[r.date]=(byDay[r.date]||0)+1; });
  const lbl = rs.map(r=>{ const [y,m,d]=(r.date||"").split("-"); seen[r.date]=(seen[r.date]||0)+1; return `${+m}/${+d}` + (byDay[r.date]>1 ? circ[seen[r.date]-1]||"" : ""); });
  const labels = lbl;
  const oneCourse = state.fCourse!=="all";
  const tot = rs.map(roundTotals);
  // 基準線: 横いっぱいに引く太めの線（パー・ボギー・ダボ）
  const holesN = (()=>{ const c={}; rs.forEach(r=>{ c[r.holes.length]=(c[r.holes.length]||0)+1; }); return +Object.keys(c).sort((x,y)=>c[y]-c[x])[0] || 9; })();
  const parN = oneCourse ? (courses().find(c=>c.id===state.fCourse)?.holes.reduce((a,h)=>a+h.par,0) ?? roundTotals(rs[0]).par) : 0;
  const refLines = (lines) => ({ id:"refLines", afterDatasetsDraw(chart){ const {ctx, chartArea:a, scales:{y}} = chart; ctx.save();
    lines.forEach(L=>{ const py=y.getPixelForValue(L.v); if(py<a.top-1||py>a.bottom+1) return;
      ctx.strokeStyle=L.color; ctx.lineWidth=L.w||2.5; ctx.setLineDash([]); ctx.beginPath(); ctx.moveTo(a.left,py); ctx.lineTo(a.right,py); ctx.stroke();
      ctx.font="700 10px "+cssv("--f-body"); const tw=ctx.measureText(L.label).width; ctx.fillStyle=cssv("--paper"); ctx.fillRect(a.right-tw-10,py-8,tw+8,15);
      ctx.fillStyle=L.color; ctx.textAlign="right"; ctx.textBaseline="middle"; ctx.fillText(L.label,a.right-6,py); });
    ctx.restore(); } });
  const scoreLines = [
    { v: parN, label: oneCourse?`パー ${parN}`:"パー ±0", color: cssv("--turf") },
    { v: parN+holesN, label: oneCourse?`ボギー ${parN+holesN}`:`ボギー +${holesN}`, color: cssv("--warn") },
    { v: parN+2*holesN, label: oneCourse?`ダボ ${parN+2*holesN}`:`ダボ +${2*holesN}`, color: cssv("--q-triple") }
  ];
  const vals = rs.map((r,i)=> oneCourse ? tot[i].score : tot[i].diff);
  const tip = { callbacks:{ title: items => { const r=rs[items[0].dataIndex]; return `${r.date}  ${r.courseName}（${r.holes.length}H）`; } } };
  const opts = (yTitle, yFmt, lo, hi) => ({ maintainAspectRatio:false, plugins:{ legend:{display:false}, tooltip:tip },
    scales:{ x:{ ticks:{ maxRotation:0, autoSkip:true }, grid:{display:false} }, y:{ title:{display:true,text:yTitle}, ticks:{ precision:0, callback: yFmt || (v=>v) }, suggestedMin:lo, suggestedMax:hi, grid:{ color: cssv("--soft") } } } });
  const o1 = opts(oneCourse?"スコア":"対パー", oneCourse?null:(v=>toPar(v)), Math.min(parN-2, ...vals), Math.max(parN+2*holesN+1, ...vals));
  o1.plugins.tooltip.callbacks.label = c => ` スコア ${tot[c.dataIndex].score}（${toPar(tot[c.dataIndex].diff)}）`;
  charts.push(new Chart($("#ch-score"), { type:"bar", data:{ labels, datasets:[
    { label:"スコア", data: vals, backgroundColor: c=>{ const {ctx,chartArea:a}=c.chart; if(!a) return "#3B82F6"; const g=ctx.createLinearGradient(0,a.bottom,0,a.top); g.addColorStop(0,"#2563EB"); g.addColorStop(1,"#38BDF8"); return g; }, borderRadius:3, maxBarThickness:22, base: oneCourse ? undefined : 0 }
  ]}, options:o1, plugins:[refLines(scoreLines)] }));
  const pVals = tot.map(t=>t.putts);
  const o2 = opts("パット", null); o2.scales.y.min = Math.min(holesN+1, ...pVals); o2.scales.y.max = Math.max(holesN*2+6, ...pVals);
  o2.plugins.tooltip.callbacks.label = c => ` ${tot[c.dataIndex].putts}パット`;
  charts.push(new Chart($("#ch-putt"), { type:"bar", data:{ labels, datasets:[
    { label:"パット", data: pVals, backgroundColor: c=>{ const {ctx,chartArea:a}=c.chart; if(!a) return cssv("--c3"); const g=ctx.createLinearGradient(0,a.bottom,0,a.top); g.addColorStop(0,cssv("--c3")); g.addColorStop(1,cssv("--c5")); return g; }, borderRadius:3, maxBarThickness:22 }
  ]}, options:o2, plugins:[refLines([{ v:2*holesN, label:`2パット ${2*holesN}`, color: cssv("--muted") }])] }));
  const donut = (id, segs) => { const el=$(id); if(!el) return;
    charts.push(new Chart(el, {type:"doughnut", data:{labels:segs.map(x=>x.label), datasets:[{data:segs.map(x=>x.n), backgroundColor:segs.map(x=>cssv(x.tone)), borderWidth:0, borderRadius:0, spacing:2, hoverOffset:4}]},
      options:{maintainAspectRatio:false, cutout:"74%", plugins:{legend:{display:false}, tooltip:{callbacks:{label:c=>` ${c.raw}ホール`}}}}})); };
  donut("#ch-pie", PUTT_SEGS(s));
  donut("#ch-dist", DIST_SEGS(s));
  if($("#ch-hole")){
    const c = courses().find(x=>x.id===state.fCourse);
    const n = c ? c.holes.length : Math.max(...rs.map(r=>r.holes.length));
    const avg=[], par=[];
    for(let i=0;i<n;i++){ const hs=rs.map(r=>r.holes[i]).filter(h=>h&&h.strokes>0); avg.push(hs.length? +(sum(hs,h=>h.strokes)/hs.length).toFixed(2):null); par.push(c?c.holes[i].par:(hs[0]?hs[0].par:null)); }
    charts.push(new Chart($("#ch-hole"), {data:{labels:avg.map((_,i)=>i+1+"H"), datasets:[
      {type:"bar", label:"平均打数", data:avg, backgroundColor:avg.map((v,i)=>v!=null&&par[i]!=null&&v-par[i]>=1?cssv("--over"):cssv("--c1")), borderRadius:4},
      {type:"line", label:"パー", data:par, borderColor:fg, borderDash:[4,4], pointRadius:0, borderWidth:1.5, stepped:"middle"}
    ]}, options:{maintainAspectRatio:false, plugins:{legend:{labels:{boxWidth:10}}}, scales:{y:{beginAtZero:true}, x:{grid:{display:false}}}}}));
  }
};

/* ----- 履歴 ----- */
function mark(h){ const d=h.strokes-h.par; return `<span class="mk3 m-${TONE(d)}">${h.strokes}</span>`; }
function viewHistory(){
  const demoBand = state.demo ? `<div class="demo-band">デモデータを表示中です（保存はされていません）<button class="btn small" data-act="demo-off">自分たちのデータに戻る</button></div>` : "";
  const all = rounds();
  if(!all.length) return state.mode==="connecting"?`<div class="panel empty">読み込み中…</div>`:`<div class="panel empty"><strong>まだラウンドがありません</strong>「記録」タブからラウンドを始めましょう。</div>`;
  const pl = players();
  if(!pl.includes(state.fPlayer)) state.fPlayer = pl.includes(LS.get("sc.player","")) ? LS.get("sc.player","") : pl[0];
  const rs = all.filter(r=>r.player===state.fPlayer).sort(byDate).reverse();
  const W = ["日","月","火","水","木","金","土"];
  let lastMonth = "";
  const cards = rs.map(r=>{
    const t=roundTotals(r); const [y,m,d]=r.date.split("-"); const wd=W[new Date(+y,+m-1,+d).getDay()];
    const mh = `${y}-${m}`!==lastMonth ? `<div class="month">${+y}年${+m}月</div>` : ""; lastMonth = `${y}-${m}`;
    const open = state.openRound===r.id;
    const chunks=[]; for(let i=0;i<r.holes.length;i+=9) chunks.push(r.holes.slice(i,i+9).map((h,j)=>({h,no:i+j+1})));
    const legend = `<div class="sc-legend"><span><i class="mk3 m-eagle"></i>イーグル</span><span><i class="mk3 m-birdie"></i>バーディ</span><span><i class="mk3 m-bogey"></i>ボギー</span><span><i class="mk3 m-double"></i>ダボ</span><span><i class="mk3 m-triple"></i>トリプル以上</span></div>`;
    const tables = chunks.map(ch=>`<div class="sc-wrap"><table class="sc">
      <tr class="hn"><th>H</th>${ch.map(x=>`<td>${x.no}</td>`).join("")}<td>計</td></tr>
      <tr><th>PAR</th>${ch.map(x=>`<td>${x.h.par}</td>`).join("")}<td>${sum(ch,x=>x.h.par)}</td></tr>
      <tr><th>打数</th>${ch.map(x=>`<td>${mark(x.h)}</td>`).join("")}<td><b>${sum(ch,x=>x.h.strokes)}</b></td></tr>
      <tr><th>パット</th>${ch.map(x=>`<td>${x.h.putts}</td>`).join("")}<td>${sum(ch,x=>x.h.putts)}</td></tr>
      <tr><th>グリーン</th>${ch.map(x=>`<td style="font-family:var(--f-body);font-size:11px">${x.h.dir?(x.h.dir==="on"?"◎":DIRS[x.h.dir]):"–"}${x.h.bunker||x.h.ob?`<div class="flags">${x.h.bunker?"B":""}${x.h.ob?" OB":""}</div>`:""}</td>`).join("")}<td></td></tr>
    </table></div>`).join("");
    const conf = state.confirm==="del:"+r.id;
    const tcol = t.diff/r.holes.length<=0 ? "var(--turf)" : t.diff/r.holes.length<=1 ? "var(--muted)" : "var(--q-triple)";
    return `${mh}<div class="rcard">
      <button data-act="toggle-round" data-id="${r.id}" aria-expanded="${open}">
        <div class="day"><b>${+m}/${+d}</b><small>${wd}</small></div>
        <div class="mid"><div class="cname">${esc(r.courseName)}</div><div class="strip">${r.holes.map(h=>`<i class="q-${TONE(h.strokes-h.par)}"></i>`).join("")}</div></div>
        <div class="sc-tot"><b>${t.score}</b><small style="color:${tcol}">${toPar(t.diff)}</small><span>${t.putts}パット</span></div>
      </button>
      ${open?`<div class="detail">${tables}${legend}
        ${state.demo?"":`<div class="actions">${conf?`<span class="muted" style="font-size:13px;align-self:center">このラウンドを削除しますか？</span><button class="btn small" data-act="cancel-confirm">やめる</button><button class="btn small danger" data-act="del-round" data-id="${r.id}">削除する</button>`:`<button class="btn small" data-act="edit-round" data-id="${r.id}">編集</button><button class="btn small" data-act="ask-del-round" data-id="${r.id}">削除</button>`}</div>`}
      </div>`:""}
    </div>`;
  }).join("");
  return demoBand + `<div class="who-pick" role="tablist" aria-label="プレーヤー">${pl.map(p=>`<button role="tab" data-act="pick-player" data-v="${esc(p)}" aria-selected="${p===state.fPlayer}">${esc(p)}</button>`).join("")}</div>` + (cards || `<div class="panel empty">${esc(state.fPlayer)}さんのラウンドはまだありません。</div>`);
}

/* ----- コース ----- */
function viewCourses(){
  const e = state.courseEdit;
  if(e){
    return `<div class="panel">
      <h2>${e.isNew?"コースを登録":"コースを編集"}</h2>
      <div class="row" style="margin-top:12px">
        <div class="field"><label for="c-name">コース名</label><input id="c-name" value="${esc(e.name)}" placeholder="例：〇〇パー3ゴルフ"></div>
        <div class="field" style="flex:0 1 140px"><label for="c-n">ホール数</label><select id="c-n">${[6,9,12,18].map(n=>`<option ${n===e.holes.length?"selected":""}>${n}</option>`).join("")}</select></div>
      </div>
      <div class="row" style="margin:12px 0 8px;justify-content:space-between;align-items:center"><span class="muted" style="font-size:13px">合計パー <b class="num" style="font-size:18px;color:var(--fg)">${sum(e.holes,h=>h.par)}</b></span>
        <span style="display:flex;gap:6px"><button class="btn small" data-act="allpar" data-p="3">全部パー3</button><button class="btn small" data-act="allpar" data-p="4">全部パー4</button></span></div>
      <div class="par-grid">${e.holes.map((h,i)=>`<div class="par-cell"><div class="h">${i+1}H</div>
        <div class="pars">${[3,4,5].map(p=>`<button data-act="setpar" data-i="${i}" data-p="${p}" aria-pressed="${h.par===p}">${p}</button>`).join("")}</div>
        <input type="number" inputmode="numeric" id="yd-${i}" data-yd="${i}" value="${h.yards||""}" placeholder="ヤード" aria-label="${i+1}番ホールのヤード"></div>`).join("")}</div>
      <div class="err" id="c-err"></div>
      <div class="navrow"><button class="btn" data-act="cancel-course">キャンセル</button><button class="btn primary" data-act="save-course">保存する</button></div>
    </div>`;
  }
  const cs = state.courses.slice().sort((a,b)=>a.name.localeCompare(b.name,"ja"));
  return `<div class="panel">
    <div class="row" style="justify-content:space-between;align-items:center"><h2>登録コース</h2><button class="btn primary small" data-act="new-course">＋ コースを追加</button></div>
    ${!cs.length? (state.mode==="connecting"?`<div class="empty">読み込み中…</div>`:`<div class="empty"><strong>コースがまだありません</strong>よく行くショートコースを登録しておくと、次から選ぶだけで記録できます。</div>`) :
      `<div style="margin-top:8px">${cs.map(c=>{ const n=state.rounds.filter(r=>r.courseId===c.id).length; const conf=state.confirm==="delc:"+c.id; return `<div class="course-item">
        <div><div class="nm">${esc(c.name)}</div><div class="muted" style="font-size:13px">${c.holes.length}ホール・パー<span class="num">${sum(c.holes,h=>h.par)}</span>・ラウンド ${n}回</div></div>
        <div class="actions">${conf?`<span class="muted" style="font-size:12px;align-self:center">削除しますか？（過去の記録は残ります）</span><button class="btn small" data-act="cancel-confirm">やめる</button><button class="btn small danger" data-act="del-course" data-id="${c.id}">削除する</button>`:`<button class="btn small" data-act="edit-course" data-id="${c.id}">編集</button><button class="btn small" data-act="ask-del-course" data-id="${c.id}">削除</button>`}</div>
      </div>`; }).join("")}</div>`}
  </div>
  <p class="muted" style="font-size:12px;margin:0">${hasBackend?"コースとラウンドはスプレッドシートに保存され、URLを開いた全員で見られます。":"いまはこの端末のブラウザにだけ保存されています。"}</p>`;
}
after.courses = () => {
  const e=state.courseEdit; if(!e) return;
  const nm=$("#c-name"); nm.oninput=()=>{ e.name=nm.value; };
  $("#c-n").onchange=ev=>{ const n=+ev.target.value; while(e.holes.length<n) e.holes.push({par:3,yards:null}); e.holes.length=n; render(); };
  document.querySelectorAll("[data-yd]").forEach(inp=>inp.oninput=()=>{ const v=parseInt(inp.value,10); e.holes[+inp.dataset.yd].yards = isNaN(v)?null:v; });
};

/* ---------- actions ---------- */
function saveDraft(){ LS.set("sc.draft", state.draft); }
document.addEventListener("click", async ev => {
  const b = ev.target.closest("[data-act], nav.tabs button, [data-stop]");
  if(!b || b.dataset.stop) return;
  if(b.dataset.tab){ state.tab=b.dataset.tab; state.confirm=null; LS.set("sc.tab",state.tab); render(); window.scrollTo({top:0}); return; }
  const a=b.dataset.act, d=state.draft, h=d && d.holes[state.hole];
  state.tap = (a==="sv"||a==="pv"||a==="dir") ? a+b.dataset.v : null;
  switch(a){
    case "goto-courses": state.tab="courses"; state.courseEdit=newCourse(); render(); break;
    case "goto-record": state.tab="record"; render(); break;
    case "close-result": state.result=null; render(); break;
    case "toggle-round": state.openRound = state.openRound===b.dataset.id ? null : b.dataset.id; state.confirm=null; render(); break;
    case "pick-player": state.fPlayer=b.dataset.v; LS.set("sc.fPlayer",state.fPlayer); render(); break;
    case "demo-on": state.demo=true; render(); break;
    case "demo-off": state.demo=false; render(); break;
    case "start": {
      const p=$("#r-player").value.trim(), cid=$("#r-course").value, dt=$("#r-date").value||today();
      if(!p){ $("#r-err").textContent="プレーヤーの名前を入れてください"; return; }
      const c=state.courses.find(x=>x.id===cid); if(!c) return;
      LS.set("sc.player",p);
      state.draft={ id:uid(), player:p, courseId:c.id, courseName:c.name, date:dt, holes:c.holes.map(x=>({par:x.par, yards:x.yards||null, strokes:x.par, putts:2, dir:null, bunker:false, ob:false, entered:false})) };
      state.hole=0; saveDraft(); render(); break;
    }
    case "hole": mark_entered(); state.slide = +b.dataset.i>state.hole?"l":"r"; state.hole=+b.dataset.i; saveDraft(); render(); break;
    case "sv": { const v=+b.dataset.v; h.strokes = v===8 ? (h.strokes>=8 ? h.strokes+1 : 8) : v; if(h.strokes>15) h.strokes=8; if(h.putts>h.strokes-1) h.putts=Math.max(0,h.strokes-1); h.entered=true; saveDraft(); render(); break; }
    case "pv": h.putts=+b.dataset.v; if(h.strokes<h.putts+1) h.strokes=h.putts+1; h.entered=true; saveDraft(); render(); break;
    case "st": h.strokes=Math.max(1,Math.min(15,h.strokes+ +b.dataset.d)); if(h.putts>h.strokes) h.putts=h.strokes; h.entered=true; saveDraft(); render(); break;
    case "pt": h.putts=Math.max(0,Math.min(h.strokes,h.putts+ +b.dataset.d)); h.entered=true; saveDraft(); render(); break;
    case "dir": h.dir = h.dir===b.dataset.v ? null : b.dataset.v; h.entered=true; saveDraft(); render(); break;
    case "tog": h[b.dataset.k]=!h[b.dataset.k]; h.entered=true; saveDraft(); render(); break;
    case "prev": mark_entered(); state.slide="r"; state.hole--; saveDraft(); render(); break;
    case "next": mark_entered(); state.slide="l"; state.hole++; saveDraft(); render(); window.scrollTo({top:0}); break;
    case "finish": {
      mark_entered();
      const r={ id:d.id, player:d.player, courseId:d.courseId, courseName:d.courseName, date:d.date, createdAt:d.createdAt||Date.now(),
        holes:d.holes.map(x=>({par:x.par, strokes:x.strokes, putts:x.putts, dir:x.dir, bunker:!!x.bunker, ob:!!x.ob})) };
      b.disabled=true;
      try{ await store.saveRound(r); state.draft=null; saveDraft(); state.tab="history"; LS.set("sc.tab","history"); state.fPlayer=r.player; state.openRound=r.id; state.result=r; render(); }
      catch(e){ b.disabled=false; writeErr(e); }
      break;
    }
    case "ask-discard": state.confirm="discard"; render(); break;
    case "discard": state.draft=null; state.confirm=null; saveDraft(); render(); break;
    case "cancel-confirm": state.confirm=null; render(); break;
    case "ask-del-round": state.confirm="del:"+b.dataset.id; render(); break;
    case "del-round": try{ await store.delRound(b.dataset.id); state.confirm=null; toast("削除しました"); render(); }catch(e){ writeErr(e); } break;
    case "edit-round": {
      const r=state.rounds.find(x=>x.id===b.dataset.id); if(!r) return;
      state.draft={...JSON.parse(JSON.stringify(r)), editing:true}; state.draft.holes.forEach(x=>x.entered=true);
      state.hole=0; state.tab="record"; saveDraft(); render(); break;
    }
    case "new-course": state.courseEdit=newCourse(); render(); break;
    case "edit-course": { const c=state.courses.find(x=>x.id===b.dataset.id); state.courseEdit={...JSON.parse(JSON.stringify(c)), isNew:false}; render(); break; }
    case "cancel-course": state.courseEdit=null; render(); break;
    case "allpar": state.courseEdit.holes.forEach(x=>x.par=+b.dataset.p); render(); break;
    case "setpar": state.courseEdit.holes[+b.dataset.i].par=+b.dataset.p; render(); break;
    case "save-course": {
      const e=state.courseEdit;
      if(!e.name.trim()){ $("#c-err").textContent="コース名を入れてください"; return; }
      const c={ id:e.id, name:e.name.trim(), holes:e.holes.map(x=>({par:x.par, yards:x.yards||null})), createdAt:e.createdAt||Date.now() };
      try{ await store.saveCourse(c); state.courseEdit=null; toast("コースを保存しました"); render(); }catch(err){ writeErr(err); }
      break;
    }
    case "ask-del-course": state.confirm="delc:"+b.dataset.id; render(); break;
    case "del-course": try{ await store.delCourse(b.dataset.id); state.confirm=null; toast("コースを削除しました"); render(); }catch(e){ writeErr(e); } break;
  }
});
function mark_entered(){ const d=state.draft; if(d) d.holes[state.hole].entered=true; }
function newCourse(){ return { id:uid(), name:"", isNew:true, holes:Array.from({length:9},()=>({par:3,yards:null})) }; }

/* ---------- demo data (never saved) ---------- */
const DEMO = (() => {
  const pars=[3,3,3,4,3,3,3,3,4];
  const c={id:"demo-c", name:"サンプル・パー3コース", holes:pars.map(p=>({par:p,yards:p===3?95:210}))};
  let seed=7; const rnd=()=>{ seed=(seed*16807)%2147483647; return seed/2147483647; };
  const dirs=["on","on","on","left","right","long","short","short","right"];
  const rs=[];
  const mk=(player,skill,dates)=>dates.forEach((dt,ri)=>{
    const holes=pars.map(p=>{ const dir=dirs[Math.floor(rnd()*dirs.length)]; const gir=dir==="on"&&p===3 || (p===4&&rnd()<.4);
      const putts = rnd()<.15?1:(rnd()<skill-ri*0.03?3:2); const bunker=!gir&&rnd()<.18; const ob=rnd()<.05;
      const strokes=Math.max(putts+1,(gir?p-2:p-1+(rnd()<.35?1:0))+putts+(bunker?1:0)+(ob?2:0)-(!gir&&putts===1?0:0));
      return {par:p,strokes,putts,dir,bunker,ob}; });
    rs.push({id:"demo-"+player+ri, player, courseId:c.id, courseName:c.name, date:dt, createdAt:ri, holes});
  });
  mk("たろう",.35,["2026-07-05","2026-07-26","2026-08-16","2026-09-06","2026-09-27","2026-10-11"]);
  mk("はなこ",.22,["2026-07-05","2026-08-16","2026-09-27","2026-10-11"]);
  return {courses:[c], rounds:rs};
})();

if(state.draft){ const i=state.draft.holes.findIndex(x=>!x.entered); state.hole = i<0 ? state.draft.holes.length-1 : i; }
render();
connect();
})();
</script>
