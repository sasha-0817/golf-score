<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="スコアカード">
<meta name="theme-color" content="#F1F4F3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#070C0A" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" sizes="180x180" href="icon.png?v=6">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;-webkit-text-size-adjust:100%}img{max-width:100%}[hidden]{display:none!important}button{-webkit-tap-highlight-color:transparent}
/* v15: record steppers, gear, fairway map, club picker */
.rec2 .rec-top .gear-btn{margin-left:auto}
.icon-btn svg.gear{width:20px;height:20px;stroke-width:1.6}
.rec2 .dots button{font-size:12px;letter-spacing:.02em}
.stp-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stp-row.one{grid-template-columns:1fr}
.stp{border:1px solid var(--rec-line);border-radius:14px;background:var(--rec-bg);padding:7px 7px 8px;min-width:0}
.stp-h{display:flex;justify-content:space-between;align-items:center;margin:0 2px 4px;min-height:16px}
.stp-h .hint{font-size:10px}
.stp-h .eyebrow b,.ap-wrap .eyebrow b{margin-left:6px}
.stp-b{display:grid;grid-template-columns:42px 1fr 42px;align-items:center;gap:4px}
.stp-b button{height:54px;border-radius:12px;border:1px solid var(--rec-line);background:var(--rec-surface);color:var(--rec-fg);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;transition:transform .08s}
.stp-b button:active{transform:scale(.92)}
.stp-b button:disabled{opacity:.3;cursor:default}
.stp-b button svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.stp-v{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0}
.stp-v b{font-family:var(--f-num);font-size:40px;font-weight:700;line-height:.9}
.stp-v.pop b{animation:pop .2s ease-out}
.stp-v .tm{font-size:9px;font-weight:700;letter-spacing:.08em;padding:2px 7px;border-radius:999px;color:#fff;white-space:nowrap}
.tm.t-hio{background:var(--q-hio);color:#3A2600}.tm.t-eagle{background:var(--q-eagle)}.tm.t-birdie,.tm.p-birdie{background:var(--q-birdie)}
.tm.t-par,.tm.p-par{background:var(--q-par)}.tm.t-bogey,.tm.p-bogey{background:var(--q-bogey)}.tm.t-double,.tm.p-double{background:var(--q-double)}.tm.t-triple{background:var(--q-triple)}
.ap-wrap .seg-head{display:flex;justify-content:space-between;align-items:center}
.club-tag{height:26px;padding:0 12px;border-radius:999px;border:1px dashed var(--rec-line);background:transparent;color:var(--rec-muted);font:700 12px var(--f-body);cursor:pointer}
.club-tag.has{border:1px solid #F2B01E;background:color-mix(in srgb,#F2B01E 22%,var(--rec-surface));color:var(--rec-fg);font-family:var(--f-num);font-size:14px}
.fw-rough .az-bg{fill:color-mix(in srgb,var(--rec-turf) 12%,var(--rec-surface));stroke:none}
.rc2:not(:has(.ap-wrap)) .stp-b{grid-template-columns:40px 1fr 40px}
.rc2:not(:has(.ap-wrap)) .stp-b button{height:76px}
.rc2:not(:has(.ap-wrap)) .stp-v b{font-size:50px}
.rc2:not(:has(.ap-wrap)) .trouble button{height:64px;font-size:16px}
.az-s.fw-rough .az-bg{stroke:var(--line)}
.tree{pointer-events:none}
.fairway .az-green .on-t{font-size:12px}
.club-back{background:rgba(0,0,0,.5);align-items:center;padding:16px}
.club-sheet{border-radius:20px;border:1px solid var(--rec-line);padding:18px 16px 16px;animation:rise .22s ease-out;max-width:420px}
.club-sheet p{display:flex;justify-content:space-between;align-items:baseline;font-size:16px}
.club-sheet p small{font-size:12px;color:var(--rec-muted);font-weight:700}
.club-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.club-grid button{height:52px;font-family:var(--f-num);font-size:19px}
.club-grid button[aria-pressed="true"]{background:#F2B01E;border-color:#F2B01E;color:#2A1B00}
@media (max-height:700px){.stp-b button{height:48px}.stp-v b{font-size:36px}}

/* v16: donut labels, fairway look, club settings */
.dsvg{width:100%;height:auto;display:block;max-width:420px;margin:0 auto}
.dl-name{font:700 11px var(--f-body);fill:var(--muted)}
.dl-pct{font:700 17px var(--f-num);fill:var(--fg)}
.dl-pct tspan{font-size:11px;fill:var(--muted)}
.dc-v{font:700 30px var(--f-num);fill:var(--fg);text-anchor:middle}
.dc-v .dc-u{font-size:12px;fill:var(--muted)}
.dc-l{font:700 10px var(--f-body);fill:var(--muted);text-anchor:middle;letter-spacing:.04em}
.fairway .on-p{paint-order:stroke;stroke:rgba(8,60,30,.45);stroke-width:3px}
.club-foot{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fs-link{display:flex;justify-content:space-between;align-items:center;padding:0 14px!important;margin-top:4px}
.fs-link small{color:var(--rec-muted);font-weight:700}
.clubs-sheet{max-height:88vh;overflow:auto}
.clubs-sheet p{display:flex;justify-content:space-between;align-items:baseline}
.clubs-sheet p small{font-size:12px;color:var(--rec-muted)}
.cl-list{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.cl-row{display:flex;align-items:center;border:1px solid var(--rec-line);border-radius:12px;background:var(--rec-bg);overflow:hidden}
.cl-row input{flex:1;min-width:0;border:0;background:transparent;color:var(--rec-fg);font:700 17px var(--f-num);padding:0 12px;height:42px;border-radius:0}
.cl-row input:focus{outline:none;background:color-mix(in srgb,#F2B01E 14%,transparent)}
.sheet .cl-row button{height:42px;width:40px;border:0;border-left:1px solid var(--rec-line);border-radius:0;background:transparent;color:var(--rec-muted);font-size:16px;flex:0 0 40px}
.sheet .cl-blank{height:44px;border-style:dashed;color:var(--rec-muted);font-size:13px}
.cl-sug>span{display:block;font-size:11px;font-weight:700;color:var(--rec-muted);margin:4px 0 6px}
.cl-sug>div{display:flex;flex-wrap:wrap;gap:6px}
.sheet .cl-sug button{height:34px;padding:0 11px;border-radius:999px;font:700 14px var(--f-num)}
.cl-tools{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sheet .cl-tools button{height:40px;font-size:12px;color:var(--rec-muted)}
.sheet .cl-done{background:var(--rec-fg);color:var(--rec-bg);border-color:var(--rec-fg)}

/* v17: two greens */
.two-g{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;margin:4px 0 10px;cursor:pointer}
.two-g input{width:18px;height:18px;accent-color:var(--turf)}
.gnames{margin-bottom:10px}
.par-cell input+input{margin-top:2px}
.yd-sw{display:inline-flex;align-items:center;gap:5px;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.12);color:inherit;border-radius:999px;padding:3px 9px;font:inherit;font-family:var(--f-num);font-size:12px;cursor:pointer;opacity:1!important}
.yd-sw svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* v18: course picker, simple fairway */
.cp-list{display:flex;flex-direction:column;gap:6px}
.cp-card{display:grid;grid-template-columns:16px 1fr;column-gap:6px;text-align:left;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--fg);font:inherit;cursor:pointer}
.cp-card b{font-size:15px}.cp-card small{grid-column:2;font-size:12px;color:var(--muted)}
.cp-card .cp-star{color:#E0A100;font-size:13px;line-height:20px}
.cp-card.on{border:2px solid var(--turf);background:color-mix(in srgb,var(--turf) 10%,var(--bg));padding:9px 11px}
.cp-more{margin-top:6px;width:100%}
.cp-sheet{max-height:86vh;overflow:auto}
.cp-sheet select{width:100%;height:46px;border-radius:12px}
.cp-rows{display:flex;flex-direction:column;border-top:1px solid var(--rec-line)}
.cp-row{display:flex;align-items:center;border-bottom:1px solid var(--rec-line)}
.cp-row.on .cp-main b{color:var(--turf)}
.sheet .cp-fav{flex:0 0 48px;height:56px;border:0;background:transparent;font-size:22px;color:#E0A100;border-radius:0}
.sheet .cp-main{flex:1;height:auto;min-height:56px;border:0;background:transparent;text-align:left;display:flex;flex-direction:column;justify-content:center;gap:2px;padding:6px 4px;border-radius:0}
.cp-main b{font-size:15px}.cp-main small{font-size:12px;color:var(--rec-muted);font-weight:500}
.fairway .on-t{fill:#fff}

/* v19: one course list */
.pref-sel{width:100%;height:46px;border-radius:12px;margin:2px 0 8px}
.panel .cp-rows{border-top:1px solid var(--line)}
.panel .cp-row{border-bottom:1px solid var(--line)}
.cp-fav{flex:0 0 46px;height:58px;border:0;background:transparent;font-size:22px;color:#E0A100;cursor:pointer;padding:0}
.cp-main{flex:1;min-height:58px;border:0;background:transparent;text-align:left;display:flex;flex-direction:column;justify-content:center;gap:2px;padding:6px 4px;color:inherit;font:inherit;cursor:pointer}
.panel .cp-main small{color:var(--muted)}
.cp-go{color:var(--muted);font-size:22px;padding:0 6px 0 2px}
.link-del{display:block;margin:14px auto 0;background:none;border:0;color:var(--q-double);font:inherit;font-size:13px;text-decoration:underline;cursor:pointer}

.add-course{width:100%;margin-top:12px;border-style:dashed}
.btn.cp-empty{height:52px;border-style:dashed;font-size:15px;margin-top:0}

/* v20: start form, club columns */
.start-row{flex-wrap:nowrap}
.start-row .field{min-width:0}
select.ph{color:var(--muted)}
.cl-cols{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cl-col{border:1px solid var(--rec-line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.cl-h{font-size:11px;font-weight:700;color:var(--rec-muted);padding:8px 10px;border-bottom:1px solid var(--rec-line);background:var(--rec-bg)}
.cl-scroll{display:flex;flex-direction:column;max-height:min(46vh,380px);overflow:auto}
.sheet .cl-in,.sheet .cl-cand{height:38px;border:0;border-bottom:1px solid var(--rec-line);border-radius:0;background:transparent;display:flex;align-items:center;justify-content:space-between;padding:0 12px;font:700 16px var(--f-num);flex:0 0 auto}
.sheet .cl-in{color:var(--rec-fg)}
.sheet .cl-cand{color:var(--rec-muted);justify-content:flex-start;gap:10px}
.cl-in span,.cl-cand span{font-size:13px;color:var(--rec-muted)}
.sheet .cl-cand[aria-disabled="true"]{opacity:.45}
.cl-custom{display:flex;gap:6px}
.cl-custom input{flex:1;min-width:0;height:42px;border-radius:12px;font-size:14px}
.sheet .cl-custom button{height:42px;padding:0 16px}
.cl-tools .cl-done{color:var(--rec-bg)!important}

/* v21 */
.cp-field{width:100%;min-height:58px;display:flex;align-items:center;justify-content:space-between;gap:10px;text-align:left;padding:8px 14px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--fg);font:inherit;cursor:pointer}
.cp-field span{display:flex;flex-direction:column;gap:2px}
.cp-field b{font-size:16px}.cp-field small{font-size:12px;color:var(--muted)}
.cp-field i{font-style:normal;font-size:24px;color:var(--muted)}
.cp-field.ph{border:2px dashed var(--turf);color:var(--turf);font-weight:700}
.cp-sub{font-size:12px;font-weight:700;color:var(--rec-muted);margin:6px 0 -2px}
.cp-check{color:var(--turf);font-size:20px;font-weight:700;padding:0 10px}
.cl-col{border:0;overflow:visible;gap:6px}
.cl-h{border:0;background:none;padding:0 2px 2px}
.cl-scroll{gap:6px;padding:2px}
.sheet .cl-in,.sheet .cl-cand{height:40px;border-radius:10px;justify-content:center;padding:0 10px;font:700 16px var(--f-num)}
.sheet .cl-in{background:var(--rec-fg);color:var(--rec-bg);border:1px solid var(--rec-fg)}
.sheet .cl-cand{background:var(--rec-bg);color:var(--rec-fg);border:1px solid var(--rec-line)}
.sheet .cl-in:active,.sheet .cl-cand:active{transform:scale(.96)}

/* v22: grouped clubs, favorite-only course pick */
.clubs-sheet p small.full{color:var(--q-bogey)}
.cg{display:flex;flex-direction:column;gap:10px}
.cg-row{display:grid;grid-template-columns:84px 1fr;gap:8px;align-items:start}
.cg-h{font-size:11.5px;white-space:nowrap;letter-spacing:-.02em;font-weight:700;color:var(--rec-muted);padding-top:9px}
.cg-chips{display:flex;flex-wrap:wrap;gap:6px}
.sheet .cg-chip{height:36px;min-width:46px;padding:0 9px;border-radius:10px;border:1px solid var(--rec-line);background:var(--rec-bg);color:var(--rec-fg);font:700 15px var(--f-num)}
.sheet .cg-chip.on{background:var(--rec-fg);color:var(--rec-bg);border-color:var(--rec-fg)}
.sheet .cg-chip[aria-disabled="true"]{opacity:.4}
.cg .cl-custom{display:inline-flex;gap:4px}
.cg .cl-custom input{width:72px;height:36px;border-radius:10px;font-size:13px;padding:0 8px}
.sheet .cg .cl-custom button{height:36px;width:36px;padding:0;border-radius:10px;font-size:18px}
.sheet .cp-new{height:44px;font-size:13px;border-style:dashed;color:var(--rec-muted)}
@media (max-height:700px){.cg{gap:7px}.sheet .cg-chip{height:34px}}

/* v23 */
.cg-row.cont{margin-top:-4px}
.cp-favs{display:flex;flex-direction:column;gap:8px}
.sheet .cp-fcard{height:auto;min-height:62px;display:flex;align-items:center;gap:10px;text-align:left;padding:8px 14px;border:1px solid var(--rec-line);border-radius:14px;background:var(--rec-surface);box-shadow:0 2px 8px -4px rgba(0,0,0,.18)}
.sheet .cp-fcard.on{border:2px solid var(--turf);background:color-mix(in srgb,var(--turf) 9%,var(--rec-surface));padding:7px 13px}
.cp-fstar{color:#E0A100;font-size:18px}
.cp-ftxt{flex:1;display:flex;flex-direction:column;gap:2px}
.cp-ftxt b{font-size:16px}.cp-ftxt small{font-size:12px;color:var(--rec-muted);font-weight:500}
.cp-radio{width:22px;height:22px;border-radius:50%;border:2px solid var(--rec-line);flex:0 0 22px}
.cp-fcard.on .cp-radio{border:7px solid var(--turf)}
.cp-addbox{background:var(--rec-bg);border:1px dashed var(--rec-line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px}
.cp-addh{font-size:13px;font-weight:700;color:var(--rec-muted)}
.cp-addbox select{background:var(--rec-surface)}
.cp-addlist{display:flex;flex-direction:column}
.cp-arow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 2px;border-bottom:1px solid var(--rec-line)}
.cp-arow span{display:flex;flex-direction:column;gap:2px;min-width:0}
.cp-arow b{font-size:14px}.cp-arow small{font-size:11.5px;color:var(--rec-muted)}
.sheet .cp-arow button{height:34px;padding:0 14px;border-radius:999px;font-size:13px;background:var(--turf);border-color:var(--turf);color:#fff;flex:0 0 auto}

/* v24: club rows as 7-column grid, label above */
.cg{gap:8px}
.cg-row,.cg-row.cont{display:block;margin:0}
.cg-h{padding:0 0 3px;font-size:11px;white-space:nowrap}
.cg-chips{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.sheet .cg-chip{min-width:0;padding:0;height:36px;font-size:14px}
.cg .cl-custom{grid-column:span 3;display:flex}
.cg .cl-custom input{flex:1;width:auto;min-width:0}

.cg .cl-custom2{display:flex;gap:6px}
.cg .cl-custom2 input{flex:1;height:38px;border-radius:10px;font-size:13px;padding:0 10px}
.sheet .cg .cl-custom2 button{height:38px;width:auto;padding:0 16px;font-size:14px;border-radius:10px}

.cg{gap:6px}.sheet .cg-chip{height:34px}.clubs-sheet{gap:8px}.cg-h{padding-bottom:2px}

/* v25 */
.gsw{display:inline-flex;border:1px solid rgba(255,255,255,.4);border-radius:999px;overflow:hidden;margin:1px 0}
.gsw button{border:0;background:transparent;color:inherit;font:700 11px var(--f-num);letter-spacing:.06em;padding:3px 10px;opacity:.7;cursor:pointer}
.gsw button[aria-pressed="true"]{background:#fff;color:#0B5F3F;opacity:1}
.fs-row.has-sub{border-bottom:0;padding-bottom:4px}
.sheet .fs-sub{height:40px;display:flex;justify-content:space-between;align-items:center;padding:0 12px;margin:0 0 6px;font-size:13px;color:var(--rec-fg);background:var(--rec-bg);border-radius:10px}
.fs-sub small{color:var(--rec-muted);font-weight:700}

.hc2 .live b small{font-size:13px;margin-left:2px;opacity:.85;font-weight:600}

/* v26: stats tabs */
.stat-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:0 0 14px;position:sticky;top:0;z-index:5;background:var(--bg);padding:6px 0}
.stat-tabs button{height:50px;border-radius:14px;border:1px solid var(--line);background:var(--paper);color:var(--muted);font:700 14px var(--f-body);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;cursor:pointer}
.stat-tabs button em{font-style:normal;font:700 9px var(--f-num);letter-spacing:.16em;opacity:.8}
.stat-tabs button[aria-selected="true"]{background:linear-gradient(135deg,#1E3A8A,#2F7DE1);color:#fff;border-color:transparent;box-shadow:0 8px 18px -10px #2F7DE1}

</style>
<title>ショートコース スコアカード</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=Barlow+Condensed:wght@500;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
/* Layout: a paper scorecard — sticky tab strip, one column of ruled panels, numbers set in condensed figures */
:root{
  --bg:#F1F4F3; --paper:#FFFFFF; --fg:#0B1310; --muted:#66746D; --line:#E0E6E3; --soft:#EEF2F0;
  --turf:#0E9F62; --turf-ink:#FFFFFF; --flag:#F2B01E; --accent2:#13A9C2;
  --under:#E5484D; --over:#3E63DD; --warn:#F08C1A;
  --c1:#0E9F62; --c2:#F2B01E; --c3:#3E63DD; --c4:#E5484D; --c5:#8B5CF6; --c6:#13A9C2;
  --q-hio:#F5B700; --q-eagle:#1E3A8A; --q-birdie:#2563EB; --q-par:#4F9BEA; --q-bogey:#F28C28; --q-double:#E5484D; --q-triple:#9F1D2A; --q-neutral:#C3CDD5;
  --rec-bg:#EEF2F0; --rec-surface:#FFFFFF; --rec-raise:#EEF3F0; --rec-line:#DDE5E1; --rec-fg:#0B1310; --rec-muted:#6E7C75;
  --rec-sel:#0B1310; --rec-sel-ink:#FFFFFF; --rec-turf:#0E9F62; --rec-turf-hi:#2FD58C; --rec-under:#E5484D; --rec-over:#3E63DD; --rec-warn:#F08C1A; --rec-fade:rgba(238,242,240,0);
  --glow:rgba(14,159,98,.18); --shadow:0 1px 2px rgba(11,19,16,.04),0 8px 24px rgba(11,19,16,.06);
  --f-body:"Zen Kaku Gothic New",system-ui,"Hiragino Sans","Yu Gothic",sans-serif;
  --f-num:"Barlow Condensed","Zen Kaku Gothic New",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#070C0A; --paper:#0F1714; --fg:#ECF4EF; --muted:#8B9A92; --line:#1F2C26; --soft:#16211C;
  --turf:#2EE59D; --turf-ink:#03130B; --flag:#FFC53D; --accent2:#3BD3EA; --under:#FF6B6B; --over:#7AA2FF; --warn:#FFA94D;
  --c1:#2EE59D; --c2:#FFC53D; --c3:#7AA2FF; --c4:#FF6B6B; --c5:#B59CFF; --c6:#3BD3EA;
  --q-hio:#FFC53D; --q-eagle:#3B5BDB; --q-birdie:#4C8DFF; --q-par:#6FB1F5; --q-bogey:#FFA94D; --q-double:#FF5A5F; --q-triple:#C2323F; --q-neutral:#4A5965;
  --rec-bg:#070C0A; --rec-surface:#0F1714; --rec-raise:#17221D; --rec-line:#22312A; --rec-fg:#ECF4EF; --rec-muted:#8B9A92;

.rec-bar{position:fixed;left:0;right:0;bottom:0;z-index:11;padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:linear-gradient(to top,var(--rec-bg) 70%,var(--rec-fade));display:flex;gap:10px;max-width:760px;margin:0 auto}

@media (max-height:700px){.rec{gap:9px;padding-top:6px}.hole-card{padding:12px 16px 12px}.hole-card .hno{font-size:66px}.hole-card .par{font-size:28px}.badge{margin-top:8px}.rec-card{gap:11px;padding:12px}.seg button{height:48px}.seg.s6 button{height:42px}.greenpad{height:140px}.gp-long,.gp-short,.gp-left,.gp-right{height:30px!important}.gp-left,.gp-right{top:calc(50% - 15px)!important}.trouble button{height:40px}.rec-bar button{height:50px}}

/* v3 polish */

/* v4: analysis */
.hero-stat{position:relative;overflow:hidden;border-radius:24px;padding:18px;color:#fff;background:linear-gradient(135deg,#0A1024 0%,#1B2F7A 55%,#2563EB 100%);box-shadow:0 12px 28px -14px rgba(10,16,36,.7)}
.hero-stat::before{content:"";position:absolute;right:-80px;top:-70px;width:280px;height:240px;border-radius:50%;background:repeating-radial-gradient(ellipse at center,rgba(255,255,255,.12) 0 1px,transparent 1px 14px);pointer-events:none}
.hero-stat .who{position:relative;font-size:11px;letter-spacing:.2em;font-weight:700;opacity:.75}
.hero-stat .main{position:relative;display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-top:6px}
.hero-stat .big{font-family:var(--f-num);font-size:72px;font-weight:700;line-height:.85}
.hero-stat .big small{font-size:14px;opacity:.65;margin-left:6px;letter-spacing:.1em;font-weight:600}
.hero-stat .topar{font-family:var(--f-num);font-size:22px;font-weight:700;margin-top:6px;opacity:.9}
.hero-stat .spark{width:46%;max-width:180px;height:56px}
.hero-stat .row{position:relative;display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:8px;margin-top:16px;padding-top:12px;border-top:1px solid rgba(255,255,255,.15)}
.hero-stat .row span{display:block;font-size:9px;letter-spacing:.16em;opacity:.65;font-weight:700}
.hero-stat .row b{font-family:var(--f-num);font-size:24px;font-weight:700}
.sec{display:flex;align-items:baseline;gap:8px;margin:0 0 12px}
.sec em{font-style:normal;font-size:10px;font-weight:700;letter-spacing:.22em;color:var(--turf)}
.sec span{font-size:14px;font-weight:900}
.who-pick{background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:4px;display:flex;gap:4px;box-shadow:var(--shadow)}
.who-pick button{flex:1 1 0;border:0!important;padding:9px 12px!important;background:transparent!important;font-size:14px!important}
.who-pick button[aria-selected="true"]{background:var(--fg)!important;color:var(--bg)!important}
.filters select{border-radius:12px;background:var(--soft);border-color:transparent;font-weight:700;font-size:14px}

/* v4: history */
.month{font-size:11px;font-weight:700;letter-spacing:.16em;color:var(--muted);margin:6px 2px -4px}
.rcard{background:var(--paper);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
.rcard>button{all:unset;box-sizing:border-box;width:100%;display:grid;grid-template-columns:62px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 14px;cursor:pointer}
.rcard>button:focus-visible{outline:2px solid var(--flag);outline-offset:-2px}
.rcard .day{text-align:center;line-height:1}
.rcard .day b{display:block;font-family:var(--f-num);font-size:23px;font-weight:700;white-space:nowrap}
.rcard .day small{font-size:10px;color:var(--muted);font-weight:700;letter-spacing:.1em}
.rcard .mid{min-width:0}
.rcard .cname{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rcard .strip{display:flex;gap:2px;margin-top:6px}
.rcard .strip i{flex:1 1 0;max-width:14px;height:8px;border-radius:2px}
.rcard .sc-tot{text-align:right;line-height:1}
.rcard .sc-tot b{font-family:var(--f-num);font-size:30px;font-weight:700}
.rcard .sc-tot small{display:block;font-family:var(--f-num);font-size:15px;font-weight:700;margin-top:2px}
.rcard .sc-tot span{display:block;font-size:10px;color:var(--muted);margin-top:3px}
.rcard .detail{padding:0 14px 14px;display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line);padding-top:12px}
.q-eagle{background:var(--q-eagle)}.q-birdie{background:var(--q-birdie)}.q-par{background:var(--q-par)}.q-bogey{background:var(--q-bogey)}.q-double{background:var(--q-double)}.q-triple{background:var(--q-triple)}

.mk2{display:inline-flex;width:26px;height:26px;border-radius:7px;align-items:center;justify-content:center;font-weight:700;color:#fff}
.mk2.q-par,.mk2.q-bogey{color:#0B1310}

/* v5: approach map */
.approach{display:block;width:100%;height:auto;user-select:none;-webkit-user-select:none}
.approach .az{cursor:pointer;outline:none}
.az-rough{fill:var(--rec-raise)}
.az-bg{fill:var(--rec-surface);stroke:var(--rec-line);stroke-width:1;transition:fill .15s}
.az:active .az-bg{fill:var(--rec-line)}
.az.on-sel .az-bg{fill:var(--rec-fg);stroke:var(--rec-fg)}
.az-t{font:700 13px var(--f-body);fill:var(--rec-fg);text-anchor:middle;dominant-baseline:middle;pointer-events:none}
.az.on-sel .az-t{fill:var(--rec-bg)}
.sand{fill:#E9D8A6;stroke:#D6C38C;stroke-width:1;pointer-events:none}
.fringe{fill:color-mix(in srgb,var(--rec-turf) 22%,var(--rec-raise))}
.g-ring{fill:none;stroke:transparent;stroke-width:4}
.az-green.on-sel .g-ring{stroke:var(--rec-fg)}
.on-t{fill:#fff;font-size:14px}
.az-green.on-sel .on-t{fill:#fff}
.az:focus-visible .az-bg,.az-green:focus-visible .g-ring{stroke:var(--flag);stroke-width:3}
.tracer{fill:none;stroke:#F2B01E;stroke-width:2.5;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:0;animation:trace .45s ease-out;opacity:.9;pointer-events:none}
@keyframes trace{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
.ballg{pointer-events:none}
.ballg.drop{animation:drop .45s cubic-bezier(.2,1.4,.5,1)}
@keyframes drop{0%{opacity:0;transform:translateY(-7px)}60%{opacity:1}100%{transform:none}}
@media (prefers-reduced-motion:reduce){.tracer,.ballg.drop{animation:none}}


/* v6 */
.mk3{display:inline-flex;width:26px;height:26px;align-items:center;justify-content:center;font-weight:700}
.m-birdie{border:2px solid var(--q-birdie);border-radius:50%;color:var(--q-birdie)}
.m-eagle{border:2px solid var(--q-eagle);border-radius:50%;color:var(--q-eagle);box-shadow:0 0 0 2px var(--paper),0 0 0 4px var(--q-eagle)}
.m-par{color:var(--fg)}
.m-bogey{border:2px solid var(--muted);color:var(--fg)}
.m-double{border:2px solid var(--q-double);color:var(--q-double);box-shadow:0 0 0 2px var(--paper),0 0 0 4px var(--q-double)}
.m-triple{background:var(--q-triple);color:#fff}
.sc-legend{display:flex;flex-wrap:wrap;gap:10px;font-size:11px;color:var(--muted)}
.sc-legend span{display:inline-flex;align-items:center;gap:4px}
.sc-legend .mk3{width:16px;height:16px;font-size:0}
.sc-legend .m-eagle,.sc-legend .m-double{box-shadow:0 0 0 1.5px var(--paper),0 0 0 3px currentColor}

/* celebration + best pace */
.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:3}
.confetti i{position:absolute;top:-14px;width:7px;height:11px;border-radius:2px;animation:fall 3s linear infinite}
@keyframes fall{0%{transform:translateY(0) translateX(0) rotate(0);opacity:0}8%{opacity:1}50%{transform:translateY(120px) translateX(12px) rotate(300deg)}100%{transform:translateY(260px) translateX(-8px) rotate(620deg);opacity:.2}}
.hole-card.flash{animation:flash .9s ease-out}
@keyframes flash{0%{box-shadow:0 0 0 0 rgba(242,176,30,.9)}100%{box-shadow:0 0 0 18px rgba(242,176,30,0)}}
.pace{position:absolute;left:18px;top:14px;z-index:2;font-size:10px;font-weight:900;letter-spacing:.16em;padding:4px 9px;border-radius:999px;background:linear-gradient(120deg,#F2B01E,#FFD76A);color:#3A2600}
.hole-card .row1 .lbl{visibility:var(--lbl-vis,visible)}

/* round result */
.result-back{position:fixed;inset:0;z-index:40;background:rgba(5,10,20,.6);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;padding:20px max(16px,env(safe-area-inset-right,0px)) 20px max(16px,env(safe-area-inset-left,0px));animation:fadeIn .25s ease-out}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.result-card{position:relative;width:100%;max-width:380px;border-radius:28px;overflow:hidden;color:#fff;background:linear-gradient(150deg,#08261C 0%,#0B6B44 50%,#0E8FA0 100%);box-shadow:0 30px 60px -20px rgba(0,0,0,.6);animation:rise .5s cubic-bezier(.2,1.2,.4,1)}
@keyframes rise{from{transform:translateY(30px) scale(.96);opacity:0}to{transform:none;opacity:1}}
.result-card::before{content:"";position:absolute;right:-90px;top:-80px;width:320px;height:280px;border-radius:50%;background:repeating-radial-gradient(ellipse at center,rgba(255,255,255,.12) 0 1px,transparent 1px 14px)}
.rc-in{position:relative;z-index:4;padding:22px 22px 18px;display:flex;flex-direction:column;gap:14px}
.rc-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.rc-top .k{font-size:10px;letter-spacing:.22em;font-weight:700;opacity:.7}
.rc-top .n{font-size:18px;font-weight:900;margin-top:2px}
.rc-top .c{font-size:12px;opacity:.75}
.rc-flag{font-size:10px;font-weight:900;letter-spacing:.12em;padding:5px 10px;border-radius:999px;background:linear-gradient(120deg,#F2B01E,#FFD76A);color:#3A2600;white-space:nowrap}
.rc-score{display:flex;align-items:flex-end;gap:12px}
.rc-score b{font-family:var(--f-num);font-size:96px;line-height:.8;font-weight:700}
.rc-score span{font-family:var(--f-num);font-size:30px;font-weight:700;opacity:.9;margin-bottom:6px}
.rc-strip{display:flex;gap:3px}
.rc-strip i{flex:1;height:10px;border-radius:3px}
.rc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding-top:12px;border-top:1px solid rgba(255,255,255,.18)}
.rc-grid div{line-height:1}
.rc-grid span{display:block;font-size:9px;letter-spacing:.14em;opacity:.7;font-weight:700;margin-bottom:5px}
.rc-grid b{font-family:var(--f-num);font-size:24px;font-weight:700}
.rc-brand{font-size:10px;letter-spacing:.2em;opacity:.55;font-weight:700;text-align:right}
.rc-close{margin-top:14px;width:100%;max-width:380px;height:50px;border-radius:16px;border:0;background:#fff;color:#0B1310;font:inherit;font-weight:900;font-size:15px;cursor:pointer}
.result-wrap{display:flex;flex-direction:column;align-items:center;width:100%}
.result-wrap p{color:rgba(255,255,255,.8);font-size:12px;margin:10px 0 0}
@media (prefers-reduced-motion:reduce){.confetti i,.hole-card.flash,.result-card,.result-back{animation:none}}


/* v7 */
.az.on-sel .az-bg{fill:color-mix(in srgb,#F2B01E 30%,var(--rec-surface));stroke:#F2B01E;stroke-width:2}
.az.on-sel .az-t{fill:var(--rec-fg)}
.az-green.on-sel .g-ring{stroke:#F2B01E}
.tracer{animation:none}
.tracer.anim{animation:trace .5s ease-out both}
.ballg.drop{animation:drop .3s cubic-bezier(.2,1.2,.5,1) .48s both}
.az-s .az-bg{stroke:var(--line)}
.az-p{font:700 18px var(--f-num);fill:var(--fg);text-anchor:middle;dominant-baseline:middle}
.az-p.worst{fill:var(--q-triple)}
.on-p{font:700 26px var(--f-num);fill:#fff;text-anchor:middle;dominant-baseline:middle}
.m-eagle{box-shadow:none!important;outline:2px solid var(--q-eagle);outline-offset:2px}
.m-double{box-shadow:none!important;outline:2px solid var(--q-double);outline-offset:2px}
.sc-legend .m-eagle,.sc-legend .m-double{outline-width:1.5px;outline-offset:1.5px}
.rc-sc{display:flex;flex-direction:column;gap:6px}
.rc-sc table{width:100%;border-collapse:collapse;font-family:var(--f-num);font-variant-numeric:tabular-nums;table-layout:fixed}
.rc-sc td{text-align:center;padding:2px 0;font-size:13px}
.rc-sc tr.h td{font-size:10px;opacity:.6}
.rc-sc tr.p td{font-size:11px;opacity:.75}
.rc-sc .mk3{width:22px;height:22px;font-size:14px}
.rc-sc .m-par,.rc-sc .m-bogey{color:#fff}
.rc-sc .m-bogey{border-color:rgba(255,255,255,.75)}
.rc-sc .m-birdie{border-color:#9DF5C9;color:#9DF5C9}.rc-sc .m-eagle{border-color:#9DF5C9;color:#9DF5C9;outline-color:#9DF5C9}
.rc-sc .m-double{border-color:#FFB3A6;color:#FFB3A6;outline-color:#FFB3A6}
.rc-sc .m-triple{background:#FF5A5F}

.spark-w{display:flex;flex-direction:column;align-items:flex-end;gap:4px;width:46%;max-width:180px}
.spark-w span{font-size:9px;letter-spacing:.08em;opacity:.7;font-weight:700;white-space:nowrap}
.spark-w .spark{width:100%}

/* v8: new scale (HIO gold → blue → green → orange → red → dark red) */
.seg button.t-hio{--sel:var(--q-hio)}
.seg button.t-hio[aria-pressed="true"]{color:#3A2600}
.seg button.t-par[aria-pressed="true"],.seg button.t-bogey[aria-pressed="true"]{color:#fff}
.seg button.t-par[aria-pressed="true"] small,.seg button.t-bogey[aria-pressed="true"] small{color:rgba(255,255,255,.85)}
.dots button.r-par,.dots button.r-bogey{color:#fff}
.dots button.r-hio{background:var(--q-hio);color:#3A2600}
.badge.b-par,.badge.b-bogey,.badge.b-double{color:#fff}
.badge.b-par{background:var(--q-par)}.badge.b-bogey{background:var(--q-bogey)}.badge.b-double{background:var(--q-double)}
.q-hio{background:var(--q-hio)}
.m-hio{background:var(--q-hio);color:#3A2600;border-radius:50%;outline:2px solid var(--q-hio);outline-offset:2px}
.m-bogey{border:2px solid var(--q-bogey);color:var(--q-bogey)}
.m-par{color:var(--q-par)}
.rc-sc .m-par{color:#9EF0BE}.rc-sc .m-bogey{border-color:#FFC37A;color:#FFC37A}
.rc-sc .m-birdie,.rc-sc .m-eagle{border-color:#A9C8FF;color:#A9C8FF;outline-color:#A9C8FF}
.rc-sc .m-double{border-color:#FF9A9E;color:#FF9A9E;outline-color:#FF9A9E}
.rc-sc .m-triple{background:#E5484D}
.recent{display:flex;flex-direction:column;gap:8px}
.rr{display:grid;grid-template-columns:44px minmax(0,1fr);gap:8px;align-items:center;padding-bottom:8px;border-bottom:1px solid var(--line)}
.rr:last-child{border-bottom:0;padding-bottom:0}
.rd{line-height:1.1}
.rd b{display:block;font-family:var(--f-num);font-size:15px}
.rd small{font-family:var(--f-num);font-size:12px;color:var(--muted);font-weight:700}
.rh{display:grid;grid-template-columns:repeat(9,1fr);gap:4px 2px;justify-items:center}
.rh .mk3{width:24px;height:24px;font-size:13px}
.rh .m-eagle,.rh .m-double,.rh .m-hio{outline-offset:1.5px;outline-width:1.5px}

.m-par{color:var(--fg)}
.rc-sc .m-par{color:#fff}
.rc-sc .m-birdie,.rc-sc .m-eagle{border-color:#9EC5FF;color:#9EC5FF;outline-color:#9EC5FF}

/* v9: recent 5 — symbols only */
.rr{grid-template-columns:62px minmax(0,1fr)!important}
.rd small{display:block;font-family:var(--f-num);font-size:12px;color:var(--muted);font-weight:700}
.rd b{font-family:var(--f-num);font-size:20px!important;white-space:nowrap}
.rd b i{font-style:normal;font-size:12px;color:var(--muted);margin-left:2px}
.mk4{display:inline-block;width:14px;height:14px;box-sizing:border-box;position:relative}
.mk4.m-par{width:12px;height:2px;background:var(--muted);border-radius:2px;margin:6px 1px}
.mk4.m-birdie{border:2px solid var(--q-birdie);border-radius:50%}
.mk4.m-eagle{border:2px solid var(--q-eagle);border-radius:50%;outline:1.5px solid var(--q-eagle);outline-offset:1.5px}
.mk4.m-hio{background:var(--q-hio);border-radius:50%}
.mk4.m-bogey{border:2px solid var(--q-bogey)}
.mk4.m-double{border:2px solid var(--q-double);outline:1.5px solid var(--q-double);outline-offset:1.5px}
.mk4.m-triple{background:var(--q-triple)}
.rh{align-items:center;min-height:22px}
.mk-legend{display:flex;flex-wrap:nowrap;justify-content:flex-end;gap:10px;margin-top:12px;font-size:11px;font-family:var(--f-num);font-weight:700;color:var(--muted);white-space:nowrap}
.mk-legend span{display:inline-flex;align-items:center;gap:4px}
.mk-legend .mk4{transform:scale(.8)}


/* v10 */
.tr path{fill:none;stroke-linecap:round;pointer-events:none;stroke-dasharray:1;stroke-dashoffset:0}
.tr .tr-shadow{stroke:rgba(0,0,0,.16);stroke-width:3}
.tr .tr-glow{stroke:#FFB020;stroke-width:7;opacity:.45}
.tr .tr-core{stroke-width:3}
.tr .tr-hi{stroke:rgba(255,255,255,.85);stroke-width:1}
.tr.anim path{animation:trace .5s ease-out both}
.tracer{display:none}
.rc-actions{display:flex;gap:10px;width:100%;max-width:380px;margin-top:14px}
.rc-actions button{flex:1;height:50px;border-radius:16px;border:0;font:inherit;font-weight:900;font-size:15px;cursor:pointer}
.rc-save{background:linear-gradient(120deg,var(--turf),var(--accent2));color:#fff}
.rc-actions .rc-close{margin:0;background:#fff;color:#0B1310}
.rc-sub{margin-top:10px}
.rc-actions .rc-back{background:rgba(255,255,255,.16);color:#fff;border:1px solid rgba(255,255,255,.35)}
.resume{display:flex;flex-direction:column;gap:10px}
.resume .rinfo{display:flex;justify-content:space-between;align-items:center;gap:10px}
.resume .rinfo b{font-size:15px}
.resume .rinfo span{font-family:var(--f-num);font-size:22px;font-weight:700}
.resume .rbtns{display:flex;gap:8px}.resume .rbtns .btn{flex:1}


/* v11 */
.az-green.on-sel .on-t,.az.az-green.on-sel .az-t{fill:#fff}
.confetti.full{position:fixed;inset:0;z-index:43;pointer-events:none}
.confetti.full i{animation-name:fallFull}
@keyframes fallFull{0%{transform:translateY(0) rotate(0);opacity:0}5%{opacity:1}100%{transform:translateY(110vh) translateX(20px) rotate(720deg);opacity:.6}}
.result-wrap{position:relative;z-index:42}


/* v12: record screen fits one phone screen */
body.recording .wrap{padding-bottom:0}
body.recording section.view{padding-top:0}
.rc2:not(:has(.ap-wrap)){flex:0 0 auto;gap:16px}
.rc2:not(:has(.ap-wrap)) .seg button{height:62px;font-size:26px}
.rc2:not(:has(.ap-wrap)) .seg.s6 button{height:56px}
.rc2:not(:has(.ap-wrap)) .trouble button{height:56px;font-size:15px}
.rec2{height:100vh;height:100dvh;box-sizing:border-box;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px));gap:8px;padding-top:8px;overflow:hidden}
.rec2 .rec-top{gap:8px}
.rec2 .icon-btn{width:34px;height:34px;flex:0 0 34px}
.rec2 .icon-btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round}
.rec2 .ring,.rec2 .ring svg{width:40px;height:40px;flex:0 0 40px}
.rec2 .ring b{font-size:12px}
.rec2 .dots button{height:30px}
.hc2{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;padding:10px 14px;flex:0 0 auto}
.hc2 .hno{font-size:52px}
.hc2 .hno small{font-size:16px}
.hc2 .hc-m{display:flex;flex-direction:column;align-items:flex-start;gap:3px;position:relative}
.hc2 .par{font-family:var(--f-num);font-size:22px;font-weight:700;line-height:1}
.hc2 .par span{font-size:11px;opacity:.7;margin-right:4px;letter-spacing:.12em}
.hc2 .yd{font-family:var(--f-num);font-size:12px;opacity:.75}
.hc2 .badge{margin-top:2px;font-size:10px;padding:4px 9px}
.hc2 .live{display:flex;flex-direction:column;gap:6px;position:relative}
.hc2 .live div{text-align:right;line-height:1}
.hc2 .live span{display:block;font-size:8px;letter-spacing:.16em;opacity:.65;font-weight:700;margin-bottom:2px}
.hc2 .live b{font-family:var(--f-num);font-size:20px;font-weight:700}
.rc2{flex:1;min-height:0;display:flex;flex-direction:column;gap:9px;padding:12px;overflow:hidden}
.rc2 .seg-head{margin-bottom:5px}
.rc2 .seg button{height:46px}
.rc2 .seg.s6 button{height:40px}
.ap-wrap{flex:1 1 auto;min-height:90px;display:flex;flex-direction:column}
.ap-wrap .approach{flex:1;min-height:0;width:100%;height:100%}
.chips2{display:grid;gap:5px}
.chips2.c4{grid-template-columns:repeat(4,1fr)}
.chips2.scroll{display:flex;overflow-x:auto;scrollbar-width:none}
.chips2.scroll::-webkit-scrollbar{display:none}
.chip2{height:36px;min-width:44px;padding:0 8px;border-radius:10px;border:1px solid var(--rec-line);background:var(--rec-bg);color:var(--rec-fg);font:inherit;font-weight:700;font-size:12px;cursor:pointer;white-space:nowrap;flex:0 0 auto}

<div class="wrap">

  </header>

    <button role="tab" data-tab="stats" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>分析</button>

    <button role="tab" data-tab="courses" aria-selected="false"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="15" rx="9" ry="5"/><path d="M12 15V3l6 2.5L12 8"/></svg>コース</button>
  </nav>

<div class="toast" id="toast" hidden></div>

<script>
(() => {
"use strict";
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const LS = {
  get(k, d){ try{ const v = localStorage.getItem(k); if(!v) return d; const x = JSON.parse(v);
    // 壊れた値・型の違う値（null や配列のはずがオブジェクト等）は初期値に戻す
    if(x==null || (Array.isArray(d) && !Array.isArray(x)) || (d && typeof d==="object" && !Array.isArray(d) && (typeof x!=="object" || Array.isArray(x)))) return d;
    return x; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,8);
const today = () => { const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };
const DIRS = { on:"オン", left:"左", right:"右", long:"オーバー", short:"ショート", miss:"ミスショット" };
// あらかじめ用意したコース（公開情報より。ヤードは現地のスコアカードで要確認）
const PRESET_COURSES = [
  { key:"ooyodogawa", name:"大淀川ゴルフ場", pref:"宮崎県", area:"宮崎市", holes:[100,90,110,130,125,120,70,90,80].map(y=>({par:3, yards:y})) },
  { key:"hyuga-seaside", name:"日向シーサイドゴルフクラブ", pref:"宮崎県", area:"日向市", // 公式サイトのホール図より（MG / SG）
    holes:[[152,125],[92,78],[154,132],[218,188],[148,121],[93,73],[138,110],[94,104],[160,142]].map(([m,s2],i)=>({par:3, yards:m, yards2:s2, ...(i?{}:{gn:["MG","SG"]})})) },
  { key:"firtree", name:"ファーツリーカントリークラブ", pref:"宮崎県", area:"延岡市", holes:[[3,76],[3,102],[3,88],[4,284],[3,109],[3,84],[4,366],[3,55],[3,160]].map(([p,y])=>({par:p, yards:y})) },
];
/* グリーンが2つあるコース（例 MG / SG）: 2つ目のヤードは hole.yards2、名前は holes[0].gn に入れる（シートの列を増やさないため） */
const PREFS = ["北海道","青森県","岩手県","宮城県","秋田県","山形県","福島県","茨城県","栃木県","群馬県","埼玉県","千葉県","東京都","神奈川県","新潟県","富山県","石川県","福井県","山梨県","長野県","岐阜県","静岡県","愛知県","三重県","滋賀県","京都府","大阪府","兵庫県","奈良県","和歌山県","鳥取県","島根県","岡山県","広島県","山口県","徳島県","香川県","愛媛県","高知県","福岡県","佐賀県","長崎県","熊本県","大分県","宮崎県","鹿児島県","沖縄県"];
/* 県・市町村もシートの列を増やさないよう holes[0] に入れる（第2段階で Cloudflare に移すときに正式な列にする） */
const cPref = c => (c && (c.pref || (c.holes && c.holes[0] && c.holes[0].pref))) || "";
const cArea = c => (c && (c.area || (c.holes && c.holes[0] && c.holes[0].area))) || "";
const presetTaken = pc => state.courses.some(c=>c.presetKey===pc.key || c.name.replace(/\s/g,"").includes(pc.name.replace(/\s/g,"")));
/* 選べるコース = 登録済み + まだ追加していない用意済みコース（id は "preset:キー"） */
function pickableCourses(){
  const list = state.courses.map(c=>({ id:c.id, name:c.name, pref:cPref(c), area:cArea(c), holes:c.holes }));
  PRESET_COURSES.filter(pc=>!presetTaken(pc)).forEach(pc=>list.push({ id:"preset:"+pc.key, name:pc.name, pref:pc.pref, area:pc.area, holes:pc.holes, preset:true }));
  return list.sort((a,b)=>a.name.localeCompare(b.name,"ja"));
}
const favs = () => LS.get("sc.favs", []);
function courseGreens(c){ if(!c || !c.holes || !c.holes.some(h=>h.yards2)) return null; const g=c.holes[0].gn; return Array.isArray(g)&&g.length===2 ? g : ["A","B"]; }
const TEES = { fw:"フェアウェイ", rl:"左", rr:"右", miss:"ミスショット" };
const CLUBS = ["1W","3W","5W","UT","5I","6I","7I","8I","9I","PW","AW","SW"];
const CLUB_GROUPS = [
  ["ドライバー", ["1W"]],
  ["ウッド", ["3W","4W","5W","7W","9W"]],
  ["ユーティリティ", ["UT","3U","4U","5U","6U"]],
  ["アイアン", ["3I","4I","5I","6I","7I","8I","9I"]],
  ["ウェッジ", ["PW","AW","SW"]],
  ["ウェッジ（角度）", ["48°","50°","52°","54°","56°","58°","60°"]],
];
const CLUB_SUGGEST = CLUB_GROUPS.flatMap(g=>g[1]);
const CLUB_MAX = 13; // パターを除く
const sortClubs = l => l.slice().sort((a,b)=>clubRank(a)-clubRank(b));
function myClubs(){ const c = LS.get("sc.clubs", null); return sortClubs(Array.isArray(c) && c.length ? c.slice(0,13) : CLUBS.slice()); }
function setClubs(list){ LS.set("sc.clubs", sortClubs(list.filter(Boolean)).slice(0,13)); }
function clubRank(n){ const t=String(n).toUpperCase().replace(/\s/g,""); let m;
  if((m=t.match(/^(\d+)W$/))) return +m[1]; if(t==="DR"||t==="DRIVER") return 1;
  if((m=t.match(/^(\d+)(U|H|UT)$/))) return 100+ +m[1]; if(t==="UT"||t==="U") return 104;
  if((m=t.match(/^(\d+)I$/))) return 200+ +m[1];
  if((m=t.match(/^(\d+)°?$/))) return 300+(+m[1]-44)*2;
  return ({PW:304,AW:312,GW:312,SW:324,LW:332,PT:500,PUTTER:500})[t] ?? 400; }
// 記録する項目（打数は常に記録）
const FIELD_DEFS = [
  {k:"putts",  label:"パット数",              def:true},
  {k:"ob",     label:"OB",                    def:true},
  {k:"bunker", label:"バンカー",              def:true},
  {k:"pen",    label:"1ペナ（池・赤杭など）", def:false},
  {k:"shot",   label:"ショットの方向", def:false},
  {k:"club",   label:"使用クラブ", def:false},
  {k:"advice", label:"ホールのアドバイス", def:true, show:true},
  {k:"pace",   label:"自己ベストのペース表示", def:false, show:true},
];
function fields(){ const saved = LS.get("sc.fields", {}); const f={}; if(saved.shot==null && (saved.approach||saved.tee)) saved.shot=true; FIELD_DEFS.forEach(d=>f[d.k] = saved[d.k]!=null ? saved[d.k] : d.def); return f; }

const state = {
  tab: LS.get("sc.tab","record"),
  mode: "connecting", // connecting | cloud | local
  courses: [], rounds: [],
  draft: (d=>d && Array.isArray(d.holes) && d.holes.length ? d : null)(LS.get("sc.draft", null)), // 壊れた下書きは捨てる
  // スコアカード入力（紙と同じ表に最大4人分）の下書き。1ホールずつの下書きとは別に持つ

/* ---------- storage: Google スプレッドシート (Apps Script) ---------- */
// ↓ Apps Script を「ウェブアプリ」として公開したときの URL を貼り付けてください
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw0sl0SbAukE3UDirc5iYePK-XaY9pD5gZvwg5g-IJMdAuiRRqwilifThZvbinzDTuO/exec";
const hasBackend = /^https:\/\/script\.google\.com\//.test(SCRIPT_URL);
let pending = LS.get("sc.pending", []); // 電波が悪くて送れなかった保存
let pendingCourses = LS.get("sc.pendingCourses", []); // 電波がないときに始めた用意済みコース（あとで送る）

async function api(action, payload){
  const res = await fetch(SCRIPT_URL, { method:"POST", headers:{ "Content-Type":"text/plain;charset=utf-8" }, body: JSON.stringify({ action, ...payload }) });
  const j = await res.json();
  if(!j.ok) throw new Error(j.error || "failed");
  return j;
}
function cache(){ LS.set("sc.courses", state.courses); LS.set("sc.rounds", state.rounds); }
const store = {
  async saveCourse(c){ if(hasBackend) await api("saveCourse",{course:c}); upsert(state.courses,c); cache(); render(); },
  async delCourse(id){ if(hasBackend) await api("deleteCourse",{id}); state.courses=state.courses.filter(c=>c.id!==id); cache(); render(); },
  async saveRound(r){
    upsert(state.rounds,r); cache();
    if(hasBackend){
      try{ await api("saveRound",{round:encRound(r)}); }
      catch(e){ pending = pending.filter(p=>p.id!==r.id).concat([r]); LS.set("sc.pending",pending); toast("電波が弱いので端末に保存しました。あとで自動で送ります"); }
    }
    render();
  },
  async delRound(id){ if(hasBackend) await api("deleteRound",{id}); state.rounds=state.rounds.filter(r=>r.id!==id); pending=pending.filter(p=>p.id!==id); LS.set("sc.pending",pending); cache(); render(); }
};
/* OB・1ペナは1ホールに何回でも記録でき、1回ごとに使ったクラブを持つ（h.obC / h.penC、クラブ未選択は null）。
   古い記録（ob:true だけ）は1回として扱う。シートの列を増やさないよう、送るときは club 列に「7I|OB:5I,7I|P:9I」の形でまとめる */
const evs = (h,k) => Array.isArray(h[k+"C"]) ? h[k+"C"] : (h[k] ? [null] : []);
function encClub(h){ let s=h.club||""; const o=evs(h,"ob"), p=evs(h,"pen");
  if(Array.isArray(h.obC)&&o.length) s+="|OB:"+o.map(c=>c||"-").join(","); if(Array.isArray(h.penC)&&p.length) s+="|P:"+p.map(c=>c||"-").join(","); return s||null; }
function decHole(h){ if(typeof h.club!=="string" || h.club.indexOf("|")<0) return h;
  const [c,...rest]=h.club.split("|"); const x={...h, club:c||null};
  rest.forEach(t=>{ const [k,v]=t.split(":"); const arr=(v||"").split(",").filter(z=>z!=="").map(z=>z==="-"?null:z); if(k==="OB") x.obC=arr; if(k==="P") x.penC=arr; });
  return x; }
const decRound = r => ({...r, holes:(r.holes||[]).map(decHole)});
const encRound = r => ({...r, holes:r.holes.map(h=>({...h, club:encClub(h)}))});
function upsert(arr, item){ const i=arr.findIndex(x=>x.id===item.id); if(i>=0) arr[i]=item; else arr.push(item); }

async function flushPending(){
  if(!hasBackend) return;
  for(const c of pendingCourses.slice()){
    try{ await api("saveCourse",{course:c}); pendingCourses=pendingCourses.filter(x=>x.id!==c.id); LS.set("sc.pendingCourses",pendingCourses); }
    catch(e){ return; }
  }
  if(!pending.length) return;
  for(const r of pending.slice()){
    try{ await api("saveRound",{round:encRound(r)}); pending=pending.filter(p=>p.id!==r.id); LS.set("sc.pending",pending); }
    catch(e){ return; }
  }
  toast("未送信だったラウンドを送りました");
}
let loading = false;
async function connect(){
  state.courses = LS.get("sc.courses", []); state.rounds = LS.get("sc.rounds", []);
  if(!hasBackend){ state.mode="local"; render(); return; }
  if(loading) return; loading = true;
  try{
    await flushPending();
    const res = await fetch(SCRIPT_URL + "?t=" + Date.now());
    const j = await res.json();
    if(!j.ok) throw new Error(j.error);
    state.courses = j.courses; state.serverVer = j.version || 1;
    // シートのプログラムが古い（v1）とクラブ・1ペナ・ティーショットが保存されないので、端末に残っている分で補う（移行までのつなぎ）
    const localById = Object.fromEntries((LS.get("sc.rounds", [])||[]).map(r=>[r.id, r]));
    state.rounds = j.rounds.map(decRound).map(r=>{ const lr=localById[r.id]; if(!lr || !lr.holes) return r;
      return {...r, holes:r.holes.map((h,i)=>{ const lh=lr.holes[i]; if(!lh) return h; const x={...h};
        ["club","tee","dir"].forEach(k=>{ if(x[k]==null && lh[k]!=null) x[k]=lh[k]; }); if(!x.pen && lh.pen) x.pen=true; return x; })}; });
    pending.forEach(r=>upsert(state.rounds, r)); pendingCourses.forEach(c=>upsert(state.courses, c));
    cache(); state.mode = "cloud";
  }catch(e){ state.mode = "offline"; pendingCourses.forEach(c=>upsert(state.courses, c)); }
  loading = false;
  render();
}
document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState==="visible") connect(); });
window.addEventListener("online", connect);

/* ---------- helpers ---------- */
let toastT;
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>t.hidden=true,2600); }
const sum = (a,f=x=>x) => a.reduce((s,x)=>s+f(x),0);
const pct = (n,d) => d ? Math.round(n/d*1000)/10 : null;
/* パットを記録していないラウンド（パットOFFで保存 → シートでは空欄＝全ホール0）は、パーオン・パット系の計算から外す */
const puttsOn = r => r.holes.some(h=>h.putts>0);
const fmtPct = v => v==null ? "—" : (v%1===0? v.toFixed(0): v.toFixed(1));
const toPar = n => n===0 ? "±0" : (n>0? "+"+n : String(n));
function roundTotals(r){ const s=sum(r.holes,h=>h.strokes), p=sum(r.holes,h=>h.par), pt=sum(r.holes,h=>h.putts); return {score:s, par:p, putts:pt, diff:s-p}; }
function players(){ return [...new Set(rounds().map(r=>r.player))].filter(Boolean).sort((a,b)=>a.localeCompare(b,"ja")); }
function rounds(){ return state.demo ? DEMO.rounds : state.rounds; }
function courses(){ return state.demo ? DEMO.courses : state.courses; }
function byDate(a,b){ return (a.date||"").localeCompare(b.date||"") || (a.createdAt||0)-(b.createdAt||0); }

/* ---------- stats ---------- */
function computeStats(rs){
  const holes = rs.flatMap(r=>r.holes.filter(h=>h.strokes>0));
  const n = holes.length;
  const ph = rs.filter(puttsOn).flatMap(r=>r.holes.filter(h=>h.strokes>0)), pn = ph.length; // パットを記録したホールだけ
  const gir = ph.filter(h=>h.strokes-h.putts <= h.par-2);
  const bon = ph.filter(h=>h.strokes-h.putts <= h.par-1);
  const missGir = ph.filter(h=>h.strokes-h.putts > h.par-2);
  const scramble = missGir.filter(h=>h.strokes<=h.par);
  const bunker = holes.filter(h=>h.bunker);
  const sandSave = bunker.filter(h=>h.strokes<=h.par);
  const ob = holes.filter(h=>h.ob);
  const pen = holes.filter(h=>h.pen);
  const teeH = holes.filter(h=>h.par>=4 && h.tee); const teeC = {fw:0,rl:0,rr:0,miss:0}; teeH.forEach(h=>{ if(teeC[h.tee]!=null) teeC[h.tee]++; });
  const putt = {0:0,1:0,2:0,3:0};
  ph.forEach(h=>{ putt[Math.min(h.putts,3)]++; });
  const dirs = {on:0,left:0,right:0,long:0,short:0,miss:0}; let dirN=0;
  holes.forEach(h=>{ if(h.dir && dirs[h.dir]!=null){ dirs[h.dir]++; dirN++; } });
  const dist = {hio:0,eagle:0,birdie:0,par:0,bogey:0,double:0,triple:0};
  holes.forEach(h=>{ const d=h.strokes-h.par; if(h.strokes===1)dist.hio++; else if(d<=-2)dist.eagle++; else if(d===-1)dist.birdie++; else if(d===0)dist.par++; else if(d===1)dist.bogey++; else if(d===2)dist.double++; else dist.triple++; });
  const tots = rs.map(roundTotals);
  const byPar = {};
  holes.forEach(h=>{ (byPar[h.par] ||= []).push(h.strokes); });
  return {
    rounds: rs.length, holes: n,
    avgScore: tots.length? sum(tots,t=>t.score)/tots.length : null,
    avgDiff: tots.length? sum(tots,t=>t.diff)/tots.length : null,
    best: tots.length? Math.min(...tots.map(t=>t.diff)) : null,
    avgPuttsRound: (()=>{ const pr=rs.filter(puttsOn); return pr.length? sum(pr.map(roundTotals),t=>t.putts)/pr.length : null; })(),
    puttsPerHole: pn? sum(ph,h=>h.putts)/pn : null, puttHoles: pn,
    puttsPerGir: gir.length? sum(gir,h=>h.putts)/gir.length : null,
    puttsPerMiss: missGir.length? sum(missGir,h=>h.putts)/missGir.length : null,
    gir: pct(gir.length,pn), bon: pct(bon.length,pn), girN: gir.length, bonN: bon.length,
    one: pct(putt[1],pn), three: pct(putt[3],pn),
    scramble: pct(scramble.length, missGir.length), scrambleN: missGir.length,
    bunkerRate: pct(bunker.length,n), sandSave: pct(sandSave.length,bunker.length), bunkerN: bunker.length,
    obRate: pct(ob.length,n), obN: ob.length,
    penRate: pct(pen.length,n), penN: pen.length,
    troubleN: holes.filter(h=>h.ob||h.pen).length,
    teeN: teeH.length, teeC, fwRate: pct(teeC.fw, teeH.length),
    parOrBetter: pct(dist.hio+dist.eagle+dist.birdie+dist.par, n),
    putt, dirs, dirN, dist, byPar
  };
}

// COURSE BEST のキラキラ（金と白の4つ角の星）。文字のない空き（大きなスコアの右〜スコアカードの上）に置き、画面ではゆっくり点滅させる。
// 画像保存では onclone でアニメーションを止めるので、同じ星がそのまま止まった絵として写る。
let starCache={}; // 画面を描き直したり、ほかの人に切りかえて戻っても星が消えないよう、ラウンドごとに覚えておく
function fillStars(){
  const card=$(".result-card"), box=card&&card.querySelector(".rc-stars"); if(!box) return;
  const key=state.result&&state.result.id; if(starCache[key]){ box.innerHTML=starCache[key]; return; }
  const cr=card.getBoundingClientRect(), rel=el=>{ const b=el.getBoundingClientRect(); return {l:(b.left-cr.left)/cr.width*100, r:(b.right-cr.left)/cr.width*100, t:(b.top-cr.top)/cr.height*100, b:(b.bottom-cr.top)/cr.height*100}; };
  const sc=card.querySelector(".rc-score span")||card.querySelector(".rc-score b"), sheet=card.querySelector(".rc-sc"), flag=card.querySelector(".rc-flag");
  const X0=(sc?rel(sc).r:55)+3, Y1=(sheet?rel(sheet).t:40)-2, fl=flag?rel(flag):null;
  const spots=[]; let tries=0; while(spots.length<14 && tries++<600){ const x=X0+Math.sqrt(Math.random())*(95-X0), y=6+Math.random()*(Y1-8);
    if(fl && x>fl.l-3 && x<fl.r+2 && y>fl.t-2 && y<fl.b+2) continue;
    if(spots.some(([px,py])=>Math.abs(px-x)<6 && Math.abs(py-y)<5)) continue; spots.push([x,y]); }
  const star=(sz,col,op)=>`<svg viewBox="0 0 24 24" width="${sz}" height="${sz}"><path d="M12 0C13 8 16 11 24 12C16 13 13 16 12 24C11 16 8 13 0 12C8 11 11 8 12 0Z" fill="${col}" fill-opacity="${op}"/></svg>`;
  box.innerHTML = spots.map(([x,y],i)=>{ const big=i<3, sz=big?22+Math.round(Math.random()*8):8+Math.round(Math.random()*9), col=i%3===2?"#FFFFFF":"#FFD76A";
    return `<i class="${big?"big":""}" style="left:${x.toFixed(1)}%;top:${y.toFixed(1)}%"><svg style="animation-delay:${(-Math.random()*2.4).toFixed(2)}s;animation-duration:${(1.6+Math.random()*1.4).toFixed(2)}s" ${star(sz,col,big?.95:(.55+Math.random()*.4).toFixed(2)).slice(5)}</i>`; }).join("");
  if(spots.length){ starCache[key]=box.innerHTML; fillStars.n=0; } else if((fillStars.n=(fillStars.n||0)+1)<6) setTimeout(fillStars,150); // 描く前で場所が測れなかったら少し待ってやり直す
}
function resultOverlay(r){

        out.push(`<table class="${two?"half":""}">${two?`<colgroup><col class="lab">${ch.map(()=>"<col>").join("")}<col class="sum"></colgroup>`:""}<tr class="h">${two?`<td class="lab">${lab}</td>`:""}${ch.map((h,j)=>`<td>${i+j+1}</td>`).join("")}${two?`<td class="sum">計</td>`:""}</tr><tr class="p">${two?`<td class="lab">PAR</td>`:""}${ch.map(h=>`<td>${h.par}</td>`).join("")}${two?`<td class="sum">${subp}</td>`:""}</tr><tr>${two?`<td class="lab"></td>`:""}${ch.map(h=>`<td>${mark(h)}</td>`).join("")}${two?`<td class="sum"><b>${sub}</b></td>`:""}</tr></table>`); } return out.join(""); })()}</div>

function heatShape(shape, heat, worst){
  const st = worst ? `fill:color-mix(in srgb,#E5484D 16%,var(--paper));stroke:#E5484D;stroke-width:2`
    : `fill:color-mix(in srgb,#E5484D ${Math.round(heat*14)}%,var(--paper));stroke:color-mix(in srgb,#E5484D ${Math.round(20+heat*45)}%,var(--line));stroke-width:1.2`;
  const base = shape.replace('class="az-bg"', `class="az-bg" style="${st}"`);
  return worst ? base + shape.replace('class="az-bg"', 'class="az-hatch" fill="url(#hatchS)" pointer-events="none"') : base;
}
const HATCH = `<pattern id="hatchS" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="2.4" height="8" fill="#E5484D" fill-opacity=".2"/></pattern>`;

  const worst = stat ? ["long","short","left","right","miss"].reduce((a,k)=>(stat.dirs[k]||0)>(stat.dirs[a]||0)?k:a,"long") : null;
  const zone = (k, shape, lx, ly, label) => {

      return `<g class="az-s">${heatShape(shape, (stat.dirs[k]||0)/maxMiss, w)}

    return `<g class="az ${sel(k)?"on-sel":""}" role="button" tabindex="0" data-act="dir" data-v="${k}" aria-pressed="${sel(k)}" aria-label="${label}">${shape}<text x="${lx}" y="${ly}" class="az-t">${label}</text></g>`; };
  const b = !stat && dir && Z[dir];
  const sx=170, sy=222;
  const cy = Math.min(sy,b?b[1]:sy) - (dir==="short"?70:dir==="long"?12:40);
  const tpath = b ? `M${sx} ${sy} Q ${(sx+(b?b[0]:0))/2} ${cy} ${b[0]} ${b[1]}` : "";
  const tracer = b ? `<g class="tr ${tap?"anim":""}">

function holeAdvice(d, i){
  const past = state.rounds.filter(r=>r.player===d.player && r.courseId===d.courseId && r.id!==d.id && r.holes[i]).sort((a,b)=>(a.date+(a.createdAt||0)).localeCompare(b.date+(b.createdAt||0)));

  const parts = [`前回 <b>${last.strokes}</b>（${TERMJ(last.strokes-last.par)}）`];
  if(hs.length>=2) parts.push(`平均 <b>${(hs.reduce((a,h)=>a+h.strokes,0)/hs.length).toFixed(1)}</b>`);
  const key = last.par>=4 ? "tee" : "dir", lab = last.par>=4 ? {rl:"左",rr:"右",miss:"ミスショット"} : {left:"左",right:"右",long:"オーバー",short:"ショート",miss:"ミスショット"};
  const cnt = {}; let n=0; hs.forEach(h=>{ if(h[key]){ n++; if(lab[h[key]]) cnt[h[key]]=(cnt[h[key]]||0)+1; } });
  const top = Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a])[0];
  if(top && cnt[top]>=2 && cnt[top]/n>=0.4) parts.push(`<em>${lab[top]}に外しやすい</em>`);
  return parts.join("・");
}

function cdNext(cd){

  if(k==="s" && pOn) k="p"; else { k="s"; i++; if(i>=P){ i=0; h++; } }

function cardKey(v){
  const cd=state.cdraft, sel=cd&&cd.sel; if(!sel) return;
  const pl=cd.players[sel.i], h=sel.h;
  if(v==="del"){ if(sel.k==="s"){ pl.s[h]=null; pl.p[h]=null; } else pl.p[h]=null; saveCDraft(); render(); return; }
  if(sel.k==="s"){

    else { const n=+v; if(n<1) return; pl.s[h]=n; }

    const n=+v; if(v==="10") return;

function cardMissing(cd){

  if(fields().putts) for(let i=0;i<cd.players.length;i++){ const p=cd.players[i].p;

/* クラブ別: パー3はティーショットのクラブごとのパーオン率、パー4・5はフェアウェイキープ率 */
function clubTable(rs, kind){
  const m = {};
  rs.forEach(r=>r.holes.forEach(h=>{ if(!h.club) return;
    if(kind==="p3" ? (h.par!==3 || !puttsOn(r)) : (h.par<4 || !h.tee)) return;
    const x = m[h.club] || (m[h.club]={n:0,ok:0,miss:{},ob:0}); x.n++; if(h.ob||h.pen) x.ob++;
    if(kind==="p3"){ if(h.strokes-h.putts<=h.par-2) x.ok++; if(h.dir && h.dir!=="on") x.miss[h.dir]=(x.miss[h.dir]||0)+1; }
    else { if(h.tee==="fw") x.ok++; else x.miss[h.tee]=(x.miss[h.tee]||0)+1; } }));
  const cl = sortClubs(Object.keys(m));
  if(!cl.length) return "";
  const ML = {left:"左",right:"右",long:"オーバー",short:"ショート",miss:"ミスショット",rl:"左",rr:"右"};
  const rate = x => x.ok/x.n*100;
  const ok = cl.filter(c=>m[c].n>=3);
  let best = ok.length>1 ? ok.reduce((a,c)=>rate(m[c])>rate(m[a])?c:a) : null, worst = ok.length>1 ? ok.reduce((a,c)=>rate(m[c])<rate(m[a])?c:a) : null;
  if(best===worst){ best=null; worst=null; }
  return `<div class="map-sub">${kind==="p3"?"パーオン率（パー3）":"フェアウェイキープ率（パー4・5）"}</div>
    <table class="cs-tbl club-tbl"><tr><th></th><th>クラブ</th><th>回数</th><th>${kind==="p3"?"パーオン率":"FWキープ率"}</th><th>多いミス</th></tr>
    ${cl.map(c=>{ const x=m[c], r=rate(x), mk=Object.keys(x.miss).sort((a,b)=>x.miss[b]-x.miss[a])[0];
      return `<tr><td class="tg">${c===best?`<span class="ctag good">得意</span>`:c===worst?`<span class="ctag bad">苦手</span>`:""}</td><td><b>${esc(c)}</b></td><td>${x.n}</td><td><span class="rt"><span class="cs-bar"><i style="width:${r}%"></i></span><span class="rv">${fmtPct(r)}%</span></span></td><td>${mk?ML[mk]:"—"}</td></tr>`; }).join("")}
    </table>`;
}
/* OB・ペナが多いクラブ: そのクラブを選んだホールのうち OB か 1ペナ があった割合のワースト3 */
function troublePanel(rs){
  // OB・1ペナはティーショットだけを記録するので、ティーショットのクラブごとに「何回中何回」が正確に出せる
  const m = {};
  rs.forEach(r=>r.holes.forEach(h=>{ if(!h.club) return; const x=m[h.club]||(m[h.club]={n:0,t:0}); x.n++; if(h.ob||h.pen) x.t++; }));
  if(!Object.keys(m).length) return "";
  const L = Object.keys(m).filter(c=>m[c].t>0).map(c=>({c, n:m[c].n, t:m[c].t, r:m[c].t/m[c].n*100}))
    .sort((a,b)=>b.r-a.r || b.t-a.t).slice(0,3);
  return `<div class="panel"><div class="sec"><em>TROUBLE</em><span>OB・ペナ率ワースト</span></div>
    ${L.length ? `<ol class="tr-rank">${L.map((x,i)=>`<li><span class="rk">${i+1}</span><b>${esc(x.c)}</b><span class="cs-bar"><i style="width:${Math.max(4,x.r)}%"></i></span><span class="tp">${fmtPct(x.r)}%</span><small>${x.n}回中${x.t}回</small></li>`).join("")}</ol>`
      : `<p class="muted" style="font-size:13px;margin:0">まだOB・1ペナの記録はありません。</p>`}</div>`;
}
function clubPanel(rs){
  const t3 = clubTable(rs,"p3"), t4 = clubTable(rs,"p4");
  if(!t3 && !t4) return `<div class="panel"><div class="sec"><em>CLUB</em><span>クラブ別</span></div><p class="muted" style="font-size:13px;margin:0">記録する項目で「使用クラブ」をONにすると、クラブごとのパーオン率・フェアウェイキープ率や得意・苦手がここに出ます。</p></div>`;
  return `<div class="panel"><div class="sec"><em>CLUB</em><span>クラブ別</span></div>${t3}${t4}
    <p class="muted cs-note">ティーショットに使ったクラブ別。得意・苦手は3回以上打ったクラブで比べています。</p></div>`;
}
/* ホール別: そのコースの各ホールの平均・パー以内の割合・多いミス */
function holePanel(rs){
  const cnt={}; rs.forEach(r=>{ cnt[r.courseId]=(cnt[r.courseId]||0)+1; });
  const cid = state.fCourse!=="all" ? state.fCourse : Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a])[0];
  const c = courses().find(x=>x.id===cid); const rr = rs.filter(r=>r.courseId===cid);
  if(!rr.length) return `<div class="panel empty"><strong>記録がありません</strong></div>`;
  const n = Math.max(...rr.map(r=>r.holes.length));
  const ML = {left:"左",right:"右",long:"オーバー",short:"ショート",miss:"ミスショット",rl:"左",rr:"右"};

    </table><p class="muted cs-note">多いミスは同じ方向に2回以上外したときに出します（パー3はグリーン、パー4以上はティーショット）。</p></div>`;

function donutPanel(title, id, segs, total, centerVal, centerLbl){

/* ドーナツ: 各部分から引き出し線でラベルを直接つける */
function donutSVG(segs, total, centerVal, centerLbl, title){
  const W=360, H=236, cx=180, cy=118, R=74, r=54, t=segs.reduce((a,x)=>a+x.n,0);
  if(!t) return `<p class="muted" style="font-size:13px">まだ記録がありません。</p>`;
  const P=(ang,rad)=>[cx+rad*Math.cos(ang), cy+rad*Math.sin(ang)];
  const gap = segs.length>1 ? .025 : 0;
  let a0=-Math.PI/2; const arcs=[], labels=[];
  segs.forEach(x=>{ const sw=x.n/t*Math.PI*2, a1=a0+sw, s0=a0+gap/2, s1=a1-gap/2, big=(s1-s0)>Math.PI?1:0, col=`var(${x.tone})`;
    if(segs.length===1) arcs.push(`<circle cx="${cx}" cy="${cy}" r="${(R+r)/2}" fill="none" stroke="${col}" stroke-width="${R-r}"/>`);
    else { const [x1,y1]=P(s0,R),[x2,y2]=P(s1,R),[x3,y3]=P(s1,r),[x4,y4]=P(s0,r);
      arcs.push(`<path d="M${x1.toFixed(2)} ${y1.toFixed(2)} A${R} ${R} 0 ${big} 1 ${x2.toFixed(2)} ${y2.toFixed(2)} L${x3.toFixed(2)} ${y3.toFixed(2)} A${r} ${r} 0 ${big} 0 ${x4.toFixed(2)} ${y4.toFixed(2)}Z" fill="${col}"/>`); }
    const m=(a0+a1)/2, [ex,ey]=P(m,R+12), [sx,sy]=P(m,R+2);
    labels.push({ x, m, sx, sy, ex, ey, y:ey, right: Math.cos(m)>=0, pct: pct(x.n,t) }); // 割合は描いた部分の合計で（パット未記録のホールが混ざってもずれない）
    a0=a1; });
  // 同じ側のラベルが重ならないように上下にずらす
  const GAP=32, TOP=18, BOT=H-14;
  [true,false].forEach(side=>{ const L=labels.filter(l=>l.right===side).sort((p,q)=>p.y-q.y);
    for(let i=0;i<L.length;i++){ L[i].y=Math.max(L[i].y, TOP, i?L[i-1].y+GAP:TOP); }
    for(let i=L.length-1;i>=0;i--){ L[i].y=Math.min(L[i].y, i<L.length-1?L[i+1].y-GAP:BOT); } });
  const lines = labels.map(l=>{ const hx = l.right ? cx+R+20 : cx-R-20, tx = l.right ? hx+4 : hx-4, an = l.right?"start":"end", col=`var(${l.x.tone})`;
    return `<g><circle cx="${l.sx.toFixed(1)}" cy="${l.sy.toFixed(1)}" r="1.8" fill="${col}"/><path d="M${l.sx.toFixed(1)} ${l.sy.toFixed(1)} L${l.ex.toFixed(1)} ${l.y.toFixed(1)} L${hx} ${l.y.toFixed(1)}" fill="none" stroke="${col}" stroke-width="1.2"/>
      <text x="${tx}" y="${(l.y-6).toFixed(1)}" text-anchor="${an}" class="dl-name">${l.x.label}</text><text x="${tx}" y="${(l.y+10).toFixed(1)}" text-anchor="${an}" class="dl-pct">${fmtPct(l.pct)}<tspan>%</tspan></text></g>`; }).join("");
  return `<svg class="dsvg" viewBox="0 0 ${W} ${H}" role="img" aria-label="${title}：${labels.map(l=>l.x.label+" "+fmtPct(l.pct)+"%").join("、")}">${arcs.join("")}${lines}
    <text x="${cx}" y="${cy+4}" class="dc-v">${String(centerVal).replace(/<small>%<\/small>/,'<tspan class="dc-u">%</tspan>')}</text><text x="${cx}" y="${cy+21}" class="dc-l">${centerLbl}</text></svg>`;
}

  const worst = miss ? ["left","right","long","short"].reduce((a,b)=>s.dirs[b]>s.dirs[a]?b:a) : null;

  const oneCourse = state.fCourse!=="all";
  const tot = rs.map(roundTotals);
  // 基準線: 横いっぱいに引く太めの線（パー・ボギー・ダボ）
  const holesN = (()=>{ const c={}; rs.forEach(r=>{ c[r.holes.length]=(c[r.holes.length]||0)+1; }); return +Object.keys(c).sort((x,y)=>c[y]-c[x])[0] || 9; })();
  const parN = oneCourse ? (courses().find(c=>c.id===state.fCourse)?.holes.reduce((a,h)=>a+h.par,0) ?? roundTotals(rs[0]).par) : 0;
  const refLines = (lines) => ({ id:"refLines", afterDatasetsDraw(chart){ const {ctx, chartArea:a, scales:{y}} = chart; ctx.save();
    lines.forEach(L=>{ const py=y.getPixelForValue(L.v); if(py<a.top-1||py>a.bottom+1) return;
      ctx.strokeStyle=L.color; ctx.lineWidth=L.w||2.5; ctx.setLineDash([]); ctx.beginPath(); ctx.moveTo(a.left,py); ctx.lineTo(a.right,py); ctx.stroke();
      ctx.font="700 12px "+cssv("--f-num"); ctx.fillStyle=L.color; ctx.textAlign="right"; ctx.textBaseline="bottom"; ctx.fillText(L.label,a.right-2,py-3); });

    { v: parN+holesN, label: oneCourse?`${parN+holesN}`:`+${holesN}`, color: cssv("--q-bogey") },
    { v: parN+2*holesN, label: oneCourse?`${parN+2*holesN}`:`+${2*holesN}`, color: cssv("--q-double") }
  ];

  // 棒の色: そのラウンドがどの基準線の内側か（パー以内=青 / ボギー以内=オレンジ / それ以上=赤）
  const scoreZone = i => { const per = tot[i].diff / rs[i].holes.length; return per<=0 ? "par" : per<=1 ? "bogey" : "double"; };
  const puttZone = i => { const per = tot[i].putts / rs[i].holes.length; return per<=2 ? "par" : per<=2.5 ? "bogey" : "double"; };

/* スキンズ: 各ホールにコイン1枚。一番少ない打数が1人だけならその人が（持ち越し分も合わせて）獲得、同点なら次のホールへ持ち越し */
function skinsCalc(rows, n, carryOn=true){
  const won=rows.map(()=>0), log=[]; let carry=0;
  for(let i=0;i<n;i++){ const v=rows.map(r=>r[i]); if(v.some(x=>x==null)) break;
    const pot=1+carry, mn=Math.min(...v), w=v.map((x,k)=>x===mn?k:-1).filter(k=>k>=0);
    if(w.length===1){ won[w[0]]+=pot; carry=0; log.push({w:w[0],pot}); } else { carry=carryOn?pot:0; log.push({w:-1,pot}); } }
  return {won, carry, log, pot:1+carry};
}
/* マッチプレー（2人）: ホールごとに少ない方の勝ち、同じなら引き分け。勝ったホール数の差で「2UP」など */
function matchCalc(rows, n, N){
  let diff=0, played=0, dec=null; const won=[0,0];
  for(let i=0;i<n;i++){ const a=rows[0][i], b=rows[1][i]; if(a==null||b==null) break; played++;
    if(a<b){ diff++; won[0]++; } else if(b<a){ diff--; won[1]++; }
    if(!dec && Math.abs(diff) > N-played) dec={up:Math.abs(diff), left:N-played}; }
  const st=k=>{ const d=k?-diff:diff; return d>0?`${d}勝`:d<0?`${-d}負`:"五分"; }; // 英語の 2UP / AS / 2DN はなじみがないので日本語で
  return {diff, won, played, dec, st};
}
/* ナッソー: 前半・後半・トータルの3つ、それぞれ打数の合計が一番少ない人が1ポイント（同点は誰にもなし）。9Hは 1〜4H／5〜9H */
function nassauCalc(rows, n, N){
  const half = Math.floor(N/2);  /* 18H→9、9H→4、12H→6。奇数は後半が1つ多い */
  const segs=[["前半",0,half],["後半",half,N],["トータル",0,N]], pts=rows.map(()=>0);
  const res=segs.map(([lab,a,b])=>{ if(n<b) return {lab,a,b,w:null,done:false};
    const t=rows.map(r=>{ let x=0; for(let i=a;i<b;i++){ if(r[i]==null) return null; x+=r[i]; } return x; });
    if(t.some(x=>x==null)) return {lab,a,b,w:null,done:false};
    const mn=Math.min(...t), w=t.map((x,k)=>x===mn?k:-1).filter(k=>k>=0); if(w.length===1) pts[w[0]]++;
    return {lab,a,b,w:w.length===1?w[0]:-1,t,done:true}; });
  return {pts, res, half};
}
/* ラスベガス（4人）: 1・2人目がチームA、3・4人目がチームB。少ない打数を十の位、多い打数を一の位にした数を比べ、差がそのまま点数 */
const vegasNum = (x,y) => { const [p,q]=[x,y].sort((a,b)=>a-b); return +(String(p)+String(q)); };
function vegasCalc(rows, n){
  const pts=[0,0], log=[];
  for(let i=0;i<n;i++){ const v=rows.map(r=>r[i]); if(v.some(x=>x==null)) break;
    const A=vegasNum(v[0],v[1]), B=vegasNum(v[2],v[3]); if(A<B) pts[0]+=B-A; else if(B<A) pts[1]+=A-B; log.push({A,B}); }
  return {pts, log};
}
/* ステーブルフォード: パー2点・ボギー1点・ダボ以上0点・バーディ3点・イーグル4点・アルバトロス5点 */
const stablePts = (s,par) => Math.max(0, 2-(s-par));
function stableCalc(rows, pars, n){ return { pts: rows.map(r=>{ let x=0; for(let i=0;i<n;i++){ if(r[i]==null) break; x+=stablePts(r[i],pars[i]); } return x; }) }; }
/* チーム戦（4人）: 1・2人目がチームA、3・4人目がチームB。ホールごとに2人のうち良い方のスコアで比べ、少ないチームが1勝（同じなら引き分け） */
/* 合計スコア: 2人の打数の合計どうしで勝負（ラウンド全体） */
function teamSumCalc(rows, n){ const tot=[0,0]; let done=0;
  for(let i=0;i<n;i++){ const v=rows.map(r=>r[i]); if(v.some(x=>x==null)) break; tot[0]+=v[0]+v[1]; tot[1]+=v[2]+v[3]; done++; }
  return {tot, done}; }
function teamCalc(rows, n){ const won=[0,0]; let tot=[0,0];
  for(let i=0;i<n;i++){ const v=rows.map(r=>r[i]); if(v.some(x=>x==null)) break; const A=Math.min(v[0],v[1]), B=Math.min(v[2],v[3]);
    tot[0]+=v[0]+v[1]; tot[1]+=v[2]+v[3]; if(A<B) won[0]++; else if(B<A) won[1]++; }
  return {won, tot}; }
/* オリンピック: パットのメダル。1鉄 2銅 3銀 4金 5ダイヤ（点数は同じ数） */
const MEDALS=[null,{n:"鉄",c:"#7A8594",d:"#4B5563"},{n:"銅",c:"#D08A4C",d:"#8A4B1E"},{n:"銀",c:"#C9D1DA",d:"#7B8794"},{n:"金",c:"#F5C23A",d:"#B07A00"},{n:"ダイヤ",c:"#7FDBFF",d:"#1C7FB0"}];
function medalSVG(v, sz=16, pos=null){ const m=MEDALS[v]; if(!m) return "";
  const g = v===5 ? `<path d="M9 2h18l7 8-16 20L2 10z" fill="${m.c}" stroke="${m.d}" stroke-width="1.6" stroke-linejoin="round"/><path d="M2 10h32M12 2l6 28 6-28" fill="none" stroke="${m.d}" stroke-width="1" opacity=".7"/>`
    : `<circle cx="18" cy="16" r="13.5" fill="${m.c}" stroke="${m.d}" stroke-width="1.8"/><circle cx="18" cy="16" r="9" fill="none" stroke="${m.d}" stroke-width="1.1" opacity=".55"/><path d="M10.5 10.5a10 10 0 0 1 6-4" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity=".55"/>`;
  return pos ? `<svg x="${pos.x}" y="${pos.y}" width="${sz}" height="${(sz*32/36).toFixed(1)}" viewBox="0 0 36 32">${g}</svg>` : `<svg class="medal" viewBox="0 0 36 32" width="${sz}" height="${(sz*32/36).toFixed(1)}" aria-hidden="true">${g}</svg>`; }
function olympicCalc(medals, P){ const pts=Array(P).fill(0), cnt=Array.from({length:P},()=>[0,0,0,0,0,0]);
  Object.values(medals||{}).forEach(arr=>(arr||[]).forEach((v,i)=>{ if(v>0 && i<P){ pts[i]+=v; cnt[i][v]++; } })); return {pts, cnt}; }
/* 新ペリア: 隠しホール（9Hは6つ・18Hは12）をラウンド後にくじで選び、ハンデ＝(隠しホールの合計×(全ホール数÷隠しホール数) − パー)×0.8。ネット＝合計−ハンデ */
function peoriaHidden(N){ const k = Math.max(1, Math.round(N*2/3));  /* ホール数の3分の2: 9H→6、12H→8、18H→12 */ const a=[...Array(N).keys()];
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a.slice(0,k).sort((x,y)=>x-y); }
function peoriaCalc(rows, pars, hidden){ const N=pars.length, par=pars.reduce((a,b)=>a+b,0), mul=N/hidden.length;
  return rows.map(r=>{ const gross=r.reduce((a,b)=>a+(b||0),0), hs=hidden.reduce((a,i)=>a+(r[i]||0),0), hc=Math.round(Math.max(0,(hs*mul-par)*0.8)*10)/10;
    return {gross, hs, hc, net:Math.round((gross-hc)*10)/10}; }); }
/* 記録中に名前の下へ出す小さな表示（スキンズは別で、コインの数） */
function gameTags(game, rows, pars, n, N, ex={}){
  if(game==="nearpin"){ const x=pinCalc(ex.pins, rows.length); return x.won.map(n=>`<span class="gtag ${n?"":"z"}">${coinSVG(11)}${n}</span>`); }
  if(game==="olympicteam" && rows.length===4){ const x=olympicCalc(ex.medals, 4), t=[x.pts[0]+x.pts[1], x.pts[2]+x.pts[3]], cur=(ex.medals||{})[ex.hole]||[]; return [0,1,2,3].map(i=>`<span class="gtag t${i>>1}">${cur[i]?medalSVG(cur[i],12):""}${"AB"[i>>1]} ${t[i>>1]}pt</span>`); }
  if(game==="olympic"){ const x=olympicCalc(ex.medals, rows.length), cur=(ex.medals||{})[ex.hole]||[]; return x.pts.map((p,i)=>`<span class="gtag ${p?"":"z"}">${cur[i]?medalSVG(cur[i],12):""}${p}pt</span>`); }
  if(game==="match" && rows.length===2){ const m=matchCalc(rows,n,N); return [0,1].map(k=>{ const t=m.st(k); return `<span class="gtag ${t.endsWith("勝")?"up":t.endsWith("負")?"dn":""}">${t}</span>`; }); }
  if(game==="teamsum" && rows.length===4){ const x=teamSumCalc(rows,n); return [0,0,1,1].map(t=>`<span class="gtag t${t}">${"AB"[t]} ${x.tot[t]}打</span>`); }
  if(game==="team" && rows.length===4){ const x=teamCalc(rows,n); return [0,0,1,1].map(t=>`<span class="gtag t${t}">${"AB"[t]} ${x.won[t]}勝</span>`); }
  if(game==="nassau"){ const x=nassauCalc(rows,n,N); return x.pts.map(p=>`<span class="gtag ${p?"":"z"}">${p}pt</span>`); }
  if(game==="vegas" && rows.length===4){ const x=vegasCalc(rows,n); return [0,0,1,1].map(t=>`<span class="gtag t${t}">${"AB"[t]} ${x.pts[t]}</span>`); }
  if(game==="stable"){ const x=stableCalc(rows,pars,n); return x.pts.map(p=>`<span class="gtag">${p}pt</span>`); }
  return null;
}
/* 4人で個人戦のゲームをしたとき、リザルトの下に「1・2人目 vs 3・4人目」のチームの合計を1行だけ添える（チーム戦のカードを別に作らない） */
function teamLine(game, rows, pars, N, names, ex={}){
  if(!GAMES[game] || GAMES[game].type!=="solo" || rows.length!==4) return "";
  let v=null, unit="", low=false, dec=0;
  if(game==="skins"){ v=skinsCalc(rows,N,!!state.resultCarry).won; unit="枚"; }
  if(game==="nearpin"){ v=pinCalc(ex.pins,4).won; unit="枚"; }
  if(game==="olympic"){ v=olympicCalc(ex.medals,4).pts; unit="pt"; }
  if(game==="stable"){ v=stableCalc(rows,pars,N).pts; unit="pt"; }
  if(game==="nassau"){ v=nassauCalc(rows,N,N).pts; unit="pt"; }
  if(game==="peoria" && ex.hidden){ v=peoriaCalc(rows,pars,ex.hidden).map(x=>x.net); low=true; dec=1; }
  if(!v) return "";
  const t=[v[0]+v[1], v[2]+v[3]].map(x=>Math.round(x*10)/10), w=t[0]===t[1]?-1:((t[0]<t[1])===low?0:1);
  const cell=k=>`<span class="${w===k?"w":""}"><small>${names[k*2]}・${names[k*2+1]}</small><b>${dec?t[k].toFixed(1):t[k]}${unit}</b></span>`;
  return `<div class="team-line"><div class="tl-h">チームで見ると<small>1・2人目 vs 3・4人目</small></div><div class="tl-row">${cell(0)}<i>vs</i>${cell(1)}</div></div>`;
}
/* みんなのリザルトに出すゲームの結果（スキンズは別） */
function gameResult(game, rows, pars, N, names, order, ex={}){
  const box=(body,note="")=>`<div class="rc-skins rc-game"><div class="rs-h"><span>${GAMES[game].eng}</span>${GAMES[game].name}${note?`<em>${note}</em>`:""}</div>${body}</div>`;
  const line=(n,v,top,extra="")=>`<div class="rs-row ${top?"top":""}"><span class="rs-n">${n}</span><span class="rs-c">${extra}</span><b>${v}</b></div>`;
  if(game==="match" && rows.length===2){ const m=matchCalc(rows,N,N);
    const txt = m.diff===0 ? "引き分け（五分）" : `${names[m.diff>0?0:1]} の勝ち（${m.dec&&m.dec.left?`残り${m.dec.left}ホールで${m.dec.up}勝ち越し`:`${Math.abs(m.diff)}勝ち越し`}）`;
    return box([0,1].map(k=>line(names[k], `${m.won[k]}H`, m.diff!==0 && (m.diff>0?0:1)===k, `<small class="rs-sub">勝ったホール</small>`)).join("")+`<div class="rs-sum">${txt}</div>`); }
  if(game==="nassau"){ const x=nassauCalc(rows,N,N), mx=Math.max(...x.pts);
    return box(x.res.map(r=>`<div class="rs-seg"><span>${r.lab}<small>${r.a+1}〜${r.b}H</small></span><b>${r.w>=0?names[r.w]:"引き分け"}</b></div>`).join("")
      + order.map(k=>line(names[k], `${x.pts[k]}pt`, mx>0&&x.pts[k]===mx)).join("")); }
  if(game==="vegas" && rows.length===4){ const x=vegasCalc(rows,N), w=x.pts[0]===x.pts[1]?-1:x.pts[0]>x.pts[1]?0:1;
    return box([0,1].map(t=>line(`チーム${"AB"[t]}`, `${x.pts[t]}点`, w===t, `<small class="rs-sub">${names[t*2]}・${names[t*2+1]}</small>`)).join("")+`<div class="rs-sum">${w<0?"引き分け":`チーム${"AB"[w]} の勝ち`}</div>`); }
  if(game==="teamsum" && rows.length===4){ const x=teamSumCalc(rows,N), w=x.tot[0]===x.tot[1]?-1:x.tot[0]<x.tot[1]?0:1;
    return box([0,1].map(t=>line(`チーム${"AB"[t]}`, `${x.tot[t]}打`, w===t, `<small class="rs-sub">${names[t*2]} ${rows[t*2].reduce((a,b)=>a+(b||0),0)}・${names[t*2+1]} ${rows[t*2+1].reduce((a,b)=>a+(b||0),0)}</small>`)).join("")+`<div class="rs-sum">${w<0?"引き分け":`チーム${"AB"[w]} の勝ち（${Math.abs(x.tot[0]-x.tot[1])}打差）`}</div>`); }
  if(game==="team" && rows.length===4){ const x=teamCalc(rows,N), w=x.won[0]===x.won[1]?-1:x.won[0]>x.won[1]?0:1;
    return box([0,1].map(t=>line(`チーム${"AB"[t]}`, `${x.won[t]}勝`, w===t, `<small class="rs-sub">${names[t*2]}・${names[t*2+1]}（2人で${x.tot[t]}打）</small>`)).join("")+`<div class="rs-sum">${w<0?"引き分け":`チーム${"AB"[w]} の勝ち`}</div>`); }
  if(game==="peoriateam" && ex.hidden && rows.length===4){ const x=peoriaCalc(rows,pars,ex.hidden), t=[0,1].map(k=>Math.round((x[k*2].net+x[k*2+1].net)*10)/10), w=t[0]===t[1]?-1:t[0]<t[1]?0:1;
    return box(`<div class="pe-hid"><span>隠しホール</span>${ex.hidden.map((h,i)=>`<i style="animation-delay:${(i*0.18).toFixed(2)}s">${h+1}</i>`).join("")}</div>`
      + [0,1].map(k=>line(`チーム${"AB"[k]}`, t[k].toFixed(1), w===k, `<small class="rs-sub">${names[k*2]} ${x[k*2].net.toFixed(1)}・${names[k*2+1]} ${x[k*2+1].net.toFixed(1)}</small>`)).join("")
      + `<div class="rs-sum">${w<0?"引き分け":`ネットの合計で チーム${"AB"[w]} の勝ち`}</div>`); }
  if(game==="nearpin"){ const x=pinCalc(ex.pins, rows.length), mx=Math.max(...x.won);
    return box([...order].sort((a,b)=>x.won[b]-x.won[a]).map(k=>line(names[k], `${x.won[k]}枚`, mx>0&&x.won[k]===mx, Array.from({length:Math.min(x.won[k],9)},()=>coinSVG(15)).join(""))).join("")); }
  if(game==="olympicteam" && rows.length===4){ const x=olympicCalc(ex.medals, 4), t=[x.pts[0]+x.pts[1], x.pts[2]+x.pts[3]], w=t[0]===t[1]?-1:t[0]>t[1]?0:1;
    return box([0,1].map(k=>line(`チーム${"AB"[k]}`, `${t[k]}pt`, w===k, `<small class="rs-sub">${names[k*2]} ${x.pts[k*2]}・${names[k*2+1]} ${x.pts[k*2+1]}</small>`)).join("")
      + `<div class="rs-sum">${w<0?"引き分け":`チーム${"AB"[w]} の勝ち`}</div>`); }
  if(game==="peoria" && ex.hidden){ const x=peoriaCalc(rows,pars,ex.hidden), ord=[...order].sort((a,b)=>x[a].net-x[b].net || x[a].gross-x[b].gross), best=x[ord[0]].net;

      <div class="pe-row pe-head"><span></span><span>合計</span><span>ハンデ</span><span>ネット</span></div>`
      + ord.map(k=>`<div class="pe-row ${x[k].net===best?"top":""}"><span class="rs-n">${names[k]}</span><span>${x[k].gross}</span><span>−${x[k].hc.toFixed(1)}</span><b>${x[k].net.toFixed(1)}</b></div>`).join("")
      + `<div class="rs-sum">ネット ${best.toFixed(1)} の ${ord.filter(k=>x[k].net===best).map(k=>names[k]).join("・")} が優勝</div>`); }
  if(game==="olympic"){ const x=olympicCalc(ex.medals, rows.length), mx=Math.max(...x.pts);
    return box([...order].sort((a,b)=>x.pts[b]-x.pts[a]).map(k=>line(names[k], `${x.pts[k]}pt`, mx>0&&x.pts[k]===mx, [5,4,3,2,1].filter(v=>x.cnt[k][v]).map(v=>`<span class="md-c">${medalSVG(v,15)}${x.cnt[k][v]>1?`×${x.cnt[k][v]}`:""}</span>`).join(""))).join("")); }
  if(game==="stable"){ const x=stableCalc(rows,pars,N), mx=Math.max(...x.pts);
    return box([...order].sort((a,b)=>x.pts[b]-x.pts[a]).map(k=>line(names[k], `${x.pts[k]}pt`, x.pts[k]===mx)).join("")); }
  return "";
}
const CHECK = `<svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path d="M5.5 12.5l4.2 4.2L18.5 7.8" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>`;

/* オリンピックのメダル入力（ホールごと。1つのメダルは1人だけ。もう一度押すと外れる） */
/* ニアピン: ホールごとに、グリーンに乗った人で一番ピンに近い1人がコイン1枚（誰も乗らなければなし）。pins={ホール番号:人の番号} */

function pinCalc(pins, P){ const won=Array(P).fill(0); Object.values(pins||{}).forEach(i=>{ if(i!=null && i>=0 && i<P) won[i]++; }); return {won}; }

/* ルールのポップアップ（× で戻る）。スキンズだけ、同点のときの持ち越しもここで選ぶ */

/* ---------- actions ---------- */
function saveDraft(){ if(state.draft) state.draft.cur=state.hole; LS.set("sc.draft", state.draft); } // 今のホールも覚えておく（自動更新で読み直しても同じホールから）
document.addEventListener("click", async ev => {
  const b = ev.target.closest("[data-act], nav.tabs button, [data-stop], label.fs-row");

  const a=b.dataset.act, d=state.draft, h=d && d.holes[state.hole];

    case "goto-record": state.tab="record"; render(); break;
    case "save-card": {
      const card=$(".result-card"); if(!card || !window.html2canvas){ toast("画像を作れませんでした"); break; }
      b.disabled=true; b.textContent="作成中…";
