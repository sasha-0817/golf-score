<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="スコアカード">
<meta name="theme-color" content="#F1F4F3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#070C0A" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" sizes="180x180" href="icon.png?v=5">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;-webkit-text-size-adjust:100%}img{max-width:100%}[hidden]{display:none!important}button{-webkit-tap-highlight-color:transparent}
/* v15: record steppers, gear, fairway map, club picker */
.rec2 .rec-top .gear-btn{margin-left:auto}
.icon-btn svg.gear{width:20px;height:20px;stroke-width:1.6}
.rec2 .dots button{font-size:12px;letter-spacing:.02em}
.stp-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stp-row.one{grid-template-columns:1fr}
.stp{border:1px solid var(--rec-line);border-radius:14px;background:var(--rec-bg);padding:7px 7px 8px;min-width:0}
.stp-h{display:flex;justify-content:space-between;align-items:center;margin:0 2px 4px;min-height:16px}
.stp-h .hint{font-size:10px}
.stp-h .eyebrow b,.ap-wrap .eyebrow b{margin-left:6px}
.stp-b{display:grid;grid-template-columns:42px 1fr 42px;align-items:center;gap:4px}
.stp-b button{height:54px;border-radius:12px;border:1px solid var(--rec-line);background:var(--rec-surface);color:var(--rec-fg);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;transition:transform .08s}
.stp-b button:active{transform:scale(.92)}
.stp-b button:disabled{opacity:.3;cursor:default}
.stp-b button svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.stp-v{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0}
.stp-v b{font-family:var(--f-num);font-size:40px;font-weight:700;line-height:.9}
.stp-v.pop b{animation:pop .2s ease-out}
.stp-v .tm{font-size:9px;font-weight:700;letter-spacing:.08em;padding:2px 7px;border-radius:999px;color:#fff;white-space:nowrap}
.tm.t-hio{background:var(--q-hio);color:#3A2600}.tm.t-eagle{background:var(--q-eagle)}.tm.t-birdie,.tm.p-birdie{background:var(--q-birdie)}
.tm.t-par,.tm.p-par{background:var(--q-par)}.tm.t-bogey,.tm.p-bogey{background:var(--q-bogey)}.tm.t-double,.tm.p-double{background:var(--q-double)}.tm.t-triple{background:var(--q-triple)}
.ap-wrap .seg-head{display:flex;justify-content:space-between;align-items:center}
.club-tag{height:26px;padding:0 12px;border-radius:999px;border:1px dashed var(--rec-line);background:transparent;color:var(--rec-muted);font:700 12px var(--f-body);cursor:pointer}
.club-tag.has{border:1px solid #F2B01E;background:color-mix(in srgb,#F2B01E 22%,var(--rec-surface));color:var(--rec-fg);font-family:var(--f-num);font-size:14px}
.fw-rough .az-bg{fill:color-mix(in srgb,var(--rec-turf) 12%,var(--rec-surface));stroke:none}
.rc2:not(:has(.ap-wrap)) .stp-b{grid-template-columns:40px 1fr 40px}
.rc2:not(:has(.ap-wrap)) .stp-b button{height:76px}
.rc2:not(:has(.ap-wrap)) .stp-v b{font-size:50px}
.rc2:not(:has(.ap-wrap)) .trouble button{height:64px;font-size:16px}
.az-s.fw-rough .az-bg{stroke:var(--line)}
.tree{pointer-events:none}
.fairway .az-green .on-t{font-size:12px}
.club-back{background:rgba(0,0,0,.5);align-items:center;padding:16px}
.club-sheet{border-radius:20px;border:1px solid var(--rec-line);padding:18px 16px 16px;animation:rise .22s ease-out;max-width:420px}
.club-sheet p{display:flex;justify-content:space-between;align-items:baseline;font-size:16px}
.club-sheet p small{font-size:12px;color:var(--rec-muted);font-weight:700}
.club-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.club-grid button{height:52px;font-family:var(--f-num);font-size:19px}
.club-grid button[aria-pressed="true"]{background:#F2B01E;border-color:#F2B01E;color:#2A1B00}
@media (max-height:700px){.stp-b button{height:48px}.stp-v b{font-size:36px}}

/* v16: donut labels, fairway look, club settings */
.dsvg{width:100%;height:auto;display:block;max-width:420px;margin:0 auto}
.dl-name{font:700 11px var(--f-body);fill:var(--muted)}
.dl-pct{font:700 17px var(--f-num);fill:var(--fg)}
.dl-pct tspan{font-size:11px;fill:var(--muted)}
.dc-v{font:700 30px var(--f-num);fill:var(--fg);text-anchor:middle}
.dc-v .dc-u{font-size:12px;fill:var(--muted)}
.dc-l{font:700 10px var(--f-body);fill:var(--muted);text-anchor:middle;letter-spacing:.04em}
.fairway .on-p{paint-order:stroke;stroke:rgba(8,60,30,.45);stroke-width:3px}
.club-foot{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fs-link{display:flex;justify-content:space-between;align-items:center;padding:0 14px!important;margin-top:4px}
.fs-link small{color:var(--rec-muted);font-weight:700}
.clubs-sheet{max-height:88vh;overflow:auto}
.clubs-sheet p{display:flex;justify-content:space-between;align-items:baseline}
.clubs-sheet p small{font-size:12px;color:var(--rec-muted)}
.cl-list{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.cl-row{display:flex;align-items:center;border:1px solid var(--rec-line);border-radius:12px;background:var(--rec-bg);overflow:hidden}
.cl-row input{flex:1;min-width:0;border:0;background:transparent;color:var(--rec-fg);font:700 17px var(--f-num);padding:0 12px;height:42px;border-radius:0}
.cl-row input:focus{outline:none;background:color-mix(in srgb,#F2B01E 14%,transparent)}
.sheet .cl-row button{height:42px;width:40px;border:0;border-left:1px solid var(--rec-line);border-radius:0;background:transparent;color:var(--rec-muted);font-size:16px;flex:0 0 40px}
.sheet .cl-blank{height:44px;border-style:dashed;color:var(--rec-muted);font-size:13px}
.cl-sug>span{display:block;font-size:11px;font-weight:700;color:var(--rec-muted);margin:4px 0 6px}
.cl-sug>div{display:flex;flex-wrap:wrap;gap:6px}
.sheet .cl-sug button{height:34px;padding:0 11px;border-radius:999px;font:700 14px var(--f-num)}
.cl-tools{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sheet .cl-tools button{height:40px;font-size:12px;color:var(--rec-muted)}
.sheet .cl-done{background:var(--rec-fg);color:var(--rec-bg);border-color:var(--rec-fg)}

/* v17: two greens */
.two-g{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;margin:4px 0 10px;cursor:pointer}
.two-g input{width:18px;height:18px;accent-color:var(--turf)}
.gnames{margin-bottom:10px}
.par-cell input+input{margin-top:2px}
.yd-sw{display:inline-flex;align-items:center;gap:5px;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.12);color:inherit;border-radius:999px;padding:3px 9px;font:inherit;font-family:var(--f-num);font-size:12px;cursor:pointer;opacity:1!important}
.yd-sw svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* v18: course picker, simple fairway */
.cp-list{display:flex;flex-direction:column;gap:6px}
.cp-card{display:grid;grid-template-columns:16px 1fr;column-gap:6px;text-align:left;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--fg);font:inherit;cursor:pointer}
.cp-card b{font-size:15px}.cp-card small{grid-column:2;font-size:12px;color:var(--muted)}
.cp-card .cp-star{color:#E0A100;font-size:13px;line-height:20px}
.cp-card.on{border:2px solid var(--turf);background:color-mix(in srgb,var(--turf) 10%,var(--bg));padding:9px 11px}
.cp-more{margin-top:6px;width:100%}
.cp-sheet{max-height:86vh;overflow:auto}
.cp-sheet select{width:100%;height:46px;border-radius:12px}
.cp-rows{display:flex;flex-direction:column;border-top:1px solid var(--rec-line)}
.cp-row{display:flex;align-items:center;border-bottom:1px solid var(--rec-line)}
.cp-row.on .cp-main b{color:var(--turf)}
.sheet .cp-fav{flex:0 0 48px;height:56px;border:0;background:transparent;font-size:22px;color:#E0A100;border-radius:0}
.sheet .cp-main{flex:1;height:auto;min-height:56px;border:0;background:transparent;text-align:left;display:flex;flex-direction:column;justify-content:center;gap:2px;padding:6px 4px;border-radius:0}
.cp-main b{font-size:15px}.cp-main small{font-size:12px;color:var(--rec-muted);font-weight:500}
.fairway .on-t{fill:#fff}

/* v19: one course list */
.pref-sel{width:100%;height:46px;border-radius:12px;margin:2px 0 8px}
.panel .cp-rows{border-top:1px solid var(--line)}
.panel .cp-row{border-bottom:1px solid var(--line)}
.cp-fav{flex:0 0 46px;height:58px;border:0;background:transparent;font-size:22px;color:#E0A100;cursor:pointer;padding:0}
.cp-main{flex:1;min-height:58px;border:0;background:transparent;text-align:left;display:flex;flex-direction:column;justify-content:center;gap:2px;padding:6px 4px;color:inherit;font:inherit;cursor:pointer}
.panel .cp-main small{color:var(--muted)}
.cp-go{color:var(--muted);font-size:22px;padding:0 6px 0 2px}
.link-del{display:block;margin:14px auto 0;background:none;border:0;color:var(--q-double);font:inherit;font-size:13px;text-decoration:underline;cursor:pointer}

.add-course{width:100%;margin-top:12px;border-style:dashed}
.btn.cp-empty{height:52px;border-style:dashed;font-size:15px;margin-top:0}

/* v20: start form, club columns */
.start-row{flex-wrap:nowrap}
.start-row .field{min-width:0}
select.ph{color:var(--muted)}
.cl-cols{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cl-col{border:1px solid var(--rec-line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.cl-h{font-size:11px;font-weight:700;color:var(--rec-muted);padding:8px 10px;border-bottom:1px solid var(--rec-line);background:var(--rec-bg)}
.cl-scroll{display:flex;flex-direction:column;max-height:min(46vh,380px);overflow:auto}
.sheet .cl-in,.sheet .cl-cand{height:38px;border:0;border-bottom:1px solid var(--rec-line);border-radius:0;background:transparent;display:flex;align-items:center;justify-content:space-between;padding:0 12px;font:700 16px var(--f-num);flex:0 0 auto}
.sheet .cl-in{color:var(--rec-fg)}
.sheet .cl-cand{color:var(--rec-muted);justify-content:flex-start;gap:10px}
.cl-in span,.cl-cand span{font-size:13px;color:var(--rec-muted)}
.sheet .cl-cand[aria-disabled="true"]{opacity:.45}
.cl-custom{display:flex;gap:6px}
.cl-custom input{flex:1;min-width:0;height:42px;border-radius:12px;font-size:14px}
.sheet .cl-custom button{height:42px;padding:0 16px}
.cl-tools .cl-done{color:var(--rec-bg)!important}

/* v21 */
.cp-field{width:100%;min-height:58px;display:flex;align-items:center;justify-content:space-between;gap:10px;text-align:left;padding:8px 14px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--fg);font:inherit;cursor:pointer}
.cp-field span{display:flex;flex-direction:column;gap:2px}
.cp-field b{font-size:16px}.cp-field small{font-size:12px;color:var(--muted)}
.cp-field i{font-style:normal;font-size:24px;color:var(--muted)}
.cp-field.ph{border:2px dashed var(--turf);color:var(--turf);font-weight:700}
.cp-sub{font-size:12px;font-weight:700;color:var(--rec-muted);margin:6px 0 -2px}
.cp-check{color:var(--turf);font-size:20px;font-weight:700;padding:0 10px}
.cl-col{border:0;overflow:visible;gap:6px}
.cl-h{border:0;background:none;padding:0 2px 2px}
.cl-scroll{gap:6px;padding:2px}
.sheet .cl-in,.sheet .cl-cand{height:40px;border-radius:10px;justify-content:center;padding:0 10px;font:700 16px var(--f-num)}
.sheet .cl-in{background:var(--rec-fg);color:var(--rec-bg);border:1px solid var(--rec-fg)}
.sheet .cl-cand{background:var(--rec-bg);color:var(--rec-fg);border:1px solid var(--rec-line)}
.sheet .cl-in:active,.sheet .cl-cand:active{transform:scale(.96)}

/* v22: grouped clubs, favorite-only course pick */
.clubs-sheet p small.full{color:var(--q-bogey)}
.cg{display:flex;flex-direction:column;gap:10px}
.cg-row{display:grid;grid-template-columns:84px 1fr;gap:8px;align-items:start}
.cg-h{font-size:11.5px;white-space:nowrap;letter-spacing:-.02em;font-weight:700;color:var(--rec-muted);padding-top:9px}
.cg-chips{display:flex;flex-wrap:wrap;gap:6px}
.sheet .cg-chip{height:36px;min-width:46px;padding:0 9px;border-radius:10px;border:1px solid var(--rec-line);background:var(--rec-bg);color:var(--rec-fg);font:700 15px var(--f-num)}
.sheet .cg-chip.on{background:var(--rec-fg);color:var(--rec-bg);border-color:var(--rec-fg)}
.sheet .cg-chip[aria-disabled="true"]{opacity:.4}
.cg .cl-custom{display:inline-flex;gap:4px}
.cg .cl-custom input{width:72px;height:36px;border-radius:10px;font-size:13px;padding:0 8px}
.sheet .cg .cl-custom button{height:36px;width:36px;padding:0;border-radius:10px;font-size:18px}
.sheet .cp-new{height:44px;font-size:13px;border-style:dashed;color:var(--rec-muted)}
@media (max-height:700px){.cg{gap:7px}.sheet .cg-chip{height:34px}}

/* v23 */
.cg-row.cont{margin-top:-4px}
.cp-favs{display:flex;flex-direction:column;gap:8px}
.sheet .cp-fcard{height:auto;min-height:62px;display:flex;align-items:center;gap:10px;text-align:left;padding:8px 14px;border:1px solid var(--rec-line);border-radius:14px;background:var(--rec-surface);box-shadow:0 2px 8px -4px rgba(0,0,0,.18)}
.sheet .cp-fcard.on{border:2px solid var(--turf);background:color-mix(in srgb,var(--turf) 9%,var(--rec-surface));padding:7px 13px}
.cp-fstar{color:#E0A100;font-size:18px}
.cp-ftxt{flex:1;display:flex;flex-direction:column;gap:2px}
.cp-ftxt b{font-size:16px}.cp-ftxt small{font-size:12px;color:var(--rec-muted);font-weight:500}
.cp-radio{width:22px;height:22px;border-radius:50%;border:2px solid var(--rec-line);flex:0 0 22px}
.cp-fcard.on .cp-radio{border:7px solid var(--turf)}
.cp-addbox{background:var(--rec-bg);border:1px dashed var(--rec-line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px}
.cp-addh{font-size:13px;font-weight:700;color:var(--rec-muted)}
.cp-addbox select{background:var(--rec-surface)}
.cp-addlist{display:flex;flex-direction:column}
.cp-arow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 2px;border-bottom:1px solid var(--rec-line)}
.cp-arow span{display:flex;flex-direction:column;gap:2px;min-width:0}
.cp-arow b{font-size:14px}.cp-arow small{font-size:11.5px;color:var(--rec-muted)}
.sheet .cp-arow button{height:34px;padding:0 14px;border-radius:999px;font-size:13px;background:var(--turf);border-color:var(--turf);color:#fff;flex:0 0 auto}

/* v24: club rows as 7-column grid, label above */
.cg{gap:8px}
.cg-row,.cg-row.cont{display:block;margin:0}
.cg-h{padding:0 0 3px;font-size:11px;white-space:nowrap}
.cg-chips{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.sheet .cg-chip{min-width:0;padding:0;height:36px;font-size:14px}
.cg .cl-custom{grid-column:span 3;display:flex}
.cg .cl-custom input{flex:1;width:auto;min-width:0}

.cg .cl-custom2{display:flex;gap:6px}
.cg .cl-custom2 input{flex:1;height:38px;border-radius:10px;font-size:13px;padding:0 10px}
.sheet .cg .cl-custom2 button{height:38px;width:auto;padding:0 16px;font-size:14px;border-radius:10px}

.cg{gap:6px}.sheet .cg-chip{height:34px}.clubs-sheet{gap:8px}.cg-h{padding-bottom:2px}

/* v25 */
.gsw{display:inline-flex;border:1px solid rgba(255,255,255,.4);border-radius:999px;overflow:hidden;margin:1px 0}
.gsw button{border:0;background:transparent;color:inherit;font:700 11px var(--f-num);letter-spacing:.06em;padding:3px 10px;opacity:.7;cursor:pointer}
.gsw button[aria-pressed="true"]{background:#fff;color:#0B5F3F;opacity:1}
.fs-row.has-sub{border-bottom:0;padding-bottom:4px}
.sheet .fs-sub{height:40px;display:flex;justify-content:space-between;align-items:center;padding:0 12px;margin:0 0 6px;font-size:13px;color:var(--rec-fg);background:var(--rec-bg);border-radius:10px}
.fs-sub small{color:var(--rec-muted);font-weight:700}

.hc2 .live b small{font-size:13px;margin-left:2px;opacity:.85;font-weight:600}
</style>
<title>ショートコース スコアカード</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=Barlow+Condensed:wght@500;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
/* Layout: a paper scorecard — sticky tab strip, one column of ruled panels, numbers set in condensed figures */
:root{
  --bg:#F1F4F3; --paper:#FFFFFF; --fg:#0B1310; --muted:#66746D; --line:#E0E6E3; --soft:#EEF2F0;
  --turf:#0E9F62; --turf-ink:#FFFFFF; --flag:#F2B01E; --accent2:#13A9C2;
  --under:#E5484D; --over:#3E63DD; --warn:#F08C1A;
  --c1:#0E9F62; --c2:#F2B01E; --c3:#3E63DD; --c4:#E5484D; --c5:#8B5CF6; --c6:#13A9C2;
  --q-hio:#F5B700; --q-eagle:#1E3A8A; --q-birdie:#2563EB; --q-par:#4F9BEA; --q-bogey:#F28C28; --q-double:#E5484D; --q-triple:#9F1D2A; --q-neutral:#C3CDD5;
  --rec-bg:#EEF2F0; --rec-surface:#FFFFFF; --rec-raise:#EEF3F0; --rec-line:#DDE5E1; --rec-fg:#0B1310; --rec-muted:#6E7C75;
  --rec-sel:#0B1310; --rec-sel-ink:#FFFFFF; --rec-turf:#0E9F62; --rec-turf-hi:#2FD58C; --rec-under:#E5484D; --rec-over:#3E63DD; --rec-warn:#F08C1A; --rec-fade:rgba(238,242,240,0);
  --glow:rgba(14,159,98,.18); --shadow:0 1px 2px rgba(11,19,16,.04),0 8px 24px rgba(11,19,16,.06);
  --f-body:"Zen Kaku Gothic New",system-ui,"Hiragino Sans","Yu Gothic",sans-serif;
  --f-num:"Barlow Condensed","Zen Kaku Gothic New",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#070C0A; --paper:#0F1714; --fg:#ECF4EF; --muted:#8B9A92; --line:#1F2C26; --soft:#16211C;
  --turf:#2EE59D; --turf-ink:#03130B; --flag:#FFC53D; --accent2:#3BD3EA; --under:#FF6B6B; --over:#7AA2FF; --warn:#FFA94D;
  --c1:#2EE59D; --c2:#FFC53D; --c3:#7AA2FF; --c4:#FF6B6B; --c5:#B59CFF; --c6:#3BD3EA;
  --q-hio:#FFC53D; --q-eagle:#3B5BDB; --q-birdie:#4C8DFF; --q-par:#6FB1F5; --q-bogey:#FFA94D; --q-double:#FF5A5F; --q-triple:#C2323F; --q-neutral:#4A5965;
  --rec-bg:#070C0A; --rec-surface:#0F1714; --rec-raise:#17221D; --rec-line:#22312A; --rec-fg:#ECF4EF; --rec-muted:#8B9A92;
  --rec-sel:#ECF4EF; --rec-sel-ink:#070C0A; --rec-turf:#17B877; --rec-turf-hi:#2EE59D; --rec-under:#FF6B6B; --rec-over:#7AA2FF; --rec-warn:#FFA94D; --rec-fade:rgba(7,12,10,0);
  --glow:rgba(46,229,157,.22); --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#070C0A; --paper:#0F1714; --fg:#ECF4EF; --muted:#8B9A92; --line:#1F2C26; --soft:#16211C;
  --turf:#2EE59D; --turf-ink:#03130B; --flag:#FFC53D; --accent2:#3BD3EA; --under:#FF6B6B; --over:#7AA2FF; --warn:#FFA94D;
  --c1:#2EE59D; --c2:#FFC53D; --c3:#7AA2FF; --c4:#FF6B6B; --c5:#B59CFF; --c6:#3BD3EA;
  --q-hio:#FFC53D; --q-eagle:#3B5BDB; --q-birdie:#4C8DFF; --q-par:#6FB1F5; --q-bogey:#FFA94D; --q-double:#FF5A5F; --q-triple:#C2323F; --q-neutral:#4A5965;
  --rec-bg:#070C0A; --rec-surface:#0F1714; --rec-raise:#17221D; --rec-line:#22312A; --rec-fg:#ECF4EF; --rec-muted:#8B9A92;
  --rec-sel:#ECF4EF; --rec-sel-ink:#070C0A; --rec-turf:#17B877; --rec-turf-hi:#2EE59D; --rec-under:#FF6B6B; --rec-over:#7AA2FF; --rec-warn:#FFA94D; --rec-fade:rgba(7,12,10,0);
  --glow:rgba(46,229,157,.22); --shadow:none; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.6}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(96px + env(safe-area-inset-bottom,0px))}
header.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:14px 4px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand img{width:44px;height:44px;flex:0 0 44px;object-fit:contain}
.brand .wm{display:flex;flex-direction:column;line-height:1}
.brand .wm b{font-family:var(--f-num);font-size:26px;font-weight:700;letter-spacing:.04em}
.brand .wm small{font-size:8.5px;font-weight:700;letter-spacing:.24em;color:var(--muted);margin-top:3px;white-space:nowrap}
.sync{font-size:11px;color:var(--muted);background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:5px 10px;white-space:nowrap;flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis}
.sync b{color:var(--turf);font-weight:700}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--paper);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding:4px max(8px,env(safe-area-inset-right,0px)) calc(4px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
nav.tabs button{font:inherit;font-weight:700;font-size:11px;background:none;border:0;color:var(--muted);padding:6px 0 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;letter-spacing:.04em}
nav.tabs svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-selected="true"]{color:var(--turf)}
nav.tabs button[aria-selected="true"] svg{stroke-width:2.3}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--flag);outline-offset:2px}
body.recording{background:var(--rec-bg);color:var(--rec-fg)}
body.recording nav.tabs,body.recording header.top{display:none}
section.view{display:flex;flex-direction:column;gap:14px;padding-top:12px}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:var(--shadow)}
h2{font-size:17px;margin:0;font-weight:900;text-wrap:balance}
h3{font-size:13px;margin:0 0 10px;font-weight:700;color:var(--muted);letter-spacing:.06em}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
.field{display:flex;flex-direction:column;gap:4px;flex:1 1 160px;min-width:0}
.field label{font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.04em}
input,select{font:inherit;font-size:16px;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%;min-width:0}
.btn{font:inherit;font-weight:700;font-size:15px;border-radius:10px;padding:11px 16px;cursor:pointer;border:1px solid var(--line);background:var(--paper);color:var(--fg)}
.btn.primary{background:linear-gradient(120deg,var(--turf),var(--accent2));color:var(--turf-ink);border-color:transparent}
.btn.danger{color:var(--under);border-color:var(--under);background:transparent}
.btn.small{font-size:13px;padding:6px 10px;border-radius:8px}
.btn:disabled{opacity:.45;cursor:default}
.muted{color:var(--muted)}
.empty{text-align:center;padding:28px 12px;color:var(--muted)}
.empty strong{display:block;color:var(--fg);font-size:16px;margin-bottom:4px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}

/* record screen: a launch-monitor style input — gradient hole card, colour-coded score cells */
.rec{display:flex;flex-direction:column;gap:12px;padding-top:10px;padding-bottom:calc(92px + env(safe-area-inset-bottom,0px));color:var(--rec-fg)}
.rec-top{display:flex;align-items:center;gap:10px}
.icon-btn{width:38px;height:38px;flex:0 0 38px;border-radius:50%;border:1px solid var(--rec-line);background:var(--rec-surface);color:var(--rec-fg);display:flex;align-items:center;justify-content:center;cursor:pointer}
.icon-btn svg{width:18px;height:18px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round}
.rec-who{flex:1;min-width:0;line-height:1.25}
.rec-who b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rec-who span{font-size:11px;color:var(--rec-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.rec-total{text-align:right;line-height:1}
.rec-total .num{font-size:30px;font-weight:700}
.rec-total small{display:block;font-size:11px;color:var(--rec-muted);margin-top:3px}
.dots{display:flex;gap:4px}
.dots button{flex:1 1 0;min-width:0;height:34px;border:1px solid var(--rec-line);border-radius:8px;background:var(--rec-surface);color:var(--rec-muted);font-family:var(--f-num);font-size:14px;font-weight:700;cursor:pointer;padding:0;line-height:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.dots button small{font-size:8px;font-weight:600;opacity:.75;letter-spacing:.04em}
.dots button.r-under{background:color-mix(in srgb,var(--rec-under) 14%,var(--rec-surface));color:var(--rec-under);border-color:transparent}
.dots button.r-par{background:color-mix(in srgb,var(--rec-turf) 14%,var(--rec-surface));color:var(--rec-turf);border-color:transparent}
.dots button.r-bogey{background:color-mix(in srgb,var(--rec-over) 14%,var(--rec-surface));color:var(--rec-over);border-color:transparent}
.dots button.r-worse{background:var(--rec-fg);color:var(--rec-bg);border-color:transparent}
.dots button.cur{outline:2px solid var(--rec-fg);outline-offset:1px}
.dots.two{flex-wrap:wrap}.dots.two button{flex:0 0 calc((100% - 32px)/9)}
.hole-card{position:relative;overflow:hidden;border-radius:24px;padding:16px 18px 14px;color:#fff;background:linear-gradient(135deg,#08261C 0%,#0B6B44 55%,#0E8FA0 100%);box-shadow:0 12px 28px -14px rgba(8,38,28,.7)}
.hole-card::before{content:"";position:absolute;right:-70px;top:-60px;width:260px;height:220px;border-radius:50%;background:repeating-radial-gradient(ellipse at center,rgba(255,255,255,.13) 0 1px,transparent 1px 14px);pointer-events:none}
.hole-card .row1{display:flex;justify-content:space-between;align-items:flex-end;position:relative}
.hole-card .lbl{font-size:10px;font-weight:700;letter-spacing:.22em;opacity:.7}
.hole-card .hno{font-family:var(--f-num);font-size:84px;font-weight:700;line-height:.82;letter-spacing:-.02em}
.hole-card .hno small{font-size:20px;opacity:.6;font-weight:600;margin-left:4px;letter-spacing:0}
.hole-card .meta{text-align:right;display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.hole-card .par{font-family:var(--f-num);font-size:34px;font-weight:700;line-height:1}
.hole-card .par span{font-size:13px;opacity:.7;margin-right:4px;letter-spacing:.12em}
.hole-card .yd{font-family:var(--f-num);font-size:14px;opacity:.75}
.badge{display:inline-flex;align-items:center;gap:6px;margin-top:12px;position:relative;font-size:12px;font-weight:900;letter-spacing:.14em;padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.14);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.badge i{width:8px;height:8px;border-radius:50%;background:currentColor}
.badge.b-under{color:#FFB3AD}.badge.b-par{color:#9DF5C9}.badge.b-bogey{color:#B9CCFF}.badge.b-worse{color:#fff}
.badge.hio{background:linear-gradient(120deg,#F2B01E,#FFD76A);color:#3A2600}
.rec-card{background:var(--rec-surface);border:1px solid var(--rec-line);border-radius:24px;padding:14px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow);touch-action:pan-y}
.slide-l{animation:slideL .22s ease-out}.slide-r{animation:slideR .22s ease-out}
@keyframes slideL{from{opacity:.2;transform:translateX(28px)}to{opacity:1;transform:none}}
@keyframes slideR{from{opacity:.2;transform:translateX(-28px)}to{opacity:1;transform:none}}
.eyebrow{display:block;font-size:10px;font-weight:700;letter-spacing:.2em;color:var(--rec-muted)}
.seg-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:7px}
.seg-head .eyebrow{font-size:11px}
.seg-head .eyebrow b{font-family:var(--f-body);letter-spacing:.04em;margin-left:6px;color:var(--rec-fg);font-size:11px}
.seg-head .hint{font-size:11px;color:var(--rec-turf);font-weight:700}
.seg{display:grid;gap:5px}
.seg.s8{grid-template-columns:repeat(8,1fr)}
.seg.s6{grid-template-columns:repeat(6,1fr)}
.seg button{height:54px;border-radius:12px;border:1px solid var(--rec-line);background:var(--rec-bg);color:var(--rec-fg);font-family:var(--f-num);font-size:23px;font-weight:700;cursor:pointer;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;line-height:1;transition:transform .08s}
.seg button small{font-family:var(--f-body);font-size:7.5px;letter-spacing:.06em;color:var(--rec-muted);font-weight:700}
.seg.s6 button{height:46px}
.seg button:active{transform:scale(.93)}
.seg button[aria-pressed="true"]{color:#fff;border-color:transparent;box-shadow:0 8px 16px -8px var(--sel)}
.seg button[aria-pressed="true"] small{color:rgba(255,255,255,.85)}
.seg button.t-under{--sel:var(--rec-under)}.seg button.t-par{--sel:var(--rec-turf)}.seg button.t-bogey{--sel:var(--rec-over)}.seg button.t-worse{--sel:#2B3530}
.seg button[aria-pressed="true"]{background:var(--sel)}
.greenpad{position:relative;height:172px}
.greenpad .rough{position:absolute;inset:0;border-radius:18px;background:var(--rec-raise);background-image:radial-gradient(circle,var(--rec-line) 1px,transparent 1.2px);background-size:12px 12px}
.greenpad button{position:absolute;font:inherit;font-weight:700;font-size:13px;border:1px solid var(--rec-line);background:var(--rec-surface);color:var(--rec-fg);border-radius:999px;cursor:pointer;padding:0;transition:transform .08s;display:flex;align-items:center;justify-content:center;gap:4px}
.greenpad button svg{width:12px;height:12px;stroke:currentColor;stroke-width:2.4;fill:none;stroke-linecap:round;stroke-linejoin:round}
.greenpad button:active{transform:scale(.95)}
.gp-on{left:26%;right:26%;top:24%;bottom:24%;border-radius:50%!important;border:0!important;color:#fff!important;flex-direction:column;gap:2px!important;background:repeating-radial-gradient(ellipse at 52% 46%,rgba(255,255,255,.10) 0 1px,transparent 1px 9px),radial-gradient(ellipse at 45% 40%,#4BE3A3,#0E9F62 75%)!important;box-shadow:0 0 0 7px color-mix(in srgb,var(--rec-turf) 22%,transparent),0 0 0 14px color-mix(in srgb,var(--rec-turf) 8%,transparent)}
.gp-on svg{width:14px!important;height:18px!important;stroke:none!important}
.gp-long{left:33%;right:33%;top:4px;height:34px}
.gp-short{left:33%;right:33%;bottom:4px;height:34px}
.gp-left{left:4px;width:19%;top:calc(50% - 17px);height:34px}
.gp-right{right:4px;width:19%;top:calc(50% - 17px);height:34px}
.greenpad button[aria-pressed="true"]{background:var(--rec-fg);border-color:var(--rec-fg);color:var(--rec-bg)}
.greenpad .gp-on[aria-pressed="true"]{box-shadow:0 0 0 4px var(--rec-fg),0 0 0 12px color-mix(in srgb,var(--rec-turf) 18%,transparent)}
.ball{position:absolute;width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#d9dedb);box-shadow:0 2px 4px rgba(0,0,0,.35);pointer-events:none;z-index:2;transition:all .2s}
.trouble{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.trouble button{height:44px;border-radius:12px;border:1px dashed var(--rec-line);background:transparent;color:var(--rec-muted);font:inherit;font-weight:700;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
.trouble button svg{width:18px;height:18px}
.trouble button[aria-pressed="true"].bk{background:var(--rec-warn);border:1px solid var(--rec-warn);color:#fff}
.trouble button[aria-pressed="true"].ob{background:var(--rec-under);border:1px solid var(--rec-under);color:#fff}
.rec-bar{position:fixed;left:0;right:0;bottom:0;z-index:11;padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:linear-gradient(to top,var(--rec-bg) 70%,var(--rec-fade));display:flex;gap:10px;max-width:760px;margin:0 auto}
.rec-bar button{height:54px;border-radius:16px;font:inherit;font-weight:900;font-size:16px;cursor:pointer;border:1px solid var(--rec-line);background:var(--rec-surface);color:var(--rec-fg)}
.rec-bar .back{flex:0 0 64px;display:flex;align-items:center;justify-content:center}
.rec-bar .back svg{width:22px;height:22px;stroke:currentColor;stroke-width:2.2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.rec-bar .go{flex:1;background:var(--rec-fg);color:var(--rec-bg);border-color:var(--rec-fg);letter-spacing:.04em;display:flex;align-items:center;justify-content:center;gap:8px}
.rec-bar .go svg{width:18px;height:18px;stroke:currentColor;stroke-width:2.4;fill:none;stroke-linecap:round;stroke-linejoin:round}
.rec-bar .go.save{background:linear-gradient(120deg,var(--turf),var(--accent2));border-color:transparent;color:#fff}
.rec-bar button:disabled{opacity:.3}
.sheet-back{position:fixed;inset:0;background:rgba(0,0,0,.4);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);z-index:30;display:flex;align-items:flex-end}
.sheet{width:100%;max-width:760px;margin:0 auto;background:var(--rec-surface);border-top:1px solid var(--rec-line);border-radius:20px 20px 0 0;padding:20px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:10px;color:var(--rec-fg)}
.sheet p{margin:0 0 6px;font-weight:700}
.sheet button{height:50px;border-radius:14px;font:inherit;font-weight:700;font-size:15px;border:1px solid var(--rec-line);background:var(--rec-bg);color:var(--rec-fg);cursor:pointer}
.sheet button.danger{background:var(--rec-under);border-color:var(--rec-under);color:#fff}
@media (max-height:700px){.rec{gap:9px;padding-top:6px}.hole-card{padding:12px 16px 12px}.hole-card .hno{font-size:66px}.hole-card .par{font-size:28px}.badge{margin-top:8px}.rec-card{gap:11px;padding:12px}.seg button{height:48px}.seg.s6 button{height:42px}.greenpad{height:140px}.gp-long,.gp-short,.gp-left,.gp-right{height:30px!important}.gp-left,.gp-right{top:calc(50% - 15px)!important}.trouble button{height:40px}.rec-bar button{height:50px}}
@media (max-width:360px){.seg button{font-size:20px}.hole-card .hno{font-size:60px}}
@media (prefers-reduced-motion:reduce){.slide-l,.slide-r{animation:none}}


/* v3 polish */
.ring{position:relative;width:46px;height:46px;flex:0 0 46px}
.ring svg{width:46px;height:46px;transform:rotate(-90deg)}
.ring .trk{fill:none;stroke:var(--rec-raise);stroke-width:4}
.ring .val{fill:none;stroke:url(#ringGrad);stroke-width:4;stroke-linecap:round;transition:stroke-dasharray .4s}
.ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--f-num);font-size:14px;font-weight:700}
.ring b small{font-size:9px;color:var(--rec-muted);margin-left:1px}
.hole-card::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.10) 45%,transparent 55%);background-size:250% 100%;animation:sheen 5s ease-in-out infinite;pointer-events:none}
@keyframes sheen{0%{background-position:120% 0}60%,100%{background-position:-60% 0}}
.hole-card .row2{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;margin-top:12px;position:relative}
.hole-card .row2 .badge{margin-top:0}
.hole-card .live{display:flex;gap:14px}
.hole-card .live div{text-align:right;line-height:1}
.hole-card .live span{display:block;font-size:9px;letter-spacing:.18em;opacity:.65;font-weight:700;margin-bottom:4px}
.hole-card .live b{font-family:var(--f-num);font-size:24px;font-weight:700}
.pop{animation:pop .28s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(.86)}100%{transform:scale(1)}}
.seg button[aria-pressed="true"]{transform:translateY(-2px)}
.seg button[aria-pressed="true"]:active{transform:scale(.94)}
.gp-on{filter:drop-shadow(0 10px 10px rgba(8,60,38,.35))}
.gp-on .cup{position:absolute;left:calc(50% - 4px);top:calc(50% + 6px);width:8px;height:4px;border-radius:50%;background:rgba(0,0,0,.45)}
.gp-on svg{width:18px!important;height:26px!important;margin-top:-14px;filter:drop-shadow(3px 4px 1px rgba(0,0,0,.25))}
.greenpad .rough{background:radial-gradient(ellipse at 50% 50%,color-mix(in srgb,var(--rec-turf) 12%,var(--rec-raise)) 0%,var(--rec-raise) 60%);}
.greenpad .rough::after{content:"";position:absolute;inset:0;border-radius:18px;background-image:radial-gradient(circle,var(--rec-line) 1px,transparent 1.2px);background-size:12px 12px;opacity:.8}
@media (prefers-reduced-motion:reduce){.hole-card::after,.pop{animation:none}}


/* v4: one colour scale everywhere (green → grey → red) */
.seg button.t-eagle{--sel:var(--q-eagle)}.seg button.t-birdie{--sel:var(--q-birdie)}.seg button.t-par{--sel:var(--q-par)}
.seg button.t-bogey{--sel:var(--q-bogey)}.seg button.t-double{--sel:var(--q-double)}.seg button.t-triple{--sel:var(--q-triple)}
.seg button.t-par[aria-pressed="true"],.seg button.t-bogey[aria-pressed="true"]{color:#0B1310}
.seg button.t-par[aria-pressed="true"] small,.seg button.t-bogey[aria-pressed="true"] small{color:rgba(11,19,16,.7)}
.dots button[class*="r-"]{border-color:transparent;color:#fff}
.dots button.r-eagle{background:var(--q-eagle)}.dots button.r-birdie{background:var(--q-birdie)}.dots button.r-par{background:var(--q-par);color:#0B1310}
.dots button.r-bogey{background:var(--q-bogey);color:#0B1310}.dots button.r-double{background:var(--q-double)}.dots button.r-triple{background:var(--q-triple)}
.badge.b-eagle,.badge.b-birdie,.badge.b-par,.badge.b-bogey,.badge.b-double,.badge.b-triple{color:#0B1310}
.badge.b-eagle{background:var(--q-eagle);color:#fff}.badge.b-birdie{background:var(--q-birdie);color:#fff}.badge.b-par{background:var(--q-par)}
.badge.b-bogey{background:var(--q-bogey)}.badge.b-double{background:var(--q-double)}.badge.b-triple{background:var(--q-triple);color:#fff}
.badge i{background:currentColor;opacity:.8}

/* v4: analysis */
.hero-stat{position:relative;overflow:hidden;border-radius:24px;padding:18px;color:#fff;background:linear-gradient(135deg,#0A1024 0%,#1B2F7A 55%,#2563EB 100%);box-shadow:0 12px 28px -14px rgba(10,16,36,.7)}
.hero-stat::before{content:"";position:absolute;right:-80px;top:-70px;width:280px;height:240px;border-radius:50%;background:repeating-radial-gradient(ellipse at center,rgba(255,255,255,.12) 0 1px,transparent 1px 14px);pointer-events:none}
.hero-stat .who{position:relative;font-size:11px;letter-spacing:.2em;font-weight:700;opacity:.75}
.hero-stat .main{position:relative;display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-top:6px}
.hero-stat .big{font-family:var(--f-num);font-size:72px;font-weight:700;line-height:.85}
.hero-stat .big small{font-size:14px;opacity:.65;margin-left:6px;letter-spacing:.1em;font-weight:600}
.hero-stat .topar{font-family:var(--f-num);font-size:22px;font-weight:700;margin-top:6px;opacity:.9}
.hero-stat .spark{width:46%;max-width:180px;height:56px}
.hero-stat .row{position:relative;display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:8px;margin-top:16px;padding-top:12px;border-top:1px solid rgba(255,255,255,.15)}

.q-eagle{background:var(--q-eagle)}.q-birdie{background:var(--q-birdie)}.q-par{background:var(--q-par)}.q-bogey{background:var(--q-bogey)}.q-double{background:var(--q-double)}.q-triple{background:var(--q-triple)}

/* v5: approach map */
.approach{display:block;width:100%;height:auto;user-select:none;-webkit-user-select:none}

.az-rough{fill:var(--rec-raise)}

.tracer{fill:none;stroke:#F2B01E;stroke-width:2.5;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:0;animation:trace .45s ease-out;opacity:.9;pointer-events:none}
@keyframes trace{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}

/* v6 */

.m-double{border:2px solid var(--q-double);color:var(--q-double);box-shadow:0 0 0 2px var(--paper),0 0 0 4px var(--q-double)}

.sc-legend{display:flex;flex-wrap:wrap;gap:10px;font-size:11px;color:var(--muted)}

/* celebration + best pace */
.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:3}

@keyframes fall{0%{transform:translateY(0) translateX(0) rotate(0);opacity:0}8%{opacity:1}50%{transform:translateY(120px) translateX(12px) rotate(300deg)}100%{transform:translateY(260px) translateX(-8px) rotate(620deg);opacity:.2}}

.pace{position:absolute;left:18px;top:14px;z-index:2;font-size:10px;font-weight:900;letter-spacing:.16em;padding:4px 9px;border-radius:999px;background:linear-gradient(120deg,#F2B01E,#FFD76A);color:#3A2600}
.hole-card .row1 .lbl{visibility:var(--lbl-vis,visible)}

/* round result */
.result-back{position:fixed;inset:0;z-index:40;background:rgba(5,10,20,.6);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;padding:20px max(16px,env(safe-area-inset-right,0px)) 20px max(16px,env(safe-area-inset-left,0px));animation:fadeIn .25s ease-out}

.rc-score{display:flex;align-items:flex-end;gap:12px}

@media (prefers-reduced-motion:reduce){.confetti i,.hole-card.flash,.result-card,.result-back{animation:none}}

<script>
(() => {
"use strict";
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const LS = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,8);
const today = () => { const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };
const DIRS = { on:"オン", left:"左", right:"右", long:"オーバー", short:"ショート", miss:"ミスヒット" };
// あらかじめ用意したコース（公開情報より。ヤードは現地のスコアカードで要確認）
const PRESET_COURSES = [
  { key:"ooyodogawa", name:"大淀川ゴルフ場", pref:"宮崎県", area:"宮崎市", holes:[100,90,110,130,125,120,70,90,80].map(y=>({par:3, yards:y})) },
  { key:"hyuga-seaside", name:"日向シーサイドゴルフクラブ", pref:"宮崎県", area:"日向市", // 公式サイトのホール図より（MG / SG）
    holes:[[152,125],[92,78],[154,132],[218,188],[148,121],[93,73],[138,110],[94,104],[160,142]].map(([m,s2],i)=>({par:3, yards:m, yards2:s2, ...(i?{}:{gn:["MG","SG"]})})) },
  { key:"firtree", name:"ファーツリーカントリークラブ", pref:"宮崎県", area:"延岡市", holes:[[3,76],[3,102],[3,88],[4,284],[3,109],[3,84],[4,366],[3,55],[3,160]].map(([p,y])=>({par:p, yards:y})) },
];
/* グリーンが2つあるコース（例 MG / SG）: 2つ目のヤードは hole.yards2、名前は holes[0].gn に入れる（シートの列を増やさないため） */
const PREFS = ["北海道","青森県","岩手県","宮城県","秋田県","山形県","福島県","茨城県","栃木県","群馬県","埼玉県","千葉県","東京都","神奈川県","新潟県","富山県","石川県","福井県","山梨県","長野県","岐阜県","静岡県","愛知県","三重県","滋賀県","京都府","大阪府","兵庫県","奈良県","和歌山県","鳥取県","島根県","岡山県","広島県","山口県","徳島県","香川県","愛媛県","高知県","福岡県","佐賀県","長崎県","熊本県","大分県","宮崎県","鹿児島県","沖縄県"];
/* 県・市町村もシートの列を増やさないよう holes[0] に入れる（第2段階で Cloudflare に移すときに正式な列にする） */
const cPref = c => (c && (c.pref || (c.holes && c.holes[0] && c.holes[0].pref))) || "";
const cArea = c => (c && (c.area || (c.holes && c.holes[0] && c.holes[0].area))) || "";
const presetTaken = pc => state.courses.some(c=>c.presetKey===pc.key || c.name.replace(/\s/g,"").includes(pc.name.replace(/\s/g,"")));
/* 選べるコース = 登録済み + まだ追加していない用意済みコース（id は "preset:キー"） */
function pickableCourses(){
  const list = state.courses.map(c=>({ id:c.id, name:c.name, pref:cPref(c), area:cArea(c), holes:c.holes }));
  PRESET_COURSES.filter(pc=>!presetTaken(pc)).forEach(pc=>list.push({ id:"preset:"+pc.key, name:pc.name, pref:pc.pref, area:pc.area, holes:pc.holes, preset:true }));
  return list.sort((a,b)=>a.name.localeCompare(b.name,"ja"));
}
const favs = () => LS.get("sc.favs", []);
function courseGreens(c){ if(!c || !c.holes || !c.holes.some(h=>h.yards2)) return null; const g=c.holes[0].gn; return Array.isArray(g)&&g.length===2 ? g : ["A","B"]; }
const TEES = { fw:"フェアウェイ", rl:"左", rr:"右", miss:"ミスショット" };
const CLUBS = ["1W","3W","5W","UT","5I","6I","7I","8I","9I","PW","AW","SW"];
const CLUB_GROUPS = [
  ["ドライバー", ["1W"]],
  ["ウッド", ["3W","4W","5W","7W","9W"]],
  ["ユーティリティ", ["UT","3U","4U","5U","6U"]],
  ["アイアン", ["3I","4I","5I","6I","7I","8I","9I"]],
  ["ウェッジ", ["PW","AW","SW"]],
  ["ウェッジ（角度）", ["48°","50°","52°","54°","56°","58°","60°"]],
];
const CLUB_SUGGEST = CLUB_GROUPS.flatMap(g=>g[1]);
const CLUB_MAX = 13; // パターを除く
const sortClubs = l => l.slice().sort((a,b)=>clubRank(a)-clubRank(b));
function myClubs(){ const c = LS.get("sc.clubs", null); return sortClubs(Array.isArray(c) && c.length ? c.slice(0,13) : CLUBS.slice()); }
function setClubs(list){ LS.set("sc.clubs", sortClubs(list.filter(Boolean)).slice(0,13)); }
function clubRank(n){ const t=String(n).toUpperCase().replace(/\s/g,""); let m;
  if((m=t.match(/^(\d+)W$/))) return +m[1]; if(t==="DR"||t==="DRIVER") return 1;
  if((m=t.match(/^(\d+)(U|H|UT)$/))) return 100+ +m[1]; if(t==="UT"||t==="U") return 104;
  if((m=t.match(/^(\d+)I$/))) return 200+ +m[1];
  if((m=t.match(/^(\d+)°?$/))) return 300+(+m[1]-44)*2;
  return ({PW:304,AW:312,GW:312,SW:324,LW:332,PT:500,PUTTER:500})[t] ?? 400; }
// 記録する項目（打数は常に記録）
const FIELD_DEFS = [
  {k:"putts",  label:"パット数",              def:true},
  {k:"ob",     label:"OB",                    def:true},
  {k:"bunker", label:"バンカー",              def:true},
  {k:"pen",    label:"1ペナ（池・赤杭など）", def:false},
  {k:"shot",   label:"ショットの方向", def:false},
  {k:"club",   label:"使用クラブ", def:false},
];
function fields(){ const saved = LS.get("sc.fields", {}); const f={}; if(saved.shot==null && (saved.approach||saved.tee)) saved.shot=true; FIELD_DEFS.forEach(d=>f[d.k] = saved[d.k]!=null ? saved[d.k] : d.def); return f; }

const state = {
  tab: LS.get("sc.tab","record"),
  mode: "connecting", // connecting | cloud | local
  courses: [], rounds: [],
  draft: LS.get("sc.draft", null),
  hole: 0,
  fPlayer: LS.get("sc.fPlayer", LS.get("sc.player","") || "all"), fCourse:"all", fRange:"all",
  courseEdit: null,
  confirm: null,
  demo: false
};

/* ---------- 自動アップデート: 新しい版が公開されていたら読み直す ---------- */
const BUILD = "2026-10-19-1525";
async function checkUpdate(){
  try{
    const res = await fetch(location.pathname + "?check=" + Date.now(), { cache:"no-store" });
    const txt = await res.text();
    const m = txt.match(/const BUILD = "([^"]+)"/);
    if(m && m[1] !== BUILD) location.replace(location.pathname + "?v=" + m[1]);
  }catch(e){}
}
document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState==="visible") checkUpdate(); });
setTimeout(checkUpdate, 1500);


/* ---------- オフライン対応とホーム画面への追加案内 ---------- */
if("serviceWorker" in navigator && location.protocol==="https:") navigator.serviceWorker.register("sw.js").catch(()=>{});
let installEvt = null;
window.addEventListener("beforeinstallprompt", e=>{ e.preventDefault(); installEvt = e; });
const isStandalone = () => window.matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
const ua = navigator.userAgent;
const isIOS = /iPhone|iPad|iPod/.test(ua) || (navigator.platform==="MacIntel" && navigator.maxTouchPoints>1);
const isAndroid = /Android/.test(ua);
function maybeShowA2HS(){

/* ---------- storage: Google スプレッドシート (Apps Script) ---------- */
// ↓ Apps Script を「ウェブアプリ」として公開したときの URL を貼り付けてください
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw0sl0SbAukE3UDirc5iYePK-XaY9pD5gZvwg5g-IJMdAuiRRqwilifThZvbinzDTuO/exec";
const hasBackend = /^https:\/\/script\.google\.com\//.test(SCRIPT_URL);
let pending = LS.get("sc.pending", []); // 電波が悪くて送れなかった保存

async function api(action, payload){
  const res = await fetch(SCRIPT_URL, { method:"POST", headers:{ "Content-Type":"text/plain;charset=utf-8" }, body: JSON.stringify({ action, ...payload }) });
  const j = await res.json();
  if(!j.ok) throw new Error(j.error || "failed");
  return j;
}
function cache(){ LS.set("sc.courses", state.courses); LS.set("sc.rounds", state.rounds); }
const store = {
  async saveCourse(c){ if(hasBackend) await api("saveCourse",{course:c}); upsert(state.courses,c); cache(); render(); },
  async delCourse(id){ if(hasBackend) await api("deleteCourse",{id}); state.courses=state.courses.filter(c=>c.id!==id); cache(); render(); },
  async saveRound(r){
    upsert(state.rounds,r); cache();
    if(hasBackend){
      try{ await api("saveRound",{round:r}); }
      catch(e){ pending = pending.filter(p=>p.id!==r.id).concat([r]); LS.set("sc.pending",pending); toast("電波が弱いので端末に保存しました。あとで自動で送ります"); }
    }
    render();
  },
  async delRound(id){ if(hasBackend) await api("deleteRound",{id}); state.rounds=state.rounds.filter(r=>r.id!==id); pending=pending.filter(p=>p.id!==id); LS.set("sc.pending",pending); cache(); render(); }
};
function upsert(arr, item){ const i=arr.findIndex(x=>x.id===item.id); if(i>=0) arr[i]=item; else arr.push(item); }

async function flushPending(){
  if(!hasBackend || !pending.length) return;
  for(const r of pending.slice()){
    try{ await api("saveRound",{round:r}); pending=pending.filter(p=>p.id!==r.id); LS.set("sc.pending",pending); }
    catch(e){ return; }
  }
  toast("未送信だったラウンドを送りました");
}
let loading = false;
async function connect(){
  state.courses = LS.get("sc.courses", []); state.rounds = LS.get("sc.rounds", []);
  if(!hasBackend){ state.mode="local"; render(); return; }
  if(loading) return; loading = true;
  try{
    await flushPending();
    const res = await fetch(SCRIPT_URL + "?t=" + Date.now());
    const j = await res.json();
    if(!j.ok) throw new Error(j.error);
    state.courses = j.courses; state.serverVer = j.version || 1;
    state.rounds = j.rounds;
    pending.forEach(r=>upsert(state.rounds, r));
    cache(); state.mode = "cloud";
  }catch(e){ state.mode = "offline"; }
  loading = false;
  render();
}
document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState==="visible") connect(); });
window.addEventListener("online", connect);

/* ---------- helpers ---------- */
let toastT;
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>t.hidden=true,2600); }
const sum = (a,f=x=>x) => a.reduce((s,x)=>s+f(x),0);
const pct = (n,d) => d ? Math.round(n/d*1000)/10 : null;
const fmtPct = v => v==null ? "—" : (v%1===0? v.toFixed(0): v.toFixed(1));
const toPar = n => n===0 ? "±0" : (n>0? "+"+n : String(n));
function roundTotals(r){ const s=sum(r.holes,h=>h.strokes), p=sum(r.holes,h=>h.par), pt=sum(r.holes,h=>h.putts); return {score:s, par:p, putts:pt, diff:s-p}; }
function players(){ return [...new Set(rounds().map(r=>r.player))].filter(Boolean).sort((a,b)=>a.localeCompare(b,"ja")); }
function rounds(){ return state.demo ? DEMO.rounds : state.rounds; }
function courses(){ return state.demo ? DEMO.courses : state.courses; }
function byDate(a,b){ return (a.date||"").localeCompare(b.date||"") || (a.createdAt||0)-(b.createdAt||0); }

/* ---------- stats ---------- */
function computeStats(rs){
  const holes = rs.flatMap(r=>r.holes.filter(h=>h.strokes>0));
  const n = holes.length;
  const gir = holes.filter(h=>h.strokes-h.putts <= h.par-2);
  const bon = holes.filter(h=>h.strokes-h.putts <= h.par-1);
  const missGir = holes.filter(h=>h.strokes-h.putts > h.par-2);
  const scramble = missGir.filter(h=>h.strokes<=h.par);
  const bunker = holes.filter(h=>h.bunker);
  const sandSave = bunker.filter(h=>h.strokes<=h.par);
  const ob = holes.filter(h=>h.ob);
  const pen = holes.filter(h=>h.pen);
  const teeH = holes.filter(h=>h.par>=4 && h.tee); const teeC = {fw:0,rl:0,rr:0,miss:0}; teeH.forEach(h=>{ if(teeC[h.tee]!=null) teeC[h.tee]++; });
  const putt = {0:0,1:0,2:0,3:0};
  holes.forEach(h=>{ putt[Math.min(h.putts,3)]++; });
  const dirs = {on:0,left:0,right:0,long:0,short:0,miss:0}; let dirN=0;
  holes.forEach(h=>{ if(h.dir && dirs[h.dir]!=null){ dirs[h.dir]++; dirN++; } });
  const dist = {hio:0,eagle:0,birdie:0,par:0,bogey:0,double:0,triple:0};
  holes.forEach(h=>{ const d=h.strokes-h.par; if(h.strokes===1)dist.hio++; else if(d<=-2)dist.eagle++; else if(d===-1)dist.birdie++; else if(d===0)dist.par++; else if(d===1)dist.bogey++; else if(d===2)dist.double++; else dist.triple++; });
  const tots = rs.map(roundTotals);
  const byPar = {};
  holes.forEach(h=>{ (byPar[h.par] ||= []).push(h.strokes); });
  return {
    rounds: rs.length, holes: n,
    avgScore: tots.length? sum(tots,t=>t.score)/tots.length : null,
    avgDiff: tots.length? sum(tots,t=>t.diff)/tots.length : null,
    best: tots.length? Math.min(...tots.map(t=>t.diff)) : null,
    avgPuttsRound: tots.length? sum(tots,t=>t.putts)/tots.length : null,
    puttsPerHole: n? sum(holes,h=>h.putts)/n : null,
    puttsPerGir: gir.length? sum(gir,h=>h.putts)/gir.length : null,
    puttsPerMiss: missGir.length? sum(missGir,h=>h.putts)/missGir.length : null,
    gir: pct(gir.length,n), bon: pct(bon.length,n),
    one: pct(putt[1],n), three: pct(putt[3],n),
    scramble: pct(scramble.length, missGir.length), scrambleN: missGir.length,
    bunkerRate: pct(bunker.length,n), sandSave: pct(sandSave.length,bunker.length), bunkerN: bunker.length,
    obRate: pct(ob.length,n), obN: ob.length,
    penRate: pct(pen.length,n), penN: pen.length,
    teeN: teeH.length, teeC, fwRate: pct(teeC.fw, teeH.length),
    parOrBetter: pct(dist.eagle+dist.birdie+dist.par, n),
    putt, dirs, dirN, dist, byPar
  };
}

    const best = others.reduce((a,r)=> roundTotals(r).diff < roundTotals(a).diff ? r : a);

function donutPanel(title, id, segs, total, centerVal, centerLbl){
  return `<div class="panel"><div class="sec"><em>BREAKDOWN</em><span>${title}</span></div>${donutSVG(segs, total, centerVal, centerLbl, title)}</div>`;

/* ドーナツ: 各部分から引き出し線でラベルを直接つける */
function donutSVG(segs, total, centerVal, centerLbl, title){
  const W=360, H=236, cx=180, cy=118, R=74, r=54, t=segs.reduce((a,x)=>a+x.n,0);
  if(!t) return `<p class="muted" style="font-size:13px">まだ記録がありません。</p>`;
  const P=(ang,rad)=>[cx+rad*Math.cos(ang), cy+rad*Math.sin(ang)];
  const gap = segs.length>1 ? .025 : 0;
  let a0=-Math.PI/2; const arcs=[], labels=[];
  segs.forEach(x=>{ const sw=x.n/t*Math.PI*2, a1=a0+sw, s0=a0+gap/2, s1=a1-gap/2, big=(s1-s0)>Math.PI?1:0, col=`var(${x.tone})`;
    if(segs.length===1) arcs.push(`<circle cx="${cx}" cy="${cy}" r="${(R+r)/2}" fill="none" stroke="${col}" stroke-width="${R-r}"/>`);
    else { const [x1,y1]=P(s0,R),[x2,y2]=P(s1,R),[x3,y3]=P(s1,r),[x4,y4]=P(s0,r);
      arcs.push(`<path d="M${x1.toFixed(2)} ${y1.toFixed(2)} A${R} ${R} 0 ${big} 1 ${x2.toFixed(2)} ${y2.toFixed(2)} L${x3.toFixed(2)} ${y3.toFixed(2)} A${r} ${r} 0 ${big} 0 ${x4.toFixed(2)} ${y4.toFixed(2)}Z" fill="${col}"/>`); }
    const m=(a0+a1)/2, [ex,ey]=P(m,R+12), [sx,sy]=P(m,R+2);
    labels.push({ x, m, sx, sy, ex, ey, y:ey, right: Math.cos(m)>=0, pct: pct(x.n,total) });
    a0=a1; });
  // 同じ側のラベルが重ならないように上下にずらす
  const GAP=32, TOP=18, BOT=H-14;
  [true,false].forEach(side=>{ const L=labels.filter(l=>l.right===side).sort((p,q)=>p.y-q.y);
    for(let i=0;i<L.length;i++){ L[i].y=Math.max(L[i].y, TOP, i?L[i-1].y+GAP:TOP); }
    for(let i=L.length-1;i>=0;i--){ L[i].y=Math.min(L[i].y, i<L.length-1?L[i+1].y-GAP:BOT); } });
  const lines = labels.map(l=>{ const hx = l.right ? cx+R+20 : cx-R-20, tx = l.right ? hx+4 : hx-4, an = l.right?"start":"end", col=`var(${l.x.tone})`;

    <text x="${cx}" y="${cy+4}" class="dc-v">${String(centerVal).replace(/<small>%<\/small>/,'<tspan class="dc-u">%</tspan>')}</text><text x="${cx}" y="${cy+21}" class="dc-l">${centerLbl}</text></svg>`;
}
function greenMap(s){
  if(!s.dirN) return `<p class="muted" style="font-size:13px">まだ記録がありません。記録画面でグリーンのどこに行ったかを選ぶとここに出ます。</p>`;
  const miss = s.dirN - s.dirs.on;
  const worst = miss ? ["left","right","long","short"].reduce((a,b)=>s.dirs[b]>s.dirs[a]?b:a) : null;
  return approachSVG(null,false,s) + `<p class="muted" style="font-size:12px;text-align:center;margin:8px 0 0">${s.dirN}球の記録${worst?`・一番多いミスは<b style="color:var(--q-triple)">${DIRS[worst]}</b>`:""}</p>`;
}
function cssv(n){ return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
after.stats = () => {
  ["f-course","f-range"].forEach(id=>{ const el=$("#"+id); if(el) el.onchange=()=>{ if(id==="f-player"){state.fPlayer=el.value; LS.set("sc.fPlayer",el.value);} if(id==="f-course") state.fCourse=el.value; if(id==="f-range") state.fRange=el.value; state.trendSel=null; render(); }; });
  if(!window.Chart || !$("#ch-score")) return;
  const fg=cssv("--fg"), muted=cssv("--muted"), line=cssv("--line"), paper=cssv("--paper");
  const pal=["--c1","--c2","--c3","--c4","--c5","--c6"].map(cssv);
  Chart.defaults.color=muted; Chart.defaults.borderColor=line;
  Chart.defaults.font.family=cssv("--f-body"); Chart.defaults.font.size=12;
  const rs = filteredRounds();
  const s = computeStats(rs);
  const seen={}; const circ="①②③④⑤⑥⑦⑧⑨";
  const byDay={}; rs.forEach(r=>{ byDay[r.date]=(byDay[r.date]||0)+1; });
  const lbl = rs.map(r=>{ const [y,m,d]=(r.date||"").split("-"); seen[r.date]=(seen[r.date]||0)+1; return `${+m}/${+d}` + (byDay[r.date]>1 ? circ[seen[r.date]-1]||"" : ""); });
  // データが少ないときは左詰め: 最低10本分の枠を確保して、空き枠は右側に置く
  const SLOTS = Math.max(10, rs.length);
  const pad = arr => arr.concat(Array(SLOTS-arr.length).fill(null));
  const labels = lbl.concat(Array(SLOTS-lbl.length).fill(""));
  const oneCourse = state.fCourse!=="all";
  const tot = rs.map(roundTotals);
  // 基準線: 横いっぱいに引く太めの線（パー・ボギー・ダボ）
  const holesN = (()=>{ const c={}; rs.forEach(r=>{ c[r.holes.length]=(c[r.holes.length]||0)+1; }); return +Object.keys(c).sort((x,y)=>c[y]-c[x])[0] || 9; })();
  const parN = oneCourse ? (courses().find(c=>c.id===state.fCourse)?.holes.reduce((a,h)=>a+h.par,0) ?? roundTotals(rs[0]).par) : 0;
  const refLines = (lines) => ({ id:"refLines", afterDatasetsDraw(chart){ const {ctx, chartArea:a, scales:{y}} = chart; ctx.save();
    lines.forEach(L=>{ const py=y.getPixelForValue(L.v); if(py<a.top-1||py>a.bottom+1) return;
      ctx.strokeStyle=L.color; ctx.lineWidth=L.w||2.5; ctx.setLineDash([]); ctx.beginPath(); ctx.moveTo(a.left,py); ctx.lineTo(a.right,py); ctx.stroke();
      ctx.font="700 12px "+cssv("--f-num"); ctx.fillStyle=L.color; ctx.textAlign="right"; ctx.textBaseline="bottom"; ctx.fillText(L.label,a.right-2,py-3); });
    ctx.restore(); } });
  const scoreLines = [
    { v: parN, label: oneCourse?`${parN}`:"±0", color: cssv("--q-par") },
    { v: parN+holesN, label: oneCourse?`${parN+holesN}`:`+${holesN}`, color: cssv("--q-bogey") },
    { v: parN+2*holesN, label: oneCourse?`${parN+2*holesN}`:`+${2*holesN}`, color: cssv("--q-double") }
  ];
  const vals = rs.map((r,i)=> oneCourse ? tot[i].score : tot[i].diff);
  // 棒の色: そのラウンドがどの基準線の内側か（パー以内=青 / ボギー以内=オレンジ / それ以上=赤）
  const scoreZone = i => { const per = tot[i].diff / rs[i].holes.length; return per<=0 ? "par" : per<=1 ? "bogey" : "double"; };
  const puttZone = i => { const per = tot[i].putts / rs[i].holes.length; return per<=2 ? "par" : per<=2.5 ? "bogey" : "double"; };
  const zoneColor = z => cssv("--q-"+z);
  const zoneFill = zf => c => zoneColor(zf(c.dataIndex));
  const tip = { filter: it => it.dataIndex < rs.length, displayColors:false, callbacks:{ title: items => { const r=rs[items[0].dataIndex]; if(!r) return ""; const [y,m,d]=r.date.split("-"); return `${+m}/${+d}  ${r.courseName}（${r.holes.length}H）`; }, label: () => [] } };
  // 2つの推移グラフを連動: タップした棒以外を薄くする
  const SCORE_C="#2F7DE1", PUTT_C="#22A06B";
  const fade = (col, i) => state.trendSel==null || state.trendSel===i ? col : col+"38";
  let scoreChart, puttChart;
  const paintTrend = () => { [[scoreChart,SCORE_C],[puttChart,PUTT_C]].forEach(([ch,col])=>{ if(!ch) return; ch.data.datasets[0].backgroundColor = labels.map((_,i)=>fade(col,i)); ch.update("none"); }); };
  const onTap = (src) => (evt, els) => {
    const i = els.length ? els[0].index : null;
    state.trendSel = (i==null || i>=rs.length || state.trendSel===i) ? null : i;
    paintTrend();
    const other = src===scoreChart ? puttChart : scoreChart;
    if(other){ other.tooltip.setActiveElements([], {x:0,y:0}); other.update("none"); }
    if(state.trendSel==null){ src.tooltip.setActiveElements([], {x:0,y:0}); src.update("none"); }
  };
  if(state.trendSel!=null && state.trendSel>=rs.length) state.trendSel=null;
  const opts = (yTitle, yFmt, lo, hi) => ({ maintainAspectRatio:false, events:["click"], plugins:{ legend:{display:false}, tooltip:tip },
    scales:{ x:{ ticks:{ maxRotation:0, autoSkip:true, autoSkipPadding:14, maxTicksLimit:6 }, grid:{display:false} }, y:{ title:{display:true,text:yTitle}, ticks:{ precision:0, callback: yFmt || (v=>v) }, suggestedMin:lo, suggestedMax:hi, grid:{ color: cssv("--soft") } } } });
  const o1 = opts(oneCourse?"スコア":"対パー", oneCourse?null:(v=>toPar(v)), Math.min(parN-2, ...vals), Math.max(parN+2*holesN+1, ...vals));
  charts.push(scoreChart = new Chart($("#ch-score"), { type:"bar", data:{ labels, datasets:[
    { label:"スコア", data: pad(vals), backgroundColor: labels.map((_,i)=>fade(SCORE_C,i)), borderColor: rs.map((r,i)=>zoneColor(scoreZone(i))), borderWidth:0, borderSkipped:"start", borderRadius:5, maxBarThickness:16, base: oneCourse ? undefined : 0 }
  ]}, options:o1, plugins:[refLines(scoreLines)] }));
  const pVals = tot.map(t=>t.putts);
  const o2 = opts("パット", null); o2.scales.y.min = Math.min(holesN+1, ...pVals); o2.scales.y.max = Math.max(holesN*2+6, ...pVals);
  charts.push(puttChart = new Chart($("#ch-putt"), { type:"bar", data:{ labels, datasets:[
    { label:"パット", data: pad(pVals), backgroundColor: labels.map((_,i)=>fade(PUTT_C,i)), borderColor: rs.map((r,i)=>zoneColor(puttZone(i))), borderWidth:0, borderSkipped:"start", borderRadius:5, maxBarThickness:16 }
  ]}, options:o2, plugins:[refLines([{ v:2*holesN, label:`${2*holesN}`, color: cssv("--q-par") }])] }));
  scoreChart.options.onClick = onTap(scoreChart); puttChart.options.onClick = onTap(puttChart);
  // パーオン率・ボギーオン率の推移（1ラウンドごと）
  const perRound = rs.map(r=>{ const hs=r.holes.filter(h=>h.strokes>0); const n=hs.length||1;
    return { gir: Math.round(hs.filter(h=>h.strokes-h.putts<=h.par-2).length/n*100), bon: Math.round(hs.filter(h=>h.strokes-h.putts<=h.par-1).length/n*100) }; });
  const oOn = opts("%", v=>v+"%"); oOn.scales.y.min=0; oOn.scales.y.max=100; oOn.events=["click"];
  oOn.plugins.legend={display:true, position:"bottom", labels:{boxWidth:14, boxHeight:3, usePointStyle:false}};
  oOn.plugins.tooltip = { ...tip, displayColors:true, callbacks:{ ...tip.callbacks, label: c => ` ${c.dataset.label} ${c.raw}%` } };
  const lineDs = (label,key,col) => ({ type:"line", label, data: pad(perRound.map(x=>x[key])), borderColor:col, backgroundColor:col, borderWidth:2.5, pointRadius:3, pointHoverRadius:5, tension:.3, spanGaps:false });
  charts.push(new Chart($("#ch-on"), { type:"line", data:{ labels, datasets:[ lineDs("パーオン率","gir","#2F7DE1"), lineDs("ボギーオン率","bon","#22A06B") ]}, options:oOn }));
  if($("#ch-hole")){
    const c = courses().find(x=>x.id===state.fCourse);
    const n = c ? c.holes.length : Math.max(...rs.map(r=>r.holes.length));
    const avg=[], par=[];
    for(let i=0;i<n;i++){ const hs=rs.map(r=>r.holes[i]).filter(h=>h&&h.strokes>0); avg.push(hs.length? +(sum(hs,h=>h.strokes)/hs.length).toFixed(2):null); par.push(c?c.holes[i].par:(hs[0]?hs[0].par:null)); }
    charts.push(new Chart($("#ch-hole"), {data:{labels:avg.map((_,i)=>i+1+"H"), datasets:[
      {type:"bar", label:"平均打数", data:avg, backgroundColor:avg.map((v,i)=>v!=null&&par[i]!=null&&v-par[i]>=1?cssv("--over"):cssv("--c1")), borderRadius:4},
      {type:"line", label:"パー", data:par, borderColor:fg, borderDash:[4,4], pointRadius:0, borderWidth:1.5, stepped:"middle"}
    ]}, options:{maintainAspectRatio:false, plugins:{legend:{labels:{boxWidth:10}}}, scales:{y:{beginAtZero:true}, x:{grid:{display:false}}}}}));
  }
};

  if(!b || b.dataset.stop || b.classList.contains("fs-row")) return;
  if(b.dataset.tab){ state.tab=b.dataset.tab; state.confirm=null; LS.set("sc.tab",state.tab); render(); window.scrollTo({top:0}); return; }
  const a=b.dataset.act, d=state.draft, h=d && d.holes[state.hole];
  state.tap = (a==="sv"||a==="pv"||a==="dir") ? a+b.dataset.v : null;
  switch(a){
    case "goto-courses": state.sheet=null; state.tab="courses"; LS.set("sc.tab","courses"); state.courseEdit=newCourse(); render(); window.scrollTo({top:0}); break;
    case "goto-record": state.tab="record"; render(); break;
    case "save-card": {
      const card=$(".result-card"); if(!card || !window.html2canvas){ toast("画像を作れませんでした"); break; }
      b.disabled=true; b.textContent="作成中…";
      try{
        const cv = await html2canvas(card,{scale:3, backgroundColor:null, useCORS:true, ignoreElements: el=>el.classList && el.classList.contains("confetti")});
        const blob = await new Promise(r=>cv.toBlob(r,"image/png"));
        const file = new File([blob], `golfsc-${state.result.date}.png`, {type:"image/png"});
        if(navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file], title:"GOLF SC."}); }
        else { const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=file.name; document.body.appendChild(a); a.click(); a.remove(); toast("画像を保存しました"); }
      }catch(e){ if(e && e.name!=="AbortError") toast("画像を作れませんでした"); }
      b.disabled=false; b.textContent="画像を保存・送る"; break;
    }
    case "back-to-input": {
      const r=state.result; state.result=null; if(!r) { render(); break; }
      state.draft={...JSON.parse(JSON.stringify(r)), editing:true}; state.draft.holes.forEach(x=>x.entered=true);
      state.hole=r.holes.length-1; state.tab="record"; LS.set("sc.tab","record"); saveDraft(); render(); break;
    }
    case "close-result": state.result=null; render(); break;
    case "toggle-round": state.openRound = state.openRound===b.dataset.id ? null : b.dataset.id; state.confirm=null; render(); break;
    case "pick-player": state.trendSel=null; state.fPlayer=b.dataset.v; LS.set("sc.fPlayer",state.fPlayer); render(); break;
    case "demo-on": state.demo=true; render(); break;
    case "demo-off": state.demo=false; render(); break;
    case "start": {
      const p=$("#r-player").value.trim(), cid=$("#r-course").value, dt=$("#r-date").value||today();
      if(!p){ $("#r-err").textContent="プレーヤーの名前を入れてください"; return; }
      if(!cid || cid==="__more"){ $("#r-err").textContent="コースを選んでください"; return; }
      let c=state.courses.find(x=>x.id===cid);
      if(!c && cid.startsWith("preset:")){ const pc=PRESET_COURSES.find(x=>"preset:"+x.key===cid); if(!pc) return;
        c = { id:uid(), name:pc.name, presetKey:pc.key, holes:pc.holes.map((x,i)=>i?{...x}:{...x, pref:pc.pref, area:pc.area}), createdAt:Date.now() };
        upsert(state.courses,c); cache(); store.saveCourse(c).catch(()=>{}); // 電波がなくても始められるように、保存は裏で
        const F=favs(); if(F.includes(cid)) LS.set("sc.favs", F.map(x=>x===cid?c.id:x)); }
      if(!c) return;
      { const F=favs(); if(!F.includes(c.id)) LS.set("sc.favs",[...F,c.id]); }
      LS.set("sc.lastCourse", c.id); state.pick=null; state.sp=null; state.sd=null;
      LS.set("sc.player",p);
      const gs=courseGreens(c), gi=gs ? (+($("#r-green")||{}).value||0) : 0;
      state.draft={ id:uid(), player:p, courseId:c.id, courseName:c.name, date:dt, gn:gs, holes:c.holes.map(x=>({par:x.par, yards:(gi&&x.yards2)?x.yards2:(x.yards||null), ys:gs?[x.yards||null,x.yards2||null]:null, gi, strokes:x.par, putts:2, dir:null, bunker:false, ob:false, pen:false, tee:null, club:null, entered:false})) };
      state.hole=0; saveDraft(); render(); break;
    }
    case "hole": mark_entered(); state.slide = +b.dataset.i>state.hole?"l":"r"; state.hole=+b.dataset.i; saveDraft(); render(); break;
    case "sv": { const v=+b.dataset.v; h.strokes = v===8 ? (h.strokes>=8 ? h.strokes+1 : 8) : v; if(h.strokes>15) h.strokes=8; if(h.putts>h.strokes-1) h.putts=Math.max(0,h.strokes-1); h.entered=true; saveDraft(); render(); break; }
    case "pv": h.putts=+b.dataset.v; if(h.strokes<h.putts+1) h.strokes=h.putts+1; h.entered=true; saveDraft(); render(); break;
    case "st": h.strokes=Math.max(1,Math.min(15,h.strokes+ +b.dataset.d)); if(h.putts>h.strokes-1) h.putts=Math.max(0,h.strokes-1); h.entered=true; state.tap="st"; saveDraft(); render(); break;
    case "pt": h.putts=Math.max(0,Math.min(9,h.putts+ +b.dataset.d)); if(h.strokes<h.putts+1) h.strokes=Math.min(15,h.putts+1); h.entered=true; state.tap="pt"; saveDraft(); render(); break;
    case "dir": h.dir = h.dir===b.dataset.v ? null : b.dataset.v; h.entered=true; state.tap="dir"; saveDraft(); render(); askClub(h.dir); break;
    case "tog": h[b.dataset.k]=!h[b.dataset.k]; h.entered=true; saveDraft(); render(); break;
    case "prev": mark_entered(); state.slide="r"; state.hole--; saveDraft(); render(); break;
    case "next": mark_entered(); state.slide="l"; state.hole++; saveDraft(); render(); window.scrollTo({top:0}); break;
    case "finish": {
      mark_entered();
      const r={ id:d.id, player:d.player, courseId:d.courseId, courseName:d.courseName, date:d.date, createdAt:d.createdAt||Date.now(),
        holes:d.holes.map(x=>({par:x.par, strokes:x.strokes, putts:x.putts, dir:x.dir, bunker:!!x.bunker, ob:!!x.ob, pen:!!x.pen, tee:x.tee||null, club:x.club||null})) };
      b.disabled=true;
      try{ await store.saveRound(r); state.draft=null; saveDraft(); state.tab="history"; LS.set("sc.tab","history"); state.fPlayer=r.player; state.openRound=r.id; state.result=r; render(); }
      catch(e){ b.disabled=false; writeErr(e); }
      break;
    }
    case "ask-discard": state.confirm="discard"; render(); break;
    case "pick-course": state.pick=b.dataset.id; state.sheet=null; state.pickAdd=false; render(); break;
    case "add-fav-pick": { const F=favs(); if(!F.includes(b.dataset.id)) LS.set("sc.favs",[...F,b.dataset.id]); state.pick=b.dataset.id; state.sheet=null; state.pickAdd=false; render(); break; }
    case "pick-add": state.pickAdd=true; render(); break;
    case "open-pick": state.sheet="pick"; state.pickPref=undefined; render(); break;
    case "close-pick": state.sheet=null; state.pickAdd=false; render(); break;
    case "fav": { const F=favs(), id=b.dataset.id; LS.set("sc.favs", F.includes(id)?F.filter(x=>x!==id):[...F,id]); render(); break; }
    case "add-preset": {
      const pc = PRESET_COURSES.find(x=>x.key===b.dataset.k); if(!pc) break;
      const c = { id:uid(), name:pc.name, presetKey:pc.key, holes:pc.holes.map((x,i)=>i?{...x}:{...x, pref:pc.pref, area:pc.area}), createdAt:Date.now() };
      try{ await store.saveCourse(c); toast(`${pc.name}を追加しました`); }catch(e){ writeErr(e); } break;
    }
    case "open-fields": state.sheet="fields"; render(); break;
    case "close-sheet": state.sheet=null; render(); break;
    case "tee": h.tee = h.tee===b.dataset.v ? null : b.dataset.v; h.entered=true; state.tap="tee"; saveDraft(); render(); askClub(h.tee); break;
    case "club": h.club = h.club===b.dataset.v ? null : b.dataset.v; h.entered=true; state.sheet=null; saveDraft(); render(); break;
    case "open-club": state.sheet="club"; render(); break;
    case "set-g": { const ni=+b.dataset.g; if((h.gi||0)===ni) break; d.holes.forEach(x=>{ if(x.ys && x.ys[ni]){ x.gi=ni; x.yards=x.ys[ni]; } }); saveDraft(); render(); toast(`全ホールを${d.gn[ni]}のヤードにしました`); break; }
    case "swap-g": { const ni=1-(h.gi||0); d.holes.forEach((x,i)=>{ if(i>=state.hole && x.ys && x.ys[ni]){ x.gi=ni; x.yards=x.ys[ni]; } }); saveDraft(); render(); toast(`${d.gn[ni]}にしました（このホールから先）`); break; }
    case "open-clubs": state.clubBack=state.sheet; state.clubEdit=myClubs(); state.sheet="clubs"; render(); break;
    case "close-clubs": { const l=(state.clubEdit||[]).map(x=>String(x).trim()).filter(Boolean); setClubs(l.length?l:CLUBS); state.clubCustom=null; state.clubEdit=null; state.sheet=state.clubBack||null; state.clubBack=null; render(); break; }
    case "club-out": state.clubEdit=state.clubEdit.filter(x=>x!==b.dataset.v); setClubs(state.clubEdit); render(); break;
    case "club-in": if(state.clubEdit.length>=CLUB_MAX){ toast(`クラブは${CLUB_MAX}本まで（パター除く）。左から外してください`); break; }
      state.clubEdit=sortClubs([...state.clubEdit, b.dataset.v]); setClubs(state.clubEdit); render(); break;
    case "club-custom": { const el=$("#cl-new"), v=(el&&el.value||"").trim().slice(0,6); if(!v) break;
      if(state.clubEdit.includes(v)){ toast("すでに入っています"); break; }
      if(state.clubEdit.length>=CLUB_MAX){ state.clubCustom=[...(state.clubCustom||[]), v]; toast(`${CLUB_MAX}本入っているので候補に追加しました`); render(); break; }
      state.clubEdit=sortClubs([...state.clubEdit, v]); setClubs(state.clubEdit); render(); break; }
    case "club-reset": state.clubEdit=CLUBS.slice(); setClubs(state.clubEdit); render(); break;
    case "rechoose": state.sp=d.player; state.sd=d.date; state.pick=null; state.draft=null; state.confirm=null; saveDraft(); state.sheet="pick"; render(); window.scrollTo({top:0}); break;
    case "pause": d.paused=true; state.confirm=null; saveDraft(); render(); window.scrollTo({top:0}); break;
    case "resume": d.paused=false; saveDraft(); render(); break;
    case "discard": state.draft=null; state.confirm=null; saveDraft(); render(); break;
    case "cancel-confirm": state.confirm=null; render(); break;
    case "ask-del-round": state.confirm="del:"+b.dataset.id; render(); break;
    case "del-round": try{ await store.delRound(b.dataset.id); state.confirm=null; toast("削除しました"); render(); }catch(e){ writeErr(e); } break;
    case "edit-round": {
      const r=state.rounds.find(x=>x.id===b.dataset.id); if(!r) return;
      state.draft={...JSON.parse(JSON.stringify(r)), editing:true}; state.draft.holes.forEach(x=>x.entered=true);
      state.hole=0; state.tab="record"; saveDraft(); render(); break;
    }
    case "new-course": state.courseEdit=newCourse(); render(); break;
    case "edit-course": { if(b.dataset.id.startsWith("preset:")){ const pc=PRESET_COURSES.find(x=>"preset:"+x.key===b.dataset.id); if(!pc) break;
        state.courseEdit={ id:uid(), name:pc.name, presetKey:pc.key, presetId:b.dataset.id, isNew:false, fromPreset:true, pref:pc.pref, area:pc.area, two:false, gn:["MG","SG"], holes:pc.holes.map(x=>({...x})) }; render(); window.scrollTo({top:0}); break; }
      const c=state.courses.find(x=>x.id===b.dataset.id); const g=courseGreens(c); state.courseEdit={...JSON.parse(JSON.stringify(c)), isNew:false, two:!!g, gn:g||["MG","SG"], pref:cPref(c), area:cArea(c)}; render(); break; }
    case "cancel-course": state.courseEdit=null; render(); break;
    case "allpar": state.courseEdit.holes.forEach(x=>x.par=+b.dataset.p); render(); break;
    case "setpar": state.courseEdit.holes[+b.dataset.i].par=+b.dataset.p; render(); break;
    case "save-course": {
      const e=state.courseEdit;
      if(!e.name.trim()){ $("#c-err").textContent="コース名を入れてください"; return; }
      const c={ id:e.id, name:e.name.trim(), holes:e.holes.map(x=>{ const o={par:x.par, yards:x.yards||null}; if(e.two && x.yards2) o.yards2=x.yards2; return o; }), createdAt:e.createdAt||Date.now() };
      if(e.two && c.holes.some(x=>x.yards2)) c.holes[0].gn=[e.gn[0]||"A", e.gn[1]||"B"];
      if(e.pref) c.holes[0].pref=e.pref; if(e.area) c.holes[0].area=e.area;
      try{ await store.saveCourse(c); if(e.presetId){ const F=favs(); if(F.includes(e.presetId)) LS.set("sc.favs",F.map(x=>x===e.presetId?c.id:x)); } state.courseEdit=null; toast("コースを保存しました"); render(); }catch(err){ writeErr(err); }
      break;
    }
    case "ask-del-course": state.confirm="delc:"+b.dataset.id; render(); break;
    case "del-course": try{ await store.delCourse(b.dataset.id); state.confirm=null; state.courseEdit=null; LS.set("sc.favs", favs().filter(x=>x!==b.dataset.id)); toast("コースを削除しました"); render(); }catch(e){ writeErr(e); } break;
  }
});
function mark_entered(){ const d=state.draft; if(d) d.holes[state.hole].entered=true; }
function newCourse(){ return { id:uid(), name:"", isNew:true, pref:LS.get("sc.pref",""), area:"", two:false, gn:["MG","SG"], holes:Array.from({length:9},()=>({par:3,yards:null})) }; }

/* ---------- demo data (never saved) ---------- */
const DEMO = (() => {
  const pars=[3,3,3,4,3,3,3,3,4];
  const c={id:"demo-c", name:"サンプル・パー3コース", holes:pars.map(p=>({par:p,yards:p===3?95:210}))};
  let seed=7; const rnd=()=>{ seed=(seed*16807)%2147483647; return seed/2147483647; };
  const dirs=["on","on","on","left","right","long","short","short","right"];
  const rs=[];
  const mk=(player,skill,dates)=>dates.forEach((dt,ri)=>{
    const holes=pars.map(p=>{ const dir=dirs[Math.floor(rnd()*dirs.length)]; const gir=dir==="on"&&p===3 || (p===4&&rnd()<.4);
      const putts = rnd()<.15?1:(rnd()<skill-ri*0.03?3:2); const bunker=!gir&&rnd()<.18; const ob=rnd()<.05;
      const strokes=Math.max(putts+1,(gir?p-2:p-1+(rnd()<.35?1:0))+putts+(bunker?1:0)+(ob?2:0)-(!gir&&putts===1?0:0));
      return {par:p,strokes,putts,dir,bunker,ob}; });
    rs.push({id:"demo-"+player+ri, player, courseId:c.id, courseName:c.name, date:dt, createdAt:ri, holes});
  });
  mk("たろう",.35,["2026-07-05","2026-07-26","2026-08-16","2026-09-06","2026-09-27","2026-10-11"]);
  mk("はなこ",.22,["2026-07-05","2026-08-16","2026-09-27","2026-10-11"]);
  return {courses:[c], rounds:rs};
})();

if(state.draft){ const i=state.draft.holes.findIndex(x=>!x.entered); state.hole = i<0 ? state.draft.holes.length-1 : i; }
render();
connect();
})();
</script>
