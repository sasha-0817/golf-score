        const blob = await shotCard(card);
        const file = new File([blob], `golfsc-${state.result.date}${state.resultAll?"-all":""}.png`, {type:"image/png"});
        await shareFiles([file]);
      }catch(e){ if(e && e.name!=="AbortError") toast("画像を作れませんでした"); }
      b.disabled=false; b.textContent="画像を保存・送る"; break;
    }
    case "save-all": { // みんな＋1人ずつの画像をまとめて作り、1回で共有（iPhone は写真にまとめて保存できる）
      const g=state.resultGroup||[]; if(!g.length || !window.html2canvas){ toast("画像を作れませんでした"); break; }
      const keep={r:state.result, all:state.resultAll}; b.disabled=true; b.textContent="作成中…"; const files=[];
      try{
        for(const v of [null, ...g]){ state.resultAll=!v; if(v) state.result=v; render(); await new Promise(r=>setTimeout(r,80));
          const blob=await shotCard($(".result-card")); files.push(new File([blob], `golfsc-${g[0].date}-${v?files.length:"all"}.png`, {type:"image/png"})); }
      }catch(e){ toast("画像を作れませんでした"); }
      state.result=keep.r; state.resultAll=keep.all; render();
      if(files.length===g.length+1){ try{ await shareFiles(files); }catch(e){ if(e && e.name!=="AbortError") toast("画像を作れませんでした"); } }
      break;
    }
    case "back-to-input": {
      const r=state.result; if(!r) { render(); break; }
      if((state.draft && !state.draft.editing && state.draft.id!==r.id && state.draft.holes.some(x=>x.entered)) || state.cdraft){ toast("記録中のラウンドがあります。保存か破棄をしてから編集してください"); break; }
      state.result=null;
      state.draft={...JSON.parse(JSON.stringify(r)), editing:true}; state.draft.holes.forEach(x=>x.entered=true);
      state.hole=r.holes.length-1; state.tab="record"; LS.set("sc.tab","record"); saveDraft(); render(); break;
    }
    case "close-result": state.result=null; state.resultGroup=null; state.resultAll=false; state.resultGame=null; render(); break;
    case "toggle-round": state.openRound = state.openRound===b.dataset.id ? null : b.dataset.id; state.confirm=null; render(); break;
    case "stat-tab": { const tb=$(".stat-tabs"), y0=tb?tb.getBoundingClientRect().top:0; state.statTab=b.dataset.v; LS.set("sc.statTab",b.dataset.v); state.trendSel=null; render();
      const t2=$(".stat-tabs"); if(t2) window.scrollBy(0, t2.getBoundingClientRect().top-y0); break; } // タブの位置を動かさない
    case "pick-player": state.trendSel=null; state.fPlayer=b.dataset.v; LS.set("sc.fPlayer",state.fPlayer); render(); break;
    case "demo-on": state.demo=true; render(); break;
    case "demo-off": state.demo=false; render(); break;
    case "start": {
      const p=$("#r-player").value.trim(), cid=$("#r-course").value, dt=$("#r-date").value||today();
      if(!p){ $("#r-err").textContent="プレーヤーの名前を入れてください"; return; }
      if(!cid || cid==="__more"){ $("#r-err").textContent="コースを選んでください"; return; }
      let c=state.courses.find(x=>x.id===cid);

        c = { id:uid(), name:pc.name, presetKey:pc.key, holes:pc.holes.map((x,i)=>i?{...x}:{...x, pref:pc.pref, area:pc.area}), createdAt:Date.now() };
        upsert(state.courses,c); cache(); store.saveCourse(c).catch(()=>{ pendingCourses=pendingCourses.filter(x=>x.id!==c.id).concat([c]); LS.set("sc.pendingCourses",pendingCourses); }); // 電波がなくても始められるように、保存は裏で（失敗したら次に接続したとき送る）
        const F=favs(); if(F.includes(cid)) LS.set("sc.favs", F.map(x=>x===cid?c.id:x)); }
      if(!c) return;
      { const F=favs(); if(!F.includes(c.id)) LS.set("sc.favs",[...F,c.id]); }
      LS.set("sc.lastCourse", c.id); state.pick=null; state.sp=null; state.sd=null;
      // キーボードが開いたまま・画面が下にずれたまま記録画面に入ると、iPhone で高さの計算がずれて図が小さくなることがあるので、閉じて上に戻す

      if(state.im==="card"){
        const names=[p,...mates];
        const N=c.holes.length;
        state.cdraft={ id:uid(), card:true, courseId:c.id, courseName:c.name, date:dt, holes:c.holes.map(x=>({par:x.par})), players:names.map(n=>({name:n, s:Array(N).fill(null), p:Array(N).fill(null)})), sel:{h:0,i:0,k:"s"}, game: gameFits(state.game, 1+mates.length) && state.game ? state.game : null, carry: !!state.skinCarry };
        saveCDraft(); render(); break; }
      const gs=courseGreens(c), gi=gs ? (+($("#r-green")||{}).value||0) : 0;
      state.draft={ id:uid(), player:p, courseId:c.id, courseName:c.name, date:dt, gn:gs, holes:c.holes.map(x=>({par:x.par, yards:(gi&&x.yards2)?x.yards2:(x.yards||null), ys:gs?[x.yards||null,x.yards2||null]:null, gi, strokes:x.par, putts:2, dir:null, bunker:false, ob:false, pen:false, tee:null, club:null, entered:false})),
        mates: mates.map(n=>({name:n, s:c.holes.map(x=>x.par)})), game: gameFits(state.game, 1+mates.length) && state.game ? state.game : null, carry: !!state.skinCarry }; // 同伴者は打数だけ（パーから増減）
      state.hole=0; saveDraft(); render(); break;
    }
    case "hole": mark_entered(); state.slide = +b.dataset.i>state.hole?"l":"r"; state.hole=+b.dataset.i; saveDraft(); render(); break;
    case "sv": { const v=+b.dataset.v; h.strokes = v===8 ? (h.strokes>=8 ? h.strokes+1 : 8) : v; if(h.strokes>15) h.strokes=8; if(h.putts>h.strokes-1) h.putts=Math.max(0,h.strokes-1); h.entered=true; saveDraft(); render(); break; }
    case "pv": h.putts=+b.dataset.v; if(h.strokes<h.putts+1) h.strokes=h.putts+1; h.entered=true; saveDraft(); render(); break;
    case "st": h.strokes=Math.max(1,Math.min(15,h.strokes+ +b.dataset.d)); if(h.putts>h.strokes-1) h.putts=Math.max(0,h.strokes-1); h.entered=true; state.tap="st"; saveDraft(); render(); break;
    case "pt": h.putts=Math.max(0,Math.min(9,h.putts+ +b.dataset.d)); if(h.strokes<h.putts+1) h.strokes=Math.min(15,h.putts+1); h.entered=true; state.tap="pt"; saveDraft(); render(); break;
    case "dir": h.dir = h.dir===b.dataset.v ? null : b.dataset.v; h.entered=true; state.tap="dir"; saveDraft(); render(); askClub(h.dir); break;
    case "tog": h[b.dataset.k]=!h[b.dataset.k]; h.entered=true; saveDraft();
      render(); break;
    case "prev": mark_entered(); state.slide="r"; state.hole--; saveDraft(); render(); break;
    case "next": mark_entered(); state.slide="l"; state.hole++; saveDraft(); render(); window.scrollTo({top:0}); break;

        holes:d.holes.map((x,i)=>({par:x.par, strokes:m.s[i], putts:0, dir:null, bunker:false, ob:false, pen:false, tee:null, club:null})) })) : [];

    case "cd-half": { const cd=state.cdraft; cd.half=+b.dataset.v; cd.sel={h:cd.half*9, i:0, k:"s"}; saveCDraft(); render(); break; }
    case "cd-putts": { const f=fields(); f.putts=!f.putts; LS.set("sc.fields",f); const cd=state.cdraft; if(!f.putts && cd.sel.k==="p") cd.sel.k="s"; render(); break; }
    case "cd-pause": state.cdraft.paused=true; state.confirm=null; saveCDraft(); render(); window.scrollTo({top:0}); break;
    case "cd-resume": state.cdraft.paused=false; saveCDraft(); render(); break;
    case "cd-discard": state.cdraft=null; state.confirm=null; saveCDraft(); render(); break;
    case "cd-finish": await cardFinish(b); break;
    case "result-pick": { const g=state.resultGroup||[]; const r=g.find(x=>x.id===b.dataset.id); if(r){ state.result=r; state.resultAll=false; state.fPlayer=r.player; state.openRound=r.id; render(); } break; }
    case "result-all": state.resultAll=true; render(); break;
    case "pick-course": state.pick=b.dataset.id; state.sheet=null; state.pickAdd=false; render(); break;
    case "add-fav-pick": { const F=favs(); if(!F.includes(b.dataset.id)) LS.set("sc.favs",[...F,b.dataset.id]); state.pick=b.dataset.id; state.sheet=null; state.pickAdd=false; render(); break; }
    case "pick-add": state.pickAdd=true; render(); break;
    case "open-pick": state.sheet="pick"; state.pickPref=undefined; render(); break;
    case "close-pick": state.sheet=null; state.pickAdd=false; render(); break;
    case "fav": { const F=favs(), id=b.dataset.id; LS.set("sc.favs", F.includes(id)?F.filter(x=>x!==id):[...F,id]); render(); break; }
    case "add-preset": {
      const pc = PRESET_COURSES.find(x=>x.key===b.dataset.k); if(!pc) break;
      const c = { id:uid(), name:pc.name, presetKey:pc.key, holes:pc.holes.map((x,i)=>i?{...x}:{...x, pref:pc.pref, area:pc.area}), createdAt:Date.now() };
      try{ await store.saveCourse(c); toast(`${pc.name}を追加しました`); }catch(e){ writeErr(e); } break;
    }
    case "open-fields": state.sheet="fields"; render(); break;
    case "close-sheet": { const h0=state.draft&&state.draft.holes[state.hole]; if(h0) h0.clubAuto=false; state.sheet=null; state.clubFor=null; saveDraft(); render(); break; }
    case "tee": h.tee = h.tee===b.dataset.v ? null : b.dataset.v; h.entered=true; state.tap="tee"; saveDraft(); render(); askClub(h.tee); break;
    case "club": {
      if(state.clubFor){ // OB・1ペナ: そのクラブを付けたり外したりする（赤い＝OBしたクラブ）
        const k=state.clubFor, v=b.dataset.v, e=evs(h,k).filter(Boolean);
        h[k+"C"] = e.includes(v) ? e.filter(x=>x!==v) : e.concat([v]); h[k]=h[k+"C"].length>0; state.clubFor=null; }
      else { h.club = (h.club===b.dataset.v && !h.clubAuto) ? null : b.dataset.v; h.clubAuto=false; }
      h.entered=true; state.sheet=null; saveDraft(); render(); break; }
    case "mate-clear": { const v=[0,1,2].map(j=>(($("#r-mate"+j)||{}).value||"")); v[+b.dataset.i]=""; state.mates=v; LS.set("sc.mates",v); render(); break; }
    // 同伴者の打数: 枠をタップすると大きな数字キーが出る。押すと次の人へ（最後の人で閉じる）
    case "mt-open": state.mateI=+b.dataset.i; if(!b.closest(".mate-sheet")) state.mateThen=null; state.sheet="mate"; render(); break;
    case "mt-key": { const k=state.mateI, m=d.mates[k]; if(!m) break; const v=b.dataset.v;
      m.s[state.hole] = v==="10" ? (m.s[state.hole]>=10 ? Math.min(15,m.s[state.hole]+1) : 10) : +v; saveDraft();
      if(v!=="10" || m.s[state.hole]===10){ if(k+1<d.mates.length) state.mateI=k+1; else { mateDone(); break; } }
      render(); break; }
    case "mt-ok": mateDone(); break;
    case "mt-close": state.sheet=null; state.mateI=null; state.mateThen=null; render(); break;
    case "mt": { const m=d.mates[+b.dataset.i]; m.s[state.hole]=Math.max(1,Math.min(15,m.s[state.hole]+ +b.dataset.d)); saveDraft(); render(); break; }
    case "tb": { const k=b.dataset.k; h[k]=!evs(h,k).length; delete h[k+"C"]; h.entered=true; saveDraft(); render(); break; }
    case "open-club": openClubSheet(); render(); break;
    case "club-quick": h.club = h.club===b.dataset.v ? null : b.dataset.v; h.entered=true; saveDraft(); render(); break;
    case "set-g": { const ni=+b.dataset.g; if((h.gi||0)===ni) break; d.holes.forEach(x=>{ if(x.ys && x.ys[ni]){ x.gi=ni; x.yards=x.ys[ni]; } }); saveDraft(); render(); toast(`全ホールを${d.gn[ni]}のヤードにしました`); break; }
    case "swap-g": { const ni=1-(h.gi||0); d.holes.forEach((x,i)=>{ if(i>=state.hole && x.ys && x.ys[ni]){ x.gi=ni; x.yards=x.ys[ni]; } }); saveDraft(); render(); toast(`${d.gn[ni]}にしました（このホールから先）`); break; }
    case "open-clubs": state.clubBack=state.sheet; state.clubEdit=myClubs(); state.sheet="clubs"; render(); break;
    case "close-clubs": { const l=(state.clubEdit||[]).map(x=>String(x).trim()).filter(Boolean); setClubs(l.length?l:CLUBS); state.clubCustom=null; state.clubEdit=null; state.sheet=state.clubBack||null; state.clubBack=null; render(); break; }
    case "club-out": state.clubEdit=state.clubEdit.filter(x=>x!==b.dataset.v); setClubs(state.clubEdit); render(); break;
    case "club-in": if(state.clubEdit.length>=CLUB_MAX){ toast(`クラブは${CLUB_MAX}本まで（パター除く）。左から外してください`); break; }
      state.clubEdit=sortClubs([...state.clubEdit, b.dataset.v]); setClubs(state.clubEdit); render(); break;
    case "club-custom": { const el=$("#cl-new"), v=(el&&el.value||"").trim().slice(0,6); if(!v) break;
      if(state.clubEdit.includes(v)){ toast("すでに入っています"); break; }
      if(state.clubEdit.length>=CLUB_MAX){ state.clubCustom=[...(state.clubCustom||[]), v]; toast(`${CLUB_MAX}本入っているので候補に追加しました`); render(); break; }
      state.clubEdit=sortClubs([...state.clubEdit, v]); setClubs(state.clubEdit); render(); break; }
    case "club-reset": state.clubEdit=CLUBS.slice(); setClubs(state.clubEdit); render(); break;
    case "pause": d.paused=true; state.confirm=null; saveDraft(); render(); window.scrollTo({top:0}); break;
    case "resume": d.paused=false; saveDraft(); render(); break;
    case "discard": state.draft=null; state.confirm=null; saveDraft(); render(); break;
    case "cancel-confirm": state.confirm=null; render(); break;
    case "ask-del-round": state.confirm="del:"+b.dataset.id; render(); break;
    case "del-round": try{ await store.delRound(b.dataset.id); state.confirm=null; toast("削除しました"); render(); }catch(e){ writeErr(e); } break;
    case "edit-round": {
      const r=state.rounds.find(x=>x.id===b.dataset.id); if(!r) return;
      // 記録中・中断中のラウンドがあるときに上書きしない
      if((state.draft && !state.draft.editing && state.draft.holes.some(x=>x.entered)) || state.cdraft){ toast("記録中のラウンドがあります。保存か破棄をしてから編集してください"); break; }
      state.draft={...JSON.parse(JSON.stringify(r)), editing:true}; state.draft.holes.forEach(x=>x.entered=true);
      state.hole=0; state.tab="record"; saveDraft(); render(); break;
    }
    case "new-course": state.courseEdit=newCourse(); render(); break;
    case "edit-course": { if(b.dataset.id.startsWith("preset:")){ const pc=PRESET_COURSES.find(x=>"preset:"+x.key===b.dataset.id); if(!pc) break;
        state.courseEdit={ id:uid(), name:pc.name, presetKey:pc.key, presetId:b.dataset.id, isNew:false, fromPreset:true, pref:pc.pref, area:pc.area, two:pc.holes.some(x=>x.yards2), gn:(pc.holes[0].gn||["MG","SG"]).slice(), holes:pc.holes.map(x=>({...x})) }; render(); window.scrollTo({top:0}); break; }
      const c=state.courses.find(x=>x.id===b.dataset.id); const g=courseGreens(c); state.courseEdit={...JSON.parse(JSON.stringify(c)), isNew:false, two:!!g, gn:g||["MG","SG"], pref:cPref(c), area:cArea(c)}; render(); break; }
    case "cancel-course": state.courseEdit=null; render(); break;
    case "allpar": state.courseEdit.holes.forEach(x=>x.par=+b.dataset.p); render(); break;
    case "setpar": state.courseEdit.holes[+b.dataset.i].par=+b.dataset.p; render(); break;
    case "save-course": {
      const e=state.courseEdit;
      if(!e.name.trim()){ $("#c-err").textContent="コース名を入れてください"; return; }
      const c={ id:e.id, name:e.name.trim(), holes:e.holes.map(x=>{ const o={par:x.par, yards:x.yards||null}; if(e.two && x.yards2) o.yards2=x.yards2; return o; }), createdAt:e.createdAt||Date.now() };
      if(e.two && c.holes.some(x=>x.yards2)) c.holes[0].gn=[e.gn[0]||"A", e.gn[1]||"B"];
      if(e.pref) c.holes[0].pref=e.pref; if(e.area) c.holes[0].area=e.area;
      try{ await store.saveCourse(c); if(e.presetId){ const F=favs(); if(F.includes(e.presetId)) LS.set("sc.favs",F.map(x=>x===e.presetId?c.id:x)); } state.courseEdit=null; toast("コースを保存しました"); render(); }catch(err){ writeErr(err); }
      break;
    }
    case "ask-del-course": state.confirm="delc:"+b.dataset.id; render(); break;
    case "del-course": try{ await store.delCourse(b.dataset.id); state.confirm=null; state.courseEdit=null; LS.set("sc.favs", favs().filter(x=>x!==b.dataset.id)); toast("コースを削除しました"); render(); }catch(e){ writeErr(e); } break;
  }
});
function mark_entered(){ const d=state.draft; if(d) d.holes[state.hole].entered=true; }
function newCourse(){ return { id:uid(), name:"", isNew:true, pref:LS.get("sc.pref",""), area:"", two:false, gn:["MG","SG"], holes:Array.from({length:9},()=>({par:3,yards:null})) }; }

/* ---------- demo data (never saved) ---------- */
const DEMO = (() => {
  // ファーツリーと同じ並び（パー3が7つ、パー4が2つ）で、全部の項目を記録した20ラウンド分
  const L=[[3,76],[3,102],[3,88],[4,284],[3,109],[3,84],[4,366],[3,55],[3,160]];
  const c={id:"demo-c", name:"サンプル・ショートコース", holes:L.map(([p,y],i)=>({par:p,yards:y, ...(i?{}:{pref:"宮崎県",area:"延岡市"})}))};
  let seed=11; const rnd=()=>{ seed=(seed*16807)%2147483647; return seed/2147483647; };
  const pick=(o)=>{ let r=rnd(), t=0; for(const k in o){ t+=o[k]; if(r<t) return k; } return Object.keys(o)[0]; };
  const CL={55:"58°",76:"PW",84:"9I",88:"9I",102:"8I",109:"7I",160:"5I"};
  const ON={"58°":.6,PW:.55,"9I":.5,"8I":.42,"7I":.34,"5I":.2,"1W":0,"5W":0};
  const rs=[];
  const mk=(player,lvl,missBias,dates)=>dates.forEach((dt,ri)=>{
    const g = ri/dates.length*0.12; // だんだん上手くなる
    const holes=L.map(([p,y])=>{
      let club, dir=null, tee=null, ob=false, pen=false, bunker=false, toGreen;
      if(p===3){ club=CL[y]; const on = rnd() < ON[club]+lvl+g; dir = on ? "on" : pick(missBias);
        bunker = !on && rnd()<.22; pen = !on && y>=100 && rnd()<.05; ob = !on && rnd()<.03;
        toGreen = on ? 1 : 2 + (bunker && rnd()<.4 ? 1 : 0) + (dir==="miss" && rnd()<.5 ? 1 : 0); }
      else { club = y>300 ? "1W" : (rnd()<.5?"1W":"5W"); tee = rnd()<.45+lvl+g ? "fw" : pick({rl:.35,rr:.45,miss:.2});
        ob = tee!=="fw" && rnd()<.12; pen = tee!=="fw" && !ob && rnd()<.08; bunker = rnd()<.15;
        const gir = rnd() < (tee==="fw" ? .38 : .14)+g; toGreen = gir ? 2 : 3 + (bunker && rnd()<.4 ? 1 : 0); }
      const onGir = toGreen <= p-2;
      const putts = onGir ? (rnd()<.12?1:rnd()<.85-g?2:3) : (rnd()<.38+g?1:rnd()<.93?2:3);
      const strokes = toGreen + putts + (ob?2:0) + (pen?1:0);
      return {par:p, strokes, putts, dir, tee, club, bunker, ob, pen}; });
    rs.push({id:"demo-"+player+ri, player, courseId:c.id, courseName:c.name, date:dt, createdAt:ri, holes});
  });
  const d0=new Date("2026-04-05"); const dates=(k,step)=>Array.from({length:k},(_,i)=>{ const d=new Date(d0); d.setDate(d.getDate()+i*step); return d.toISOString().slice(0,10); });
  mk("たろう",0,{right:.42,short:.24,left:.14,long:.1,miss:.1},dates(20,9));
  mk("はなこ",.06,{short:.4,left:.3,right:.15,long:.1,miss:.05},dates(10,18));
  return {courses:[c], rounds:rs};
})();

if(state.draft){ const i=state.draft.holes.findIndex(x=>!x.entered); state.hole = i<0 ? state.draft.holes.length-1 : i; }
render();
connect();
})();
</script>
